        type: number
        description: How many times the runner may retry this job. The condition is runner_system_failure
          only, so this retries infrastructure and never a failed gate.
        default: 1
        options:
          - 0
          - 1
          - 2
      run-rules:
        type: array
        description: Job eligibility set by the composition.
        default:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
      severity-threshold:
        type: string
        description: Minimum finding severity that gates, on the canonical scale shared with
          security-filesystem-grype. It is translated into trivy's severity list, so `high`
          gates on HIGH and CRITICAL. This is the same meaning the grype component gives the
          input; the two are interchangeable in that respect, and differ only in the ignore-unfixed
          default each preserves.
        options:
          - critical
          - high
          - medium
          - low
          - negligible
        default: high
      scanners:
        type: string
        description: 'trivy scanners to run, comma separated. `vuln` must be present: the
          component records the vulnerability database snapshot as evidence and fails when
          there is none, and trivy only populates that database when a vulnerability scan
          runs. This is filesystem scanning of dependencies, secrets and IaC misconfiguration;
          it does not replace image scanning or complete SAST coverage.'
        default: vuln,secret,misconfig
      skip-dirs:
        type: string
        description: Directories to skip, comma separated, relative to the scan root.
        default: ''
      ignore-unfixed:
        type: boolean
        description: 'Ignore findings with no fix available. The default is false, which preserves
          the current estate behaviour: unfixed findings gate this filesystem scan. security-filesystem-grype
          defaults the same input to true for the same reason, because that is what its template
          does today.'
        default: false
      policy-mode:
        type: string
        description: blocking fails the job on a finding at or above the threshold; advisory
          records it and succeeds. A crash, a malformed report or a missing vulnerability
          database fails the job in both modes.
        options:
          - blocking
          - advisory
        default: blocking
