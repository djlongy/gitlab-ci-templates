          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
      working-directory:
        type: string
        description: Go module root in the consumer checkout.
        default: .
      import-path:
        type: string
        description: Go import path to build, relative to working-directory.
        default: .
      image-repository:
        type: string
        description: Fully qualified repository with no tag and no digest. ko builds in --bare
          mode, so the image lands at exactly this repository.
        regex: ^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$
      tags:
        type: array
        description: 'Tag aliases to push. Nothing is added implicitly: a release alias such
