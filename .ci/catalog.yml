pipelines:
  - name: ansible-verify
    kind: pipeline
    path: pipelines/ansible-verify.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Repository identifier. Jobs are `<instance>:ansible-lint`, `<instance>:ansible-syntax`,
          `<instance>:security-secrets-gitleaks` and, when enabled, `<instance>:ansible-check`.
        regex: ^[a-z][a-z0-9-]{0,47}$
      working-directory:
        type: string
        description: Directory the playbook and inventory paths are relative to, itself relative
          to the consumer checkout.
        default: .
      playbook:
        type: string
        description: Playbook checked for syntax, relative to working-directory.
        regex: ^[A-Za-z0-9._/-]{1,200}\.ya?ml$
      inventory:
        type: string
        description: 'Inventory file or directory, relative to working-directory. Required
          for check mode: without it ansible-playbook falls back to the implicit localhost
          and reports a clean check of nothing.'
        default: ''
      extra-vars-file:
        type: string
        description: One non-secret variables file, relative to working-directory. Secrets
          belong in the vault password mechanism or a CI variable, never here.
        default: ''
      check-mode:
        type: string
        description: Run `ansible-playbook --check` in the plan stage. Needs `inventory`.
          Off by default because it connects to managed hosts.
        options:
          - 'true'
          - 'false'
        default: 'false'
      limit:
        type: string
        description: Host pattern passed to --limit during check mode. Empty means every host
          the play targets. An inventory filename does not prove a disjoint host set.
        default: ''
      vault-password-secret:
        type: string
        description: Name of the CI variable holding the Ansible Vault passphrase. The name,
          never the value. Empty means the repository has no vaulted files.
        default: ''
      runner-tags:
        type: array
        description: Approved runner selection from the estate profile.
        default: []
      lint-image:
        type: string
        description: Approved ansible-lint image pinned by digest.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/pipelinecomponents/ansible-lint@sha256:1c4d2abd372a2dce7ea1cb8e27b650db809115d410a87a4aba2438bd028de735
      execution-image:
        type: string
        description: Approved Ansible execution environment pinned by digest, carrying ansible-core
          and the pinned collections. Used by syntax and check.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: registry.example.com/shared/base/ansible-ee@sha256:64703d0cec04567ef5b5108b755528ad911db3a6ebb5dfa90d20cabc145d3c9b
      gitleaks-image:
        type: string
        description: Approved gitleaks image pinned by digest.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:ansible-lint'
        stage: verify
        blocking: true
      - pattern: '{instance}:ansible-syntax'
        stage: verify
        blocking: true
      - pattern: '{instance}:security-secrets-gitleaks'
        stage: verify
        blocking: true
      - pattern: '{instance}:ansible-check'
        stage: plan
        blocking: true
    outputs: []
    required_secrets:
      - name: ANSIBLE_VAULT_PASSWORD
        kind: ci-variable
        scope: Needed only when the tree contains Ansible Vault encrypted files, because ansible-lint
          runs a syntax check that has to decrypt them. The component takes the variable NAME
          through the vault-password-secret input; this entry records the name platform/infrastructure
          uses today. It must be a masked variable and not a file type variable, since the
          job reads its value.
        protected_ref_required: true
      - name: ANSIBLE_PRIVATE_KEY_FILE
        kind: file-variable
        scope: 'SSH credential for the managed hosts. The component does not manage key material:
          a file type CI variable of this name sets the variable to the path of the file the
          runner wrote, which is exactly what Ansible expects, so no handling is needed and
          none is added. Scope the variable to protected refs so an untrusted merge request
          pipeline cannot reach the fleet with it.'
        protected_ref_required: true
    runtime_image:
      reference: 'per component: every include forwards a digest-pinned execution image, and
        the ones a consumer may need to change are inputs of this composition'
      pinning: input
    trust:
      privileged: false
      network_egress:
        - registry.example.com
        - managed hosts on tcp/22 for the selected inventory
      runner_profile: shared-docker, the estate instance runners. They are registered untagged,
        so runner-tags selects nothing today and a tag is not a permission boundary.
      protected_ref_required: true
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint
      notes: 'Verification only; nothing is deployed and no deploy stage is declared, because
