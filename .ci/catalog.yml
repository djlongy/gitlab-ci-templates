        format: JSON
        schema: section 9.2 scan-result, schema_version 1
        subject_identity: project path and commit SHA of the scanned configuration.
        retention: 1 week
    required_secrets: []
    runtime_image:
      reference: 'per component: every include forwards a digest-pinned execution image, and
        the ones a consumer may need to change are inputs of this composition'
      pinning: input
    trust:
      privileged: false
      network_egress:
