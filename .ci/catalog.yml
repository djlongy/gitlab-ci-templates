          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
      rules-ref:
        type: string
        description: Rule source passed to `semgrep --config`. Required, with no default,
          so that the ruleset is a deliberate choice. A path inside the consumer checkout
          (`ci/semgrep-rules.yml`) or an immutable URL is a pinned scan configuration; a registry
          pack such as `p/default` is fetched live and changes without a commit, so the evidence
          records it as unpinned rather than pretending the scan is reproducible.
