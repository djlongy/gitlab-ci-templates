      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
        - runtime-tested
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18
      notes: 'Scope. Dependency vulnerability scanning of a source tree, the Anchore counterpart
        to security-filesystem-trivy. It finds neither secrets nor IaC misconfiguration, so
        it is not a drop-in replacement for the trivy component despite the shared input names.
        Failure semantics. `blocking` (the default, matching current estate behaviour) fails
        the job on a finding at or above severity-threshold; advisory records it and succeeds.
        An execution failure fails the job in BOTH modes. grype 0.118.0 was measured rather
        than read: with --fail-on it exits 2 for findings at or above the threshold and 1
        for an execution error, the opposite of what its documentation implies, and the wrapper''s
        table carries the measured values. The database is gated twice: `grype db update`
        must succeed and `grype db status` must report `valid`, and the build timestamp is
        recorded as the database snapshot in the evidence. A missing or empty report fails
        the job, as does grype exiting 0 while the report carries findings at or above the
        threshold. One scan renders JSON, SARIF, the severity list and the gate status, so
        the published evidence is the scan that was gated. ignore-unfixed defaults to true,
        which is what this template does today (--only-fixed); security-filesystem-trivy defaults
        it to false for the same preserve-current-behaviour reason. SARIF is a plain artifact,
        not `reports: sast:` (section 10.3, estate report mode artifact-only). The -debug
        image variant is required: the default anchore/grype image is built FROM scratch and
        has no shell for a job script to run in. Evidence: unit tests in tests/runtime/scan/,
        exit codes and the multi-output/template rendering measured against the pinned image
        on 2026/09/15, CI Lint through tests/pipelines/. No pipeline has executed this component.'
  - name: security-filesystem-trivy
    kind: component
    path: templates/security-filesystem-trivy/template.yml
    status: released
    inputs:
      instance:
        type: string
        description: Unique workload instance used in the job name.
        regex: ^[a-z][a-z0-9-]{0,47}$
      stage:
        type: string
        description: Stage supplied by the owning composition.
        default: verify
      working-directory:
        type: string
        description: Source root to scan, relative to the consumer checkout.
        default: .
      execution-image:
        type: string
        description: Approved trivy image pinned by digest. The default is the estate mirror
          of aquasec/trivy:0.69.3, the last release before the 0.69.4 supply-chain compromise.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
      runner-tags:
        type: array
