        producer: '{instance}:security-filesystem-trivy'
        format: trivy JSON
        subject_identity: source commit CI_COMMIT_SHA under the declared working directory
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-filesystem-trivy/trivy-fs.sarif
        producer: '{instance}:security-filesystem-trivy'
        format: SARIF 2.1.0, converted from trivy-fs.json
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-filesystem-trivy/trivy-fs-table.txt
        producer: '{instance}:security-filesystem-trivy'
        format: human-readable table of the gated severities
