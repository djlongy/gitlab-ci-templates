  - name: container-build-buildkit
    kind: component
    path: templates/container-build-buildkit/template.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Unique workload instance used in the job name.
        regex: ^[a-z][a-z0-9-]{0,47}$
      stage:
        type: string
        description: Stage supplied by the owning composition.
        default: build
      execution-image:
        type: string
        description: Approved BuildKit execution image pinned by digest. The default is moby/buildkit:v0.18.2
          through the estate's Docker Hub mirror.
        default: docker.io/moby/buildkit@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552
        regex: ^.+@sha256:[0-9a-f]{64}$
      runner-tags:
        type: array
        description: Runner selection from the estate profile. The estate's instance runners
          are registered untagged, so the default selects them.
        default: []
      max-retries:
        type: number
        description: How many times the runner may retry this job. The condition is runner_system_failure
          only, so this retries infrastructure and never a failed gate.
        default: 1
        options:
          - 0
          - 1
          - 2
      run-rules:
        type: array
        description: Job eligibility set by the composition. Pushing a candidate image is
          a mutation, so the default requires a default-branch push or a tag and never fires
          on a merge request pipeline.
        default:
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
      working-directory:
        type: string
        description: Directory in the consumer checkout the build runs from.
        default: .
      context:
        type: string
        description: Build context, relative to working-directory.
        default: .
      dockerfile:
        type: string
        description: Dockerfile name, relative to context.
        default: Dockerfile
      image-repository:
        type: string
        description: Fully qualified repository with no tag and no digest, for example registry.example.com/dev/platform/demo-app.
        regex: ^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$
      tags:
        type: array
        description: Tag aliases to push. They are human-readable pointers; the identity this
          job records is always the digest.
        default:
          - $CI_COMMIT_SHORT_SHA
      build-args:
        type: array
        description: Build arguments as NAME=VALUE entries.
        default: []
      platforms:
        type: string
        description: Comma-separated platform list passed to BuildKit.
        default: linux/amd64
      push-candidate:
        type: boolean
        description: Push the result to the candidate registry. When false the job builds
          only, produces no image.json, and nothing downstream can consume it.
        default: true
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:container-build-buildkit'
        stage: build
        blocking: true
    outputs:
      - path: .ci-artifacts/{instance}/container-build-buildkit/image.json
        producer: '{instance}:container-build-buildkit'
        format: json
        schema: image identity schema 1, section 9.1
        subject_identity: repository@sha256 digest, taken from BuildKit's exported metadata
        retention: 1 week
      - path: .ci-artifacts/{instance}/container-build-buildkit/build.env
        producer: '{instance}:container-build-buildkit'
        format: dotenv
        schema: CI_TPL_IMAGE_REFERENCE and CI_TPL_IMAGE_PUSHED
        subject_identity: same digest as image.json; convenience only, never authoritative
        retention: 1 week
      - path: .ci-artifacts/{instance}/container-build-buildkit/metadata.json
        producer: '{instance}:container-build-buildkit'
        format: json
        schema: BuildKit --metadata-file output, kept as the evidence the digest came from
        retention: 1 week
    required_secrets:
      - name: HARBOR_USER
        kind: ci-variable
        scope: push to the candidate registry project
        protected_ref_required: false
      - name: HARBOR_PASSWORD
        kind: ci-variable
        scope: push to the candidate registry project
        protected_ref_required: false
    runtime_image:
      reference: docker.io/moby/buildkit@sha256:86c0ad9d1137c186e9d455912167df20e530bdf7f7c19de802e892bb8ca16552
      pinning: digest
      tool_versions:
        buildkit: v0.18.2
    trust:
      privileged: false
      network_egress:
        - 'registry.example.com: candidate registry push'
        - every registry named in a FROM line of the consumer Dockerfile
      runner_profile: Docker executor running buildctl-daemonless.sh. The estate's instance
        runners are unprivileged and registered untagged, which is what the current template
        already builds on. A rootless or privileged BuildKit daemon is not required and not
        requested.
      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
      verified_at: 2026/09/15
      notes: 'Failure semantics (section 10.1). The job fails when the image repository carries
        a tag or digest, when a tag alias is not a usable tag, when a build argument is not
        NAME=VALUE, when the registry credentials are absent, when BuildKit exits non-zero,
        and when its metadata file carries no manifest digest. There is no registry-query
        fallback and no tag fallback: the previous template wrote the tag into a field named
        digest and exited 0. With push-candidate false the job records CI_TPL_IMAGE_PUSHED=false,
        writes no image.json, and every downstream component then fails its own identity validation.
        Not runtime-tested: no pipeline has executed this component.'
