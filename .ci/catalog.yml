        and where it is a requirements-style file, that every requirement line is pinned.
        Nothing is inferred from the checkout: the template this replaces detected languages
        by looking for marker files in the root only, so a monorepo with services/api/package.json
        was reported as having no Node project and passed. Declaring the set per language
        root is what makes an unchecked root visible, and the lockfiles input is therefore
        required with no default. Failure semantics. A declared lockfile that is missing,
        empty or unpinned fails the job; there is no advisory mode, because the check has
        no severity scale and nothing to grade. A usage error (an absolute path, a path that
        traverses out of the working directory, an empty declaration, or the `none` sentinel
        combined with a path) exits 2 and fails the job. The literal `none` is a declaration
        and not a path: it says the project has no lockfile, records `declared: none` with
        an empty check list, and passes. It exists because the container compositions always
        instantiate this component, so a project with no third-party dependencies -- a stdlib-only
        Go module, whose go.sum is empty -- could not otherwise get a green pipeline. An empty
        value is still an error, so an input nobody filled in cannot read as one saying there
        is nothing to fill in. Reproducibility is judged per line, not per file: a requirements.txt
        in which one dependency is pinned and the rest float fails, which the previous `grep
        -q "=="` check passed. -r/-c includes, --hash lines and PEP 508 direct references
        count as pinned; an unpinned or range requirement does not. Evidence: unit tests in
        tests/runtime/scan/test_lockfiles.py covering the missing, empty, partially pinned
        and traversal cases, CI Lint through tests/pipelines/. Status: experimental. The component
        HAS run in a consumer pipeline and failed: platform/demo-app (project 56) pipelines
        5734 and 5745, jobs 47796 and 47859, because a stdlib-only Go module had no lockfile
        to declare and an empty declaration is a usage error. The `none` sentinel added in
        1.0.0 is the fix, and it has not itself been run in a pipeline, so there is still
        no green consumer run to promote on.'
  - name: quality-sonarqube
    kind: component
    path: templates/quality-sonarqube/template.yml
    status: released
    inputs:
      instance:
        type: string
        description: Unique workload instance used in the job name.
        regex: ^[a-z][a-z0-9-]{0,47}$
      stage:
        type: string
        description: Stage supplied by the owning composition.
        default: verify
      working-directory:
        type: string
        description: Analysis base directory, relative to the consumer checkout.
        default: .
      execution-image:
        type: string
        description: Approved sonar-scanner image pinned by digest. The default is the estate
          mirror of sonarsource/sonar-scanner-cli:11.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/sonarsource/sonar-scanner-cli@sha256:46341f2c2dc560381414e90347885f5cddc716db080adcbafc1cac13e1473094
      runner-tags:
        type: array
        description: Runner selection from the estate profile.
        default: []
      max-retries:
        type: number
        description: How many times the runner may retry this job. The condition is runner_system_failure
          only, so this retries infrastructure and never a failed gate.
        default: 1
        options:
          - 0
          - 1
          - 2
      run-rules:
        type: array
        description: Job eligibility set by the composition.
        default:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      sarif-report-jobs:
        type: array
        description: 'The producer jobs whose SARIF artifacts this analysis imports, as `needs`
          entries, for example `[{job: ''api:security-sast-semgrep'', artifacts: true}]`.
          Required, with no default. A job named here that the pipeline does not create fails
          pipeline creation, which is the point: a consumer `needs:` override REPLACES this
          list rather than merging with it, and the template this replaces degraded silently
          to "SonarQube''s own analysis only" when that happened. To analyse without importing
          any SARIF, name the jobs this analysis must still follow, such as the test job that
          produces coverage.'
      sarif-report-paths:
        type: string
        description: The SARIF files that must be imported, comma separated and relative to
          working-directory. Each one must exist or the job fails. Left empty, the job imports
          whatever SARIF it discovers, which is right for a standalone analysis and wrong
          for a pipeline whose scanners are supposed to feed it.
        default: ''
      project-key:
        type: string
        description: SonarQube project key. Empty derives `<namespace>:<name>` from the GitLab
          project path, which is the estate's existing convention.
        default: ''
      sources:
        type: string
        description: Analysis sources, comma separated. SARIF results whose file lies outside
          this set are dropped silently by SonarQube, so keep it wide enough to cover everything
          the scanners looked at.
        default: .
      exclusions:
        type: string
        description: Glob patterns to exclude from analysis, comma separated.
        default: ''
      extra-properties:
        type: string
        description: Additional analysis properties as `sonar.key=value` pairs separated by
          semicolons, for example `sonar.python.coverage.reportPaths=coverage.xml;sonar.tests=tests`.
          Each pair is validated against that shape and passed as one quoted argument; this
          is not a shell escape hatch and nothing here is evaluated.
        default: ''
      policy-mode:
        type: string
        description: 'blocking fails the job when the quality gate is red; advisory records
          the gate result and succeeds. An analysis that does not complete, a compute-engine
          task that fails, an unreachable server and a declared SARIF report that is missing
          all fail the job in both modes. The default is advisory because every consumer of
          this template today runs it with allow_failure: true and no gate wait; the gate
          is now always waited on and evaluated, and a composition that wants it to gate sets
          blocking.'
        options:
          - blocking
          - advisory
        default: advisory
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:quality-sonarqube'
        stage: verify
        blocking: false
    outputs:
      - path: .ci-artifacts/{instance}/quality-sonarqube/gate-result.json
        producer: '{instance}:quality-sonarqube'
        format: JSON
        schema: section 9.2 gate-result, schema_version 1; subject, analysis identity, gate
          status with its failed conditions, imported reports, policy mode
        subject_identity: SonarQube project key plus the analysis id the server decided
        retention: 1 week
      - path: .ci-artifacts/{instance}/quality-sonarqube/report-task.txt
        producer: '{instance}:quality-sonarqube'
        format: sonar-scanner metadata, the compute-engine task identity
        retention: 1 week
    required_secrets:
      - name: SONAR_TOKEN
        kind: ci-variable
        scope: analysis token for the project, also used to read the gate result back
        protected_ref_required: false
      - name: SONAR_HOST_URL
        kind: ci-variable
        scope: SonarQube server URL
        protected_ref_required: false
    runtime_image:
      reference: docker.io/sonarsource/sonar-scanner-cli@sha256:46341f2c2dc560381414e90347885f5cddc716db080adcbafc1cac13e1473094
      pinning: digest
      tool_versions:
        sonar-scanner-cli: '11'
    trust:
      privileged: false
      network_egress:
        - registry.example.com
        - sonarqube.example.com
      runner_profile: shared-docker
      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
        - runtime-tested
        - integration-tested
        - report-ingestion-tested
      verified_at: 2026/09/16
      revision: 1.0.0-rc.2
      environment: 'gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint.
        Executed on shared ref 1.0.0-rc.2 in: platform/docs-site (70) 5733 job docs:quality-sonarqube
        and 5737; platform/demo-app (56) 5734 and 5745; platform/infrastructure (3) 5750 job
        47892. On docs-site the job reached "QUALITY GATE STATUS: PASSED" on project key platform:docs-site
        and wrote gate-result.json; the gate result was read back from the server, so the
        analysis was ingested. platform/demo-app imported two SARIF reports and recorded a
        red gate in advisory mode, which is the report-ingestion path end to end. platform/infrastructure
        imported no SARIF and read its gate back as ERROR in advisory mode.'
      notes: 'Failure semantics. The analysis always waits on the quality gate (sonar.qualitygate.wait=true)
        and the decided result is then read back from /api/qualitygates/project_status and
        written to gate-result.json. Upload is not a pass: section 10.3 separates analysis,
        external-report import and the gate, and the template this replaces defaulted the
        wait to false and carried allow_failure: true, so it could not fail for any reason
        at all. A red gate fails the job under `blocking` and is recorded under the default
        `advisory`; the default preserves today''s non-gating behaviour and a composition
        that wants the gate sets blocking. Everything else fails the job in BOTH modes: a
        compute-engine task that did not succeed, an unreachable server, a missing SONAR_TOKEN,
        a missing report-task.txt, a declared SARIF report that is not present, and a gate
        reported OK while sonar-scanner exited non-zero. sonar-scanner uses exit code 1 for
        an analysis error and for a failed gate alike, which is why the decision is read from
        the server rather than inferred from the code. Producers. sarif-report-jobs is required
        with no default and becomes the job''s `needs`. Naming a job the pipeline does not
        create fails pipeline creation, which is the intended contract: a consumer `needs:`
        override REPLACES this list rather than merging with it, and platform/demo-app silently
        stopped importing SARIF that way. sarif-report-paths additionally makes the presence
        of each named report mandatory, so an override that drops the artifacts fails instead
        of quietly analysing without them. SARIF whose file path contains a space or %20 cannot
        be resolved by SonarQube''s importer and is reported as dropped, verified on Community
        Build 26.4 on 2026/09/09. No cache is declared: section 9.4 requires a cache scoped
        by tool version, architecture and trust level, and the scanner cache is an acceleration,
        not evidence. Evidence: unit tests in tests/runtime/scan/test_sonar_gate.py covering
        the gate, task-failure, missing-report and OK-gate-with-failed-scanner paths against
        a stubbed API, CI Lint through tests/pipelines/. No pipeline has executed this component
        and no analysis has been run against sonarqube.example.com from it.'
