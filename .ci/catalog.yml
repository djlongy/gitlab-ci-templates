      - path: .ci-artifacts/{instance}/security-filesystem-trivy/scan-result.json
        producer: '{instance}:security-filesystem-trivy'
        format: JSON
        schema: section 9.2 scan-result, schema_version 1
        subject_identity: project path and commit SHA of the scanned source
        retention: 1 week
    required_secrets: []
    runtime_image:
      reference: docker.io/aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
      pinning: digest
      tool_versions:
        trivy: 0.69.3
    trust:
      privileged: false
      network_egress:
        - registry.example.com
        - the trivy vulnerability database and check bundle sources
      runner_profile: shared-docker
      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
        - runtime-tested
        - integration-tested
      verified_at: 2026/09/16
      revision: 1.0.0-rc.2
      environment: 'gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint.
        Executed on shared ref 1.0.0-rc.2 in: platform/demo-app (56) 5734 and 5745; platform/terraform-hypervisor-roles
        (22) 5735 for both instances; platform/terraform-dns (16) 5736 (merge request) and
        5744 (main) for both instances.'
      notes: 'Scope. Filesystem scanning of dependencies, secrets and IaC misconfiguration.
