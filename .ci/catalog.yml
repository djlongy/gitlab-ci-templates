  - name: repository-secret-audit
    kind: pipeline
    path: pipelines/repository-secret-audit.yml
    status: experimental
    inputs:
      secrets-instance:
        type: string
        description: Instance name for the estate-wide secret scan.
        regex: ^[a-z][a-z0-9-]{0,47}$
        default: secrets
      terraform-instance:
        type: string
        description: Instance name for the Terraform repository audit.
        regex: ^[a-z][a-z0-9-]{0,47}$
        default: terraform
      repositories:
        type: string
        description: 'Explicit set for the secret scan: whitespace-separated full repository
          paths. Supply this or group-path, not both and not neither. It is a string rather
          than an array because GitLab rejects an array as a job variable value.'
        default: ''
      group-path:
        type: string
        description: 'Alternative scope for the secret scan: a group''s full path, subgroups
          included, resolved through the API at job time.'
        default: ''
      terraform-repositories:
        type: string
        description: 'Explicit set for the Terraform audit, whitespace-separated full paths.
          Required: an audit with no declared scope has nothing to certify.'
      api-token-variable:
        type: string
        description: Name of the CI variable holding the token that lists and clones the repositories.
          The name, never the value.
        regex: ^[A-Z][A-Z0-9_]*$
        default: GROUP_SCAN_TOKEN
      audit-image:
        type: string
        description: Approved audit execution image, pinned by digest.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
      clone-depth:
        type: number
        description: git clone depth for both jobs. 1 scans the current tree; 0 clones full
          history, which is what finding a secret that was later deleted needs.
        default: 1
      runner-tags:
        type: array
        description: Approved runner selection.
        default: []
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{secrets-instance}:security-repository-audit'
        stage: verify
        blocking: true
      - pattern: '{terraform-instance}:security-repository-audit'
        stage: verify
        blocking: true
    outputs:
      - path: .ci-artifacts/{instance}/security-repository-audit/audit-coverage.json
        producer: '{instance}:security-repository-audit'
        format: json
        schema: schema_version 1; source (explicit|group), group_path, generated_at, in_scope,
          cloned, repositories[] with path and outcome
        subject_identity: The full path of every repository in scope, with whether it was
          actually cloned. This is the coverage claim the audit is allowed to make, and it
          is written by both instances under their own instance name.
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-repository-audit/scan-result.json
        producer: '{instance}:security-repository-audit'
        format: json
        schema: schema_version 1; subject, the coverage record embedded, each scanner's outcome
          (clean|findings|error|skipped), policy_mode, source_commit, pipeline_id, job_id,
          completed_at
        subject_identity: The repository set named in the embedded coverage record.
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-repository-audit/gitleaks/<repository>.json
        producer: '{instance}:security-repository-audit'
        format: json
        schema: Native gitleaks JSON report, one per scanned repository, redacted.
        subject_identity: Repository directory name, which is its full path with / replaced
          by _.
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-repository-audit/terraform-audit.log
        producer: '{terraform-instance}:security-repository-audit'
        format: text
        schema: Console output of audit-secrets.sh. Only the Terraform instance writes it;
          the secrets instance runs with scan-terraform false.
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-repository-audit/terraform-state-scan.log
        producer: '{terraform-instance}:security-repository-audit'
        format: text
        schema: Console output of scan-state.sh, under the same condition as the log above.
        retention: 1 week
    required_secrets:
      - name: GROUP_SCAN_TOKEN
        kind: ci-variable
        scope: Default name only; the consuming project names the variable through the api-token-variable
          input and both instances read the same one. read_api to list a group, read_repository
          to clone. Section 10.2 prefers a short-lived identity; this is a static token inherited
          from security/group-scan.yml and is recorded as such rather than presented as compliant.
        protected_ref_required: false
    runtime_image:
      reference: 'per component: the include forwards a digest-pinned execution image, and
        the one a consumer may need to change is the audit-image input of this composition'
      pinning: input
    trust:
      privileged: false
      network_egress:
        - gitlab.example.com
        - registry.example.com
        - the Alpine package mirror, for bash, curl, jq and git
      runner_profile: shared-docker, the estate instance runners. They are registered untagged,
        so runner-tags selects nothing today and a tag is not a permission boundary.
      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint
      notes: 'Two schedules and nothing else: `schedule` and `web`. An audit is not a branch
        or merge request check, and the workflow rules close with `when: never` so including
        this file cannot add a second pipeline beside a consumer''s own. Both jobs come from
        one component under two instances, which is what replaced the four hand-copied jobs
        in security/group-scan.yml and security/terraform-audit.yml; the two copies had drifted
        on cloning and on the execution image. The secrets instance scans the group or an
        explicit set for secrets only; the Terraform instance scans its named repositories
        for secrets AND runs the Terraform anti-pattern and state checks over the same clones.
        Scope is an input, the schedule and the token belong to the project that runs the
        pipeline. Evidence is gitlab-linted only: the merged configuration compiles and no
        pipeline has been executed.'
  - name: terraform-deploy
    kind: pipeline
    path: pipelines/terraform-deploy.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Terraform root identifier. Jobs are `<instance>:terraform-fmt`, `<instance>:terraform-validate`,
          `<instance>:security-filesystem-trivy`, `<instance>:terraform-plan` and `<instance>:terraform-apply`.
        regex: ^[a-z][a-z0-9-]{0,47}$
      working-directory:
        type: string
        description: Terraform root in the consumer checkout.
        default: .
      environment:
        type: string
        description: 'Target environment, from the estate profile''s names in .ci/estate.yml.
          Recorded on the apply job. A GitLab environment name alone is not a protection rule:
          configure the protected environment separately.'
        options:
          - mgt
          - dev
          - prod
      state-id:
        type: string
        description: GitLab-managed Terraform state name for this root and environment. The
          backend lock is held on this name, so two roots must never share one.
        regex: ^[A-Za-z0-9._-]{1,120}$
      changes-filter:
        type: string
        description: '`on` adds `changes:` to every job in this instance, so the pipeline
          acts only when the paths in changes-paths were touched. `off`, the default, is the
          behaviour before this input existed: the jobs run on every pipeline the source rules
          admit.'
        options:
          - 'off'
          - 'on'
        default: 'off'
      changes-paths:
        type: array
        description: Paths this instance owns, as `changes:` patterns relative to the repository
          root. Read only when changes-filter is on. The default matches any change, so turning
          the filter on without naming paths behaves like no filter rather than deleting the
          pipeline; an empty list would match nothing, which is why it is not the default.
        default:
          - '**/*'
      apply-mode:
        type: string
        description: '`manual` requires a person to start the apply. `automatic` runs it on
          success on the default branch. Manual is the default because section 6.1 does not
          default a production mutation to unconditional execution; `automatic` is an owner
          decision, and belongs in the consuming project''s .ci/project.yml with the reason.'
        options:
          - manual
          - automatic
        default: manual
      apply-gate-jobs:
        type: array
        description: 'Jobs that must succeed before this apply, as `{job: <name>, artifacts:
          false}` entries. For ordering between instances that the stage graph cannot express,
          such as a production root applying only after the development root of the same change
          applied. The plan producer is always needed as well and is never replaced by this
          list.'
        default: []
      state-username:
        type: string
        description: Username for the HTTP state backend.
        default: gitlab-ci-token
      state-token-variable:
        type: string
        description: Name of the CI variable holding the state backend token. The name, never
          the value.
        regex: ^[A-Z][A-Z0-9_]*$
        default: GITLAB_TF_STATE_TOKEN
      var-file:
        type: string
        description: Non-secret variables file for the plan, relative to working-directory.
          Empty means none.
        default: ''
      allow-destroy:
        type: boolean
        description: Permit an apply whose saved plan destroys or replaces resources. Off
          by default, so a plan that turned out destructive stops at the apply guard instead
          of running.
        default: false
      max-plan-age-hours:
        type: number
        description: How old a saved plan may be at apply time. A plan older than this is
          refused and a new one must be reviewed.
        default: 24
      plan-expire-in:
        type: string
        description: Artifact retention for the plan and its metadata.
        default: 7 days
      lock-timeout:
        type: string
        description: How long terraform waits for the backend state lock.
        default: 3m
      vault-auth:
        type: boolean
        description: 'Authenticate to Vault with the job''s id_token before plan and apply.
          Off by default: this estate''s Terraform jobs authenticate to the state backend
          with the state token and need nothing else.'
        default: false
      vault-role:
        type: string
        description: Vault JWT role used when vault-auth is true.
        default: gitlab-ci-terraform
      scan-severity:
        type: string
        description: Lowest severity that fails the configuration scan.
        options:
          - critical
          - high
          - medium
          - low
        default: high
      scan-policy-mode:
        type: string
        description: '`blocking` fails on a finding at or above the threshold. `advisory`
          records findings and still fails when the scanner could not run at all.'
        options:
          - blocking
          - advisory
        default: blocking
      runner-tags:
        type: array
        description: Approved runner selection from the estate profile.
        default: []
      terraform-image:
        type: string
        description: Approved Terraform execution image pinned by digest.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/hashicorp/terraform@sha256:5820b87995595425074f881500a037b0ccd41158d0d9b44d78f5f120612f2d3d
      trivy-image:
        type: string
        description: Approved Trivy image pinned by digest.
        regex: ^.+@sha256:[0-9a-f]{64}$
        default: docker.io/aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:terraform-fmt'
        stage: verify
        blocking: true
      - pattern: '{instance}:terraform-validate'
        stage: verify
        blocking: true
      - pattern: '{instance}:security-filesystem-trivy'
        stage: verify
        blocking: true
      - pattern: '{instance}:terraform-plan'
        stage: plan
        blocking: true
      - pattern: '{instance}:terraform-apply'
        stage: deploy
        blocking: true
    outputs:
      - path: .ci-artifacts/{instance}/terraform-plan/tfplan
        producer: '{instance}:terraform-plan'
        format: terraform-plan-binary
        subject_identity: The plan's own sha256, recorded in plan-metadata.json and re-checked
          by the apply job.
        retention: the plan-expire-in input, default 7 days
      - path: .ci-artifacts/{instance}/terraform-plan/plan-metadata.json
        producer: '{instance}:terraform-plan'
        format: application/json
        schema: schema_version 1; engine, version, instance, environment, state id, working
          directory, source commit, plan and lockfile hashes, created_at, max age
        subject_identity: plan_sha256 plus source_commit, state_id and environment.
        retention: the plan-expire-in input, default 7 days
    required_secrets:
      - name: GITLAB_TF_STATE_TOKEN
        kind: ci-variable
        scope: Default value of the state-token-variable input. Read/write on the project's
          Terraform state through the GitLab HTTP backend. Must be masked.
      - name: VAULT_ID_TOKEN
        kind: id-token
        audience: https://vault.example.com:8200
        role: gitlab-ci-terraform
        scope: Minted only when the vault-auth input is true, for providers that read credentials
          from Vault. Audience and role come from inputs, not from the job body.
    runtime_image:
      reference: 'per component: every include forwards a digest-pinned execution image, and
        the ones a consumer may need to change are inputs of this composition'
      pinning: input
    trust:
      privileged: false
      network_egress:
        - registry.example.com
        - registry.terraform.io
        - gitlab.example.com
        - the trivy vulnerability database and check bundle sources
        - vault.example.com
      runner_profile: shared-docker, the estate instance runners. They are registered untagged,
        so runner-tags selects nothing today and a tag is not a permission boundary.
      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint
      notes: 'One include is one root, one state and one environment. The apply job names
        its plan job explicitly and re-checks the plan''s hash, age, engine version, lockfile,
        state id, working directory and source commit before applying; it never re-plans.
        Destroy is not a branch of this pipeline: `allow-destroy` only permits an apply whose
        saved plan is already destructive. `environment:` records a deployment; it is not
        a protection rule, which must be configured on the GitLab environment separately.
        There is no verify-deploy stage because no component fills it. Three inputs exist
        so a project adopting this composition can keep gates it already has, and all three
        are off by default. `changes-filter` with `changes-paths` adds `changes:` to every
        job in the instance, so a repository of several roots plans only the one whose paths
        moved. `apply-mode: automatic` makes the apply run on success on the default branch
        instead of waiting for a person: that is an owner decision, not a default, section
        6.1 does not default a production mutation to unconditional execution, and the consuming
        project records the decision and its reason in .ci/project.yml. `apply-gate-jobs`
        adds needs entries with artifacts false to the apply, for ordering between instances
        such as prod applying only after dev; the plan producer is always needed as well and
        is never replaced by that list. Evidence is gitlab-linted only, and the lint has a
        limit worth stating: the API returns no `needs` per job, so the two-instance ordering
        is asserted on the resolved configuration and the lint proves only that the configuration
        carrying it compiles. `changes:` semantics are likewise not observable in a dry run,
        which has no diff to compare against. Status: experimental. Part of this composition
        HAS executed on 1.0.0-rc.2: platform/terraform-dns (project 16) merge-request pipeline
        5736 and main pipeline 5744, and platform/terraform-hypervisor-roles (22) merge-request
        pipeline 5735, with terraform-fmt, terraform-validate, security-filesystem-trivy and,
        on 5744, terraform-plan all green. The apply half has not: 5744 created example:terraform-apply
        and sixbrothers:terraform-apply as manual jobs and nobody started them. A composition
        whose reason to exist is applying a saved plan is not released until an apply has
        consumed one.'
  - name: terraform-module
    kind: pipeline
    path: pipelines/terraform-module.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Module identifier. Jobs are `<instance>:terraform-fmt`, `<instance>:terraform-validate`
          and `<instance>:terraform-module-publish`.
        regex: ^[a-z][a-z0-9-]{0,47}$
      working-directory:
        type: string
        description: Module root in the consumer checkout.
        default: .
      module-name:
        type: string
        description: Module name in the registry, the `<name>` of `<namespace>/<name>/<system>`.
