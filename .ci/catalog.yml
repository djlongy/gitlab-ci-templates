        the smoke test adds it to the signing gate list, and enabling Vigil adds the readiness
        verdict to the promotion gate list; both are done by selecting a second include, because
        a `gate-jobs` array cannot be varied inside one. Merge request pipelines run the four
        verify jobs and nothing that mutates. Promotion is manual on a protected tag. `build-sources`
        chooses which pushes produce a candidate: `default-branch-and-tags`, the default and
        the behaviour before this input existed, or `tags-only`, which confines the build,
        smoke test, SBOM, image scan, signature, attestations and promotion to a protected
        tag push while the four verify jobs still run on merge requests and default-branch
        pushes. Evidence is gitlab-linted only: the merged configuration compiles on gitlab.example.com
        18.9.1-ee and no pipeline has been executed. Status: experimental. The verify half
        HAS executed on 1.0.0-rc.2: platform/demo-app (project 56) merge-request pipelines
        5734 and 5745 ran security-secrets-gitleaks, security-sast-semgrep, security-filesystem-trivy
        and quality-sonarqube green, and quality-dependency-lockfiles red on a gap 1.0.0 closes.
        Nothing after `verify` has run: that project''s build source is tags-only and no release
        tag has been pushed, so no image has been built, scanned, signed, attested or promoted
        by this composition.'
