        regex: ^.+@sha256:[0-9a-f]{64}$
      egress-proxy:
        type: string
        description: HTTP CONNECT proxy for outbound traffic. Empty means direct egress.
        default: ''
      no-proxy:
        type: string
        description: NO_PROXY value applied alongside egress-proxy.
        default: ''
      runner-tags:
        type: array
        description: Runner selection from the estate profile.
        default: []
      max-retries:
        type: number
        description: How many times the runner may retry this job. The condition is runner_system_failure
