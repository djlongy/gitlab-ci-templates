        - integration-tested
      verified_at: 2026/09/16
      revision: 1.0.0-rc.2
      environment: 'gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint.
        Executed on shared ref 1.0.0-rc.2 in: platform/k8s-gitops (61) 5723 (merge request,
        list and dry-run mirror) and 5729 (main, list, real mirror of 32 references and real
        export). Every job the composition creates ran green for its own source.'
      notes: 'Three pipeline sources: a merge request, a schedule and a default-branch push.
        A merge request resolves the list and inspects every reference without writing to
        the registry, and exports nothing; the mode is carried by a rule variable rather than
        the dry-run input because inputs are fixed at pipeline creation. The schedule and
        the default-branch push mirror and export. The graph is the composition''s: container-mirror-skopeo
        consumes the list job''s artifact, container-export-skopeo consumes the same artifact
        and gates on the mirror job with artifacts false. Neither producer is optional. Linting
        this composition from a feature branch cannot produce a job list. The CI Lint API
        resolves include:local at a non-default ref only with dry_run true, and dry_run simulates
        a push to that ref, which this workflow rejects. Its fixtures in tests/pipelines/container-mirror/
        therefore prove that every include resolves and every input validates, and the two-instance
        fixture overrides run-rules to prove the job names. Evidence is gitlab-linted only;
        no pipeline in this release has been executed.'
