      base-image:
        type: string
        description: Base image pinned by digest. The default is Chainguard static, whose
          only tag is a rolling latest, resolved to the digest below.
        default: cgr.dev/chainguard/static@sha256:bf639cba19ba56329e6907ac26a7afcdde57a80b6aa66d5100da6883196e6b82
        regex: ^.+@sha256:[0-9a-f]{64}$
      ko-version:
        type: string
        description: ko release to install. The Go module proxy and checksum database verify
          the download, which is what makes a pinned version reproducible here.
