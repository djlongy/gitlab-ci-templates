      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
      verified_at: 2026/09/15
      notes: 'Failure semantics (section 10.1). The job fails when ko exits non-zero, when
        it writes no reference file, when the reference is not repository@digest, and when
        the repository it pushed to differs from image-repository. The previous template took
        the last line of ko''s merged stdout and stderr, so a warning printed last became
        the image identity. Tag aliases now come only from the tags input: the implicit latest
        push is gone. ko is installed at a pinned version through the Go module proxy, which
