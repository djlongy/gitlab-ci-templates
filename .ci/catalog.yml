        producer: '{instance}:security-sast-semgrep'
        format: one line per finding
        retention: 1 week
      - path: .ci-artifacts/{instance}/security-sast-semgrep/scan-result.json
        producer: '{instance}:security-sast-semgrep'
        format: JSON
        schema: section 9.2 scan-result, schema_version 1
        subject_identity: project path and commit SHA of the scanned source
        retention: 1 week
    required_secrets: []
    runtime_image:
      reference: docker.io/semgrep/semgrep@sha256:570305f199ab668295ac0921667263cc03dcc3cbd7a8099866d3699cc0f2cdcc
      pinning: digest
      tool_versions:
        semgrep: 1.79.0
    trust:
