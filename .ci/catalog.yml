    required_secrets: []
    runtime_image:
      reference: docker.io/anchore/grype@sha256:a3166cb9ec689737c4c7099c78dbd3728ca22db73d5a99c9a0b582e42d5b0926
      pinning: digest
      tool_versions:
        grype: 0.118.0-debug
    trust:
      privileged: false
      network_egress:
