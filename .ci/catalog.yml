    kind: pipeline
    path: pipelines/container-jib.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Workload identifier. Every job in this pipeline is named `<instance>:<component-name>`,
          and every artifact lands under `.ci-artifacts/<instance>/`.
        regex: ^[a-z][a-z0-9-]{0,47}$
