    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:container-build-ko'
        stage: build
        blocking: true
    outputs:
      - path: .ci-artifacts/{instance}/container-build-ko/image.json
        producer: '{instance}:container-build-ko'
        format: json
        schema: image identity schema 1, section 9.1
        subject_identity: repository@sha256 digest, taken from ko --image-refs
        retention: 1 week
      - path: .ci-artifacts/{instance}/container-build-ko/build.env
        producer: '{instance}:container-build-ko'
        format: dotenv
        schema: CI_TPL_IMAGE_REFERENCE and CI_TPL_IMAGE_PUSHED
        subject_identity: same digest as image.json; convenience only, never authoritative
        retention: 1 week
    required_secrets:
      - name: HARBOR_USER
        kind: ci-variable
        scope: push to the candidate registry project
        protected_ref_required: false
      - name: HARBOR_PASSWORD
        kind: ci-variable
        scope: push to the candidate registry project
        protected_ref_required: false
    runtime_image:
      reference: docker.io/golang@sha256:383395b794dffa5b53012a212365d40c8e37109a626ca30d6151c8348d380b5f
      pinning: digest
      tool_versions:
        go: 1.23-alpine
        ko: v0.19.1
        base-image: cgr.dev/chainguard/static@sha256:bf639cba19ba56329e6907ac26a7afcdde57a80b6aa66d5100da6883196e6b82
    trust:
      privileged: false
      network_egress:
        - 'proxy.golang.org and sum.golang.org: pinned ko install and module verification'
