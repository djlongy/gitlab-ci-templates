        type: string
        description: Minimum finding severity that gates. semgrep's ERROR, WARNING and INFO
          map onto high, medium and low.
        options:
          - critical
          - high
          - medium
          - low
          - negligible
        default: high
      policy-mode:
        type: string
        description: blocking fails the job on a finding at or above the threshold; advisory
          records it and succeeds. An execution failure (unusable rules, crash, missing report)
          fails the job in both modes. The default is advisory because the template this replaces
          ended both semgrep runs in `|| true` and therefore gated on nothing; a composition
          that wants the gate sets blocking deliberately.
