        - yaml-parsed
        - gitlab-linted
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint
      notes: Verification only. This composition holds no state credentials, produces no plan
        and applies nothing; a green run must not be reported as infrastructure security or
        as evidence a change is safe to apply. `terraform validate` runs `terraform init -backend=false`,
        which still reaches the provider mirror, so it is not offline. Several roots are several
        includes with distinct instances. Evidence is gitlab-linted only.
