---
# GENERATED FILE — do not edit.
#
# Rebuild with:
#     python3 runtime/catalog/generate.py --write
#
# Source of truth is templates/<name>/template.yml (its spec:inputs header) plus
# templates/<name>/contract.yml, and pipelines/<name>.yml plus
# pipelines/<name>.contract.yml for the compositions. Editing this file by hand
# makes the drift check in tests/contracts/test_catalog.py fail, which is the
# point.
schema_version: 1
components:
  - name: ansible-check
    kind: component
    path: templates/ansible-check/template.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Unique workload instance used in the job name.
        regex: ^[a-z][a-z0-9-]{0,47}$
      stage:
        type: string
        description: Stage supplied by the owning composition.
        default: plan
      working-directory:
        type: string
        description: Directory the playbook and inventory paths are relative to, itself relative
          to the consumer checkout. Validated again at runtime, because a higher precedence
          CI variable can override the job variable.
        default: .
        regex: ^[A-Za-z0-9._/-]{1,200}$
      playbook:
        type: string
        description: Playbook to run in check mode, relative to working-directory.
        regex: ^[A-Za-z0-9._/-]{1,200}\.ya?ml$
      inventory:
        type: string
        description: 'Inventory file or directory, relative to working-directory. Required:
          without it ansible-playbook falls back to the implicit localhost and reports a clean
          check of nothing.'
        regex: ^[A-Za-z0-9._/-]{1,200}$
      limit:
        type: string
        description: Host pattern passed to --limit. Empty means every host the play targets.
          An inventory filename does not prove a disjoint host set; set this when two checks
          must not touch the same machines.
        default: ''
        regex: ^[A-Za-z0-9_.:,!*&[\]-]{0,200}$
      extra-vars-file:
        type: string
        description: One non-secret variables file, relative to working-directory, passed
          as --extra-vars @<path>. Secrets belong in the vault password mechanism or a CI
          variable, never here. Section 11.3 asks for a list; GitLab has no way to expand
          an array input into shell arguments safely, so this is a single validated path.
          See contract.yml.
        default: ''
        regex: ^[A-Za-z0-9._/-]{0,200}$
      diff:
        type: boolean
        description: 'Pass --diff. Off by default: the diff prints changed file content, which
          in this estate includes rendered templates carrying credentials.'
        default: false
      execution-image:
        type: string
        description: Ansible execution environment pinned by digest. The default is the estate
          image built from the infrastructure repository.
        default: registry.example.com/shared/base/ansible-ee@sha256:64703d0cec04567ef5b5108b755528ad911db3a6ebb5dfa90d20cabc145d3c9b
        regex: ^.+@sha256:[0-9a-f]{64}$
      runner-tags:
        type: array
        description: Runner selection from the estate profile.
        default: []
      max-retries:
        type: number
        description: How many times the runner may retry this job. The condition is runner_system_failure
          only, so this retries infrastructure and never a failed gate.
        default: 1
        options:
          - 0
          - 1
          - 2
      run-rules:
        type: array
        description: 'Job eligibility set by the composition. The default is deliberately
          narrow: this job opens SSH sessions to managed hosts.'
        default:
          - if: $CI_PIPELINE_SOURCE == "web"
          - if: $CI_PIPELINE_SOURCE == "schedule"
      vault-password-secret:
        type: string
        description: 'NAME of the masked CI variable holding the Ansible Vault password, never
          the value. Leave empty when the tree has no encrypted files. A file type variable
          does not work here: the job reads the variable''s value.'
        default: ''
        regex: ^[A-Z0-9_]*$
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:ansible-check'
        stage: plan
        blocking: true
    outputs: []
    required_secrets:
      - name: ANSIBLE_VAULT_PASSWORD
        kind: ci-variable
        scope: Needed only when the play reads Ansible Vault encrypted variable files. The
          component takes the variable NAME through the vault-password-secret input; this
          entry records the name platform/infrastructure uses today. It must be a masked variable
          and not a file type variable, since the job reads its value.
        protected_ref_required: true
      - name: ANSIBLE_PRIVATE_KEY_FILE
        kind: file-variable
        scope: 'SSH credential for the managed hosts. The component does not manage key material:
          a file type CI variable of this name sets the variable to the path of the file the
          runner wrote, which is exactly what Ansible expects, so no handling is needed and
          none is added. Scope the variable to protected refs so an untrusted merge request
          pipeline cannot reach the fleet with it.'
        protected_ref_required: true
    runtime_image:
      reference: registry.example.com/shared/base/ansible-ee@sha256:64703d0cec04567ef5b5108b755528ad911db3a6ebb5dfa90d20cabc145d3c9b
      pinning: digest
      tool_versions:
        ansible-core: 2.18.x
        collections: ansible.posix, ansible.utils, community.general, community.crypto, community.hashi_vault
    trust:
      privileged: false
      network_egress:
        - registry.example.com
        - managed hosts on tcp/22 for the selected inventory
      runner_profile: linux/amd64 docker executor, unprivileged, routed to the managed networks
      protected_ref_required: true
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
        - runtime-tested
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18
      notes: 'Check mode is PARTIAL PREDICTIVE COVERAGE, not a deployment plan. A module without
        check support reports nothing rather than no change; a task gated on a skipped task''s
        result is not evaluated; anything depending on state the run did not create predicts
        wrongly. A green check is not evidence the deploy will succeed and must not be the
        only gate in front of one. gitlab-linted through the CI Lint API by tests/pipelines/test_ansible_components.py,
        including that the shipped run-rules create no job on an ordinary push. The job shell
        is behaviour tested by tests/runtime/ansible/, with ansible-playbook stubbed: that
        covers the checkout escape check, the path validation, the required inventory, the
        host key checking assertion, the vault password handling and the exact argument list.
        runtime-tested covers the tool invocation only: the pinned image was run by hand on
        2026/09/15 with the argument list this job builds, against a one host local inventory.
        The run exited 0, reported the task as changed, and the file the task would have created
        did not exist afterwards, which is the property --check is there for. Nothing has
        been run against a real remote inventory and nothing was executed by a GitLab runner,
        so this is neither integration-tested nor evidence about SSH reachability from a runner.
        Status: experimental, because no consumer pipeline has run any ansible component.
        platform/infrastructure is the only consumer and its ansible jobs sit in a stage behind
        a preflight that went red, so they were skipped rather than run.'
  - name: ansible-lint
    kind: component
    path: templates/ansible-lint/template.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Unique workload instance used in the job name.
        regex: ^[a-z][a-z0-9-]{0,47}$
      stage:
        type: string
        description: Stage supplied by the owning composition.
        default: verify
      working-directory:
        type: string
        description: Directory ansible-lint runs in, relative to the consumer checkout. Validated
          again at runtime, because a higher precedence CI variable can override the job variable
          that carries it.
        default: .
        regex: ^[A-Za-z0-9._/-]{1,200}$
      execution-image:
        type: string
        description: Image carrying ansible-lint, pinned by digest. The estate execution environment
          does not contain ansible-lint, so this default is a community image rather than
          an estate-built one. See contract.yml.
        default: docker.io/pipelinecomponents/ansible-lint@sha256:1c4d2abd372a2dce7ea1cb8e27b650db809115d410a87a4aba2438bd028de735
        regex: ^.+@sha256:[0-9a-f]{64}$
      runner-tags:
        type: array
        description: Runner selection from the estate profile.
        default: []
      max-retries:
        type: number
        description: How many times the runner may retry this job. The condition is runner_system_failure
          only, so this retries infrastructure and never a failed gate.
        default: 1
        options:
          - 0
          - 1
          - 2
      run-rules:
        type: array
        description: Job eligibility set by the composition.
        default:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
      policy-mode:
        type: string
        description: 'blocking fails the job on any violation, which is what ansible-lint''s
          own exit 2 does. advisory records the violations in scan-result.json and passes,
          but only when the linter completed: an unusable configuration, a crash, an unreadable
          report, or a run that analysed no file at all fails in both modes.'
        options:
          - blocking
          - advisory
        default: blocking
      vault-password-secret:
        type: string
        description: 'NAME of the masked CI variable holding the Ansible Vault password, never
          the value. Leave empty when the tree has no encrypted files. A file type variable
          does not work here: the job reads the variable''s value.'
        default: ''
        regex: ^[A-Z0-9_]*$
    introduced_in: 1.0.0
    minimum_gitlab: '18.9'
    emitted_jobs:
      - pattern: '{instance}:ansible-lint'
        stage: verify
        blocking: true
    outputs:
      - path: .ci-artifacts/{instance}/ansible-lint/scan-result.json
        producer: '{instance}:ansible-lint'
        format: JSON
        schema: section 9.2 scan-result, schema_version 1
        subject_identity: the project path, commit and working-directory that were linted
        retention: 1 week
      - path: .ci-artifacts/{instance}/ansible-lint/ansible-lint.sarif
        producer: '{instance}:ansible-lint'
        format: SARIF 2.1.0
        schema: the linter's own output, archived as evidence only
        subject_identity: the files ansible-lint opened in the working directory
        retention: 1 week
    required_secrets:
      - name: ANSIBLE_VAULT_PASSWORD
        kind: ci-variable
        scope: Needed only when the tree contains Ansible Vault encrypted files, because ansible-lint
          runs a syntax check that has to decrypt them. The component takes the variable NAME
          through the vault-password-secret input; this entry records the name platform/infrastructure
          uses today. It must be a masked variable and not a file type variable, since the
          job reads its value.
        protected_ref_required: true
    runtime_image:
      reference: docker.io/pipelinecomponents/ansible-lint@sha256:1c4d2abd372a2dce7ea1cb8e27b650db809115d410a87a4aba2438bd028de735
      pinning: digest
      tool_versions:
        ansible-lint: 26.4.0
        ansible-core: 2.20.6
        ansible-compat: 26.3.0
    trust:
      privileged: false
      network_egress:
        - registry.example.com
      runner_profile: linux/amd64 docker executor, unprivileged
      protected_ref_required: false
    validation:
      evidence:
        - source-reviewed
        - yaml-parsed
        - gitlab-linted
        - runtime-tested
      verified_at: 2026/09/15
      environment: gitlab.example.com 18.9.1-ee, project 18
      notes: 'gitlab-linted through the CI Lint API by tests/pipelines/test_ansible_components.py.
        The job shell is behaviour tested by tests/runtime/ansible/ with ansible-lint stubbed,
        covering the checkout escape check, the vault password handling and the exact argument
        list. runtime-tested: on 2026/09/15 the job''s own shell, extracted from this template,
        was run in the pinned image against three trees in both policy modes. A tree with
        violations exits 1 blocking and 0 advisory with the findings in scan-result.json;
        a clean tree exits 0 in both; a tree the linter analysed nothing in exits 2 in both,
        which is the execution error advisory mode does not cover. The tool''s own codes behind
        that are exit 0 clean, 2 violations, 1 unusable configuration and 5 nothing analysed.
        That is where the missing path argument comes from: `ansible-lint .` reported zero
        files processed and exit 0 on the failing tree. The same session measured the exit
        codes the policy gate classifies (0 clean, 2 violations, 1 unusable configuration,
        5 nothing analysed) and that `--sarif-file` writes its file on a clean tree but is
        suppressed by `-f codeclimate`, which is why the SARIF is the report this component
        keeps. Nothing here was executed by a GitLab runner, so this is not integration-tested.
        Status: experimental, because no consumer pipeline has run any ansible component.
        platform/infrastructure merge-request pipelines 5747 and 5750 created example-unprotected:ansible-lint
        and skipped it: its stage sits behind a preflight that failed. A skipped job is not
        evidence.'
