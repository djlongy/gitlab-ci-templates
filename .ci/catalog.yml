        as separate capabilities and this contract does not claim them. Failure semantics.
        `blocking` (the default, matching current estate behaviour) fails the job on a finding
        at or above severity-threshold; advisory records it and succeeds. An execution failure
        fails the job in BOTH modes. The gate runs as `trivy convert --exit-code 13` over
