        in the plan stage on `web` and `schedule` only: it opens SSH sessions to real managed
        hosts, and its output is partial predictive coverage, not a deployment plan. `diff`
        is forced off so rendered templates carrying credentials are not printed into the
        job log. `vault-password-secret` is the NAME of the CI variable holding the Ansible
        Vault passphrase. Evidence is gitlab-linted only.'
  - name: container-buildkit
    kind: pipeline
    path: pipelines/container-buildkit.yml
    status: experimental
    inputs:
      instance:
        type: string
        description: Workload identifier. Every job in this pipeline is named `<instance>:<component-name>`,
          and every artifact lands under `.ci-artifacts/<instance>/`.
        regex: ^[a-z][a-z0-9-]{0,47}$
      image-repository:
        type: string
        description: Candidate repository the image is built into, without a tag, for example
          registry.example.com/dev/platform/demo-app.
      working-directory:
        type: string
        description: Directory the build runs from, relative to the checkout.
        default: .
      context:
        type: string
        description: Build context, relative to working-directory.
        default: .
      dockerfile:
        type: string
        description: Dockerfile path, relative to the context.
        default: Dockerfile
      build-args:
        type: array
        description: 'NAME=value build arguments. Never a secret: a build argument is recorded
          in the image history.'
        default: []
      platforms:
        type: string
        description: Comma-separated target platforms.
        default: linux/amd64
      tags:
        type: array
        description: Tags applied to the candidate image alongside its digest.
        default:
          - $CI_COMMIT_SHORT_SHA
      release-tag-pattern:
        type: string
        description: 'Which tags are release tags, as a regular expression applied to $CI_COMMIT_TAG.
          GitLab''s protected-tag patterns are globs and cannot express a version number,
          so a project that protects `*` would otherwise build, push and promote on every
          tag it creates -- a documentation marker, a vendor import, anything. The default
          is semver with an optional pre-release suffix. A tag that does not match creates
          no pipeline at all, rather than one whose jobs are all gated off. No `/`: the value
          becomes a regular expression literal.'
        regex: ^[^/]+$
        default: ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$
      build-sources:
        type: string
        description: 'Which pushes produce a release candidate. `default-branch-and-tags`
          builds, scans, signs and attests on a default-branch push as well as on a tag. `tags-only`
          confines the whole candidate chain to a protected tag push: the verify jobs still
          run on merge requests and default-branch pushes, and between tags nothing is built,
          pushed to a registry, signed or promoted.'
        options:
          - default-branch-and-tags
          - tags-only
        default: default-branch-and-tags
      semgrep-rules:
        type: string
        description: 'Rule source for the SAST scan, passed to `semgrep --config`. Required,
          with no default, so the ruleset is a deliberate choice: a path in the consumer checkout
          is pinned, a registry pack is fetched live.'
      lockfiles:
        type: string
        description: 'Comma-separated list of every lockfile that must exist and be pinned,
          each relative to working-directory. Required: inferring the set from the checkout
          root reports a monorepo as having no dependencies at all. A project that genuinely
          has none -- a stdlib-only Go module, whose go.sum is empty -- declares the literal
          `none`, which cannot be combined with a path. An empty value stays an error: not
          filling this in and having nothing to fill in are different answers.'
      sast-policy-mode:
        type: string
        description: '`blocking` fails the pipeline on a SAST finding at or above the threshold.
          `advisory` records findings and still fails on a scanner that could not run. Blocking
          is the release default; see examples/container-buildkit-onboarding/ before changing
          it.'
        options:
          - blocking
          - advisory
        default: blocking
      scan-severity:
        type: string
        description: Lowest severity that fails a filesystem or image scan.
        options:
          - critical
          - high
          - medium
          - low
        default: high
      smoke-test:
        type: string
        description: Run a Compose smoke test against the built digest before it is scanned,
