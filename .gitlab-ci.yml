---
# gitlab-ci-templates self-validation.
#
# This pipeline validates THIS repository and nothing else. It runs the same
# checks as .github/workflows/ci.yml, for a fork hosted on GitLab rather than
# GitHub, plus the two things only a GitLab server can do: the merged-config
# lint through the CI Lint API, and cutting the release for a version tag.
#
# Stage names come from the standard's vocabulary (section 7.1 of
# docs/gitlab-ci-agent-standard.md). This repository builds, scans and deploys
# nothing, so `verify` carries everything it checks and `publish` carries the
# one thing it ships: its own release.
# Nothing is remapped: every job below declares the stage it runs in.
stages:
  - verify
  - publish

# Validate YAML syntax across the repository.
validate:templates:
  stage: verify
  image: alpine:3.19
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip3 install --break-system-packages yamllint
  script:
    - >-
      yamllint -d "{extends: default, rules: {line-length: disable, truthy:
      disable}}" .gitlab-ci.yml .ci tests runtime templates pipelines examples
      images
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Infrastructure only, the same condition every component in templates/ sets
  # and tests/contracts/test_retry_policy.py enforces. A registry blip pulling
  # the job's image failed this pipeline once (embedded-runtime, 2026/09/16,
  # "TLS handshake timeout" on docker.io/library/python:3.12); any condition
  # other than runner_system_failure would retry a real failure instead.
  retry:
    max: 1
    when: [runner_system_failure]

# Estate profile schema, catalogue drift, and the component contract schema.
contracts:
  stage: verify
  image: python:3.12
  script:
    - pip install -q pyyaml jsonschema pytest
    - python3 -m pytest -q tests/contracts/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Infrastructure only, the same condition every component in templates/ sets
  # and tests/contracts/test_retry_policy.py enforces. A registry blip pulling
  # the job's image failed this pipeline once (embedded-runtime, 2026/09/16,
  # "TLS handshake timeout" on docker.io/library/python:3.12); any condition
  # other than runner_system_failure would retry a real failure instead.
  retry:
    max: 1
    when: [runner_system_failure]

# Merged-configuration lint through the CI Lint API.
#
# The endpoint needs a token with api scope. The job token cannot be used: the CI
# Lint API is not on its documented resource allowlist
# (https://docs.gitlab.com/ci/jobs/ci_job_token/). GITLAB_TOKEN must therefore be
# a masked project or group CI variable, and this job only runs once it exists.
#
# GITLAB_URL and GITLAB_PROJECT_ID default to this pipeline's own server and
# project, so a fork needs no edit here.
pipelines-lint:
  stage: verify
  image: python:3.12
  script:
    # Every module here parses YAML to build a merged configuration and read the
    # job list back, and the composition catalogue test validates against the
    # contract schema. The job was written when this directory held only the
    # lint harness and pytest alone was enough.
    - pip install -q pytest pyyaml jsonschema
    - export GITLAB_URL="$CI_SERVER_URL" GITLAB_PROJECT_ID="$CI_PROJECT_ID"
    - python3 -m pytest -q tests/pipelines/
  rules:
    - if: '$GITLAB_TOKEN'
  # Infrastructure only, the same condition every component in templates/ sets
  # and tests/contracts/test_retry_policy.py enforces. A registry blip pulling
  # the job's image failed this pipeline once (embedded-runtime, 2026/09/16,
  # "TLS handshake timeout" on docker.io/library/python:3.12); any condition
  # other than runner_system_failure would retry a real failure instead.
  retry:
    max: 1
    when: [runner_system_failure]

# A component include imports YAML, so each template carries the runtime its job
# executes. This fails the pipeline when a template and runtime/ have drifted,
# which is the one way runtime/ can quietly become documentation.
embedded-runtime:
  stage: verify
  image: python:3.12
  script:
    - python3 runtime/embed/generate.py --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Infrastructure only, the same condition every component in templates/ sets
  # and tests/contracts/test_retry_policy.py enforces. A registry blip pulling
  # the job's image failed this pipeline once (embedded-runtime, 2026/09/16,
  # "TLS handshake timeout" on docker.io/library/python:3.12); any condition
  # other than runner_system_failure would retry a real failure instead.
  retry:
    max: 1
    when: [runner_system_failure]

# The components in templates/ ship the runtime their jobs execute, so this repo
# owns its tests: the wiki tools, the audit scripts and the embedding.
runtime-tests:
  stage: verify
  image: python:3.12
  before_script:
    # clone-repositories.sh and gitleaks-scan.sh require jq, and the tests run
    # them for real rather than mocking the shell.
    - apt-get update -qq && apt-get install -y -qq jq
  script:
    - pip install -q pyyaml pytest
    # GIT_CONFIG_GLOBAL is set per command, not as a job variable: the runner's own checkout
    # git reads it too and rejects /dev/null with "bad config line 1".
    - GIT_CONFIG_GLOBAL=/dev/null python3 -m pytest -q tests/runtime/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Infrastructure only, the same condition every component in templates/ sets
  # and tests/contracts/test_retry_policy.py enforces. A registry blip pulling
  # the job's image failed this pipeline once (embedded-runtime, 2026/09/16,
  # "TLS handshake timeout" on docker.io/library/python:3.12); any condition
  # other than runner_system_failure would retry a real failure instead.
  retry:
    max: 1
    when: [runner_system_failure]

# tools/ci-local.py runs a component job locally. Its resolver and its
# environment assembly decide what the container executes, so they are tested
# here. No docker: tests/tools/ asserts the script, the image and the variables,
# not that alpine can run sh.
tools-tests:
  stage: verify
  image: python:3.12
  script:
    - pip install -q pyyaml pytest
    - python3 -m pytest -q tests/tools/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  # Infrastructure only, the same condition every component in templates/ sets
  # and tests/contracts/test_retry_policy.py enforces. A registry blip pulling
  # the job's image failed this pipeline once (embedded-runtime, 2026/09/16,
  # "TLS handshake timeout" on docker.io/library/python:3.12); any condition
  # other than runner_system_failure would retry a real failure instead.
  retry:
    max: 1
    when: [runner_system_failure]

# Cut the GitLab Release for a version tag.
#
# Section 14.2: a consumer pins an exact protected release tag, and catalogue
# publication needs the project's catalogue configuration and the CI `release:`
# mechanism. Without this job a version tag is a bare git ref and neither of
# those exists. The runner invokes release-cli for the `release:` keyword, so
# the job must run in an image that carries it.
#
# The image is GitLab's own, pinned by digest and pulled from
# registry.gitlab.com rather than through docker.io/. That
# mirror is a Docker Hub proxy and this image is published only by GitLab:
#   crane digest docker.io/gitlab-org/release-cli:latest
#   -> NOT_FOUND: repository docker-hub/gitlab-org/release-cli not found
#   crane digest registry.gitlab.com/gitlab-org/release-cli:v0.24.0
#   -> sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  script:
    - |
      set -eu
      # The release notes are this tag's CHANGELOG section, so the release and
      # the file cannot come to say different things. A tag with no section, or
      # an empty one, fails here: a release whose notes are blank is worse than
      # no release, because it looks published.
      awk -v tag="$CI_COMMIT_TAG" '
        $0 == "## " tag || index($0, "## " tag " ") == 1 { inside = 1; next }
        inside && /^## / { exit }
        inside { print }
      ' CHANGELOG.md > release-description.md
      if [ ! -s release-description.md ]; then
        echo "ERROR: CHANGELOG.md has no '## $CI_COMMIT_TAG' section" >&2
        exit 1
      fi
      echo "release notes: $(wc -l < release-description.md) lines of CHANGELOG.md"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    # A path, not the text: release-cli reads the file from $CI_PROJECT_DIR.
    description: release-description.md
  artifacts:
    name: 'release-description-$CI_COMMIT_TAG'
    paths:
      - release-description.md
    expire_in: 1 week
  rules:
    # A version tag and nothing else, and only where the tag is protected: the
    # `1.*` protected-tag rule means only a Maintainer can create one, so this
    # is also who may publish a release.
    #
    # The expression is the `release-tag-pattern` default the container
    # compositions ship. The two are kept identical by
    # tests/pipelines/test_release_job.py, so "which tag is a release tag" has
    # one answer in this repository rather than one per file.
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"
  allow_failure: false
  interruptible: false
  retry:
    max: 1
    when: [runner_system_failure]
