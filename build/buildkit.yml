# Reusable BuildKit template for generic Dockerfile builds
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/build/buildkit.yml'
#       ref: main
#   variables:
#     IMAGE_NAME: "registry.example.com/myteam/myapp"
#     BUILDKIT_TAG: "${CI_COMMIT_SHORT_SHA}"
#
# Toggle variables:
#   BUILDKIT_VERSION:       BuildKit image tag (default: v0.18.2, pinned)
#   BUILDKIT_OCI_MEDIATYPES: "true" to output OCI manifests (enables registry-side SBOM gen)
#   BUILDKIT_PLATFORM:      Target platform (default: linux/amd64)
#   BUILDKIT_BUILD_ARGS:    Extra build args as space-separated KEY=VALUE pairs
#                           e.g. "BASE_IMAGE=nginx:1.27 VERSION=1.27.0"

.buildkit-build:
  stage: build
  image:
    name: moby/buildkit:${BUILDKIT_VERSION}
    entrypoint: [""]
  variables:
    BUILDKIT_VERSION: "v0.18.2"
    # IMAGE_NAME inherited from top-level variables (set by consuming repo)
    BUILDKIT_TAG: "${CI_COMMIT_SHORT_SHA}"
    BUILD_CONTEXT: "."
    DOCKERFILE_PATH: "Dockerfile"
    BUILDKIT_PLATFORM: "linux/amd64"
    BUILDKIT_OCI_MEDIATYPES: "true"
  script:
    - |
      if [ -z "${IMAGE_NAME}" ]; then
        echo "ERROR: IMAGE_NAME must be set"
        exit 1
      fi
    - mkdir -p /root/.docker
    - |
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        REGISTRY=$(echo "${IMAGE_NAME}" | cut -d/ -f1)
        AUTH=$(echo -n "${REGISTRY_USER}:${REGISTRY_PASSWORD}" | base64)
        cat > /root/.docker/config.json <<DOCKEREOF
      {"auths":{"${REGISTRY}":{"auth":"${AUTH}"}}}
      DOCKEREOF
      fi
    - |
      OCI_FLAG=""
      if [ "${BUILDKIT_OCI_MEDIATYPES}" = "true" ]; then
        OCI_FLAG=",oci-mediatypes=true"
        echo "Building with OCI media types (enables registry-side SBOM generation)"
      fi
      # Convert BUILDKIT_BUILD_ARGS (space-separated KEY=VALUE) to --opt flags
      EXTRA_BUILD_ARGS=""
      for ARG in ${BUILDKIT_BUILD_ARGS:-}; do
        EXTRA_BUILD_ARGS="${EXTRA_BUILD_ARGS} --opt build-arg:${ARG}"
      done
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="${BUILD_CONTEXT}" \
        --local dockerfile="${BUILD_CONTEXT}" \
        --opt filename="${DOCKERFILE_PATH}" \
        --opt platform="${BUILDKIT_PLATFORM}" \
        --opt build-arg:APP_VERSION="${BUILDKIT_TAG}" \
        ${EXTRA_BUILD_ARGS} \
        --output "type=image,name=${IMAGE_NAME}:${BUILDKIT_TAG},push=true${OCI_FLAG}" \
        --metadata-file metadata.json
    - |
      # Extract the MANIFEST digest from the registry after push.
      # BuildKit's metadata.json contains the CONFIG digest, not the MANIFEST
      # digest. Cosign needs the manifest digest for signing and attestation
      # discovery. We query the registry directly — this is the only reliable
      # source since BuildKit doesn't expose the manifest digest consistently.
      DIGEST=""
      REGISTRY=$(echo "${IMAGE_NAME}" | cut -d/ -f1)
      REPO_PATH=$(echo "${IMAGE_NAME}" | cut -d/ -f2-)

      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        AUTH_HEADER="Basic $(echo -n "${REGISTRY_USER}:${REGISTRY_PASSWORD}" | base64)"

        # Use wget (available in Alpine/BusyBox BuildKit image — no python3 needed)
        DIGEST=$(wget -q --header="Authorization: ${AUTH_HEADER}" \
          --header="Accept: application/vnd.oci.image.manifest.v1+json" \
          -S -O /dev/null \
          "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${BUILDKIT_TAG}" 2>&1 \
          | grep -i 'docker-content-digest' | tr -d '\r' | awk '{print $2}' || true)

        # Fallback: try Docker manifest v2 accept header
        if [ -z "$DIGEST" ]; then
          DIGEST=$(wget -q --header="Authorization: ${AUTH_HEADER}" \
            --header="Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -S -O /dev/null \
            "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${BUILDKIT_TAG}" 2>&1 \
            | grep -i 'docker-content-digest' | tr -d '\r' | awk '{print $2}' || true)
        fi
      fi

      if [ -n "$DIGEST" ]; then
        echo "IMAGE_DIGEST=${IMAGE_NAME}@${DIGEST}" > build.env
        echo "BUILDKIT_TAG=${BUILDKIT_TAG}" >> build.env
        echo "Built and pushed: ${IMAGE_NAME}:${BUILDKIT_TAG}"
        echo "Manifest digest: ${DIGEST}"
      else
        echo "ERROR: Could not extract manifest digest from registry"
        echo "Cosign signing will use tag reference (attestations may not be discoverable)"
        echo "IMAGE_DIGEST=${IMAGE_NAME}:${BUILDKIT_TAG}" > build.env
        echo "BUILDKIT_TAG=${BUILDKIT_TAG}" >> build.env
      fi
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - metadata.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

buildkit-build:
  extends: .buildkit-build