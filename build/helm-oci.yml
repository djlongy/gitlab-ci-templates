# Reusable Helm OCI chart publication template
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/build/helm-oci.yml'
#       ref: main
#   variables:
#     HELM_REGISTRY: ""
#     HELM_PROJECT: "charts"

.helm-oci-publish:
  stage: build
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  variables:
    HELM_REGISTRY: ""
    HELM_PROJECT: "charts"
    CHART_PATH: "."
  script:
    - |
      if [ -z "${HELM_REGISTRY}" ]; then
        echo "ERROR: HELM_REGISTRY must be set"
        exit 1
      fi
    - |
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        helm registry login "${HELM_REGISTRY}" -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}"
      fi
    - helm dependency update "${CHART_PATH}" || true
    - helm package "${CHART_PATH}"
    - |
      CHART_FILE=$(ls *.tgz | head -1)
      helm push "${CHART_FILE}" "oci://${HELM_REGISTRY}/${HELM_PROJECT}"
      echo "Published: ${CHART_FILE} to oci://${HELM_REGISTRY}/${HELM_PROJECT}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

helm-oci-publish:
  extends: .helm-oci-publish
