# Reusable Jib build template for Java/Gradle services
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/build/jib.yml'
#       ref: main
#   variables:
#     JIB_TARGET_IMAGE: "registry.example.com/myteam/myapp:${CI_COMMIT_SHORT_SHA}"

.jib-build:
  stage: build
  image:
    name: gradle:8-jdk21-alpine
    entrypoint: [""]
  variables:
    JIB_TARGET_IMAGE: ""
    JIB_BASE_IMAGE: "gcr.io/distroless/java21-debian12:nonroot"
  script:
    - |
      if [ -z "${JIB_TARGET_IMAGE}" ]; then
        echo "ERROR: JIB_TARGET_IMAGE must be set"
        exit 1
      fi
    - |
      gradle jib \
        -Djib.to.image="${JIB_TARGET_IMAGE}" \
        -Djib.from.image="${JIB_BASE_IMAGE}" \
        -Djib.to.auth.username="${REGISTRY_USER}" \
        -Djib.to.auth.password="${REGISTRY_PASSWORD}" \
        -Djib.container.user="65534:65534"
    - echo "IMAGE_DIGEST=${JIB_TARGET_IMAGE}" > build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

jib-build:
  extends: .jib-build
