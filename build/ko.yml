# Reusable ko build template for Go services
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/build/ko.yml'
#       ref: main
#   variables:
#     KO_DOCKER_REPO: "registry.example.com/myteam/myapp"

.ko-build:
  stage: build
  image:
    name: golang:1.23-alpine
    entrypoint: [""]
  variables:
    KO_DOCKER_REPO: ""
    KO_APP_PATH: "."
    # Chainguard static is a distroless base — no version tags, only rolling :latest
    # Override per-project if digest pinning is needed
    KO_DEFAULTBASEIMAGE: "cgr.dev/chainguard/static:latest"
    GOFLAGS: "-trimpath"
    CGO_ENABLED: "0"
  before_script:
    - apk add --no-cache git
    - go install github.com/google/ko@latest
    - |
      if [ -z "${KO_DOCKER_REPO}" ]; then
        echo "ERROR: KO_DOCKER_REPO must be set (e.g. registry.example.com/myteam/myapp)"
        exit 1
      fi
    # Authenticate to the registry
    - |
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        ko login $(echo "${KO_DOCKER_REPO}" | cut -d/ -f1) -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}"
      fi
  script:
    - |
      DIGEST=$(ko build --bare --tags "${CI_COMMIT_SHORT_SHA},latest" "${KO_APP_PATH}" 2>&1 | tail -1)
      echo "IMAGE_DIGEST=${DIGEST}" > build.env
      echo "Built and pushed: ${DIGEST}"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

ko-build:
  extends: .ko-build
