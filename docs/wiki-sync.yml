# Two-way mirror between a repo's docs folder and that project's GitLab wiki.
#
# The repo is the source of truth. A wiki edit becomes a repo commit by whoever made it;
# docs/ is then regenerated into the wiki as the CI author. Consumers add one include:
#
#   include:
#     - project: 'platform/ci-templates'
#       file: '/docs/wiki-sync.yml'
#       ref: main
#
# and run scripts/wiki/wiki-bootstrap.sh <group/project> once (trigger token, wiki-page-events
# webhook, hourly schedule, job-token allowlist). WIKI_TOKEN comes from the group CI variable.
#
# Variables a consumer may override in its own top-level variables: block
#   DOCS_DIR            folder holding the markdown (default: docs)
#   WIKI_SYNC_REF       ref of this templates repo the scripts are fetched from (default: main)
#   WIKI_SYNC_PROJECT   path of this templates repo
#   MKDOCS_CONFIG       mkdocs.yml to read exclude_docs / not_in_nav from, when the repo has one
# Nothing here sets PIP_INDEX_URL, so a consumer's own value (or project CI variable) applies.

variables:
  DOCS_DIR: "docs"
  WIKI_SYNC_REF: "main"
  WIKI_SYNC_PROJECT: "platform/ci-templates"

# A wiki edit starts a pipeline through a webhook on wiki page events that calls the pipeline
# trigger API (source "trigger"); an hourly schedule is the safety net (source "schedule").
# Those pipelines only need the wiki job. Consumers reference this from their other jobs:
#   rules:
#     - !reference [.not_for_wiki_sync, rules]
#     - ...
.not_for_wiki_sync:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "schedule"
      when: never

# test is the one stage GitLab always defines, so a consumer needs no stages: block. A consumer
# that declares its own stages: must keep a test stage or override wiki: stage:. Not .post --
# GitLab drops .pre and .post when they are the only stages with jobs, and a wiki-triggered
# pipeline has no other job, so the whole pipeline would be refused as empty.
# The scripts are fetched at run time rather than vendored, so every consumer runs one version.
# The wiki is cloned outside the build directory: the consumer needs no .gitignore entry.
wiki:
  stage: test
  image: python:3.12
  variables:
    GIT_DEPTH: 0
  script:
    - git clone -q --depth 1 --branch "$WIKI_SYNC_REF"
      "https://gitlab-ci-token:$CI_JOB_TOKEN@$CI_SERVER_FQDN/${WIKI_SYNC_PROJECT}.git" /tmp/wiki-sync
    - pip install -q pyyaml
    - bash /tmp/wiki-sync/scripts/wiki/wiki-deploy.sh "$DOCS_DIR" /tmp/wiki-clone
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WIKI_TOKEN
