---
# container-jib/.ci/project.yml
#
# The record of what this project adopted from the shared CI repository.
# Contract: docs/gitlab-ci-agent-standard.md section 4, schema
# tests/contracts/project.schema.json, field guide docs/reference/project-yml.md.
#
# Metadata, not GitLab configuration: nothing reads this at pipeline time. It
# exists so the next reader can see which composition is in use, under which
# instance names, and what was decided on the way in. The project path below is
# illustrative, as is everything else in examples/.
schema_version: 1
project: demo/ledger
shared_ci:
  project: platform/gitlab-ci-templates
  ref: REPLACE_WITH_APPROVED_SHARED_CI_REF
workload:
  name: container-jib
  adoption: composition
compositions:
  - file: /pipelines/container-jib.yml
    instances:
      - ledger
    inputs:
      instance: ledger
      image-repository: registry.example.com/dev/platform/ledger
      gradle-command: ./gradlew
      semgrep-rules: ci/semgrep-rules.yml
      lockfiles: gradle/verification-metadata.xml
      dependency-track: 'true'
      dependency-track-api-url: https://dtrack.example.com/api
environments:
  - name: prod
    target: registry.example.com/prod
