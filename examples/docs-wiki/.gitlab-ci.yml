---
# examples/docs-wiki/.gitlab-ci.yml
#
# A repository whose whole pipeline is mirroring docs/ to its own wiki.
#
# WIKI_TOKEN is required by every rule in the composition, so set it as a group
# or project CI variable first: without it the job is skipped rather than
# failing halfway through regenerating the wiki.
#
# A repository that also has its own checks includes
# /templates/docs-wiki-sync/template.yml directly instead, because this file
# owns `workflow:` and `stages:`.
#
# A site whose runners are shell executors, with no container registry it can
# reach, passes two more inputs and nothing else:
#
#       executor: shell
#       runner-tags: [its-shell-runner-tag]
#
# The job then carries no `image:` at all and runs on the host's python3, git
# and tar. Its one Python dependency is pyyaml: install python3-pyyaml on the
# runner host, or set PIP_INDEX_URL (and PIP_TRUSTED_HOST for a plain-HTTP
# mirror) as CI variables pointing at an internal index. With neither, the job
# fails with one line naming both.
#
# The job also repairs its own wiki webhook and trigger token on every
# default-branch run, which needs an api-scope Maintainer token in WIKI_TOKEN or
# in WIKI_ADMIN_TOKEN. Pass `webhook-reconcile: 'off'` to decline it, quoted,
# since bare `off` is a YAML boolean.
#
# Step by step, for a reader with no context: docs/howto/docs-wiki-sync.md.
include:
  - project: 'platform/gitlab-ci-templates'
    ref: 'REPLACE_WITH_APPROVED_SHARED_CI_REF'
    file: '/pipelines/docs-wiki.yml'
    inputs:
      instance: docs
      working-directory: 'docs'
      mkdocs-config: 'mkdocs.yml'
