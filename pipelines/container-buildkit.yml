        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'

  - local: '/templates/security-verify-vigil/template.yml'
    rules:
      - if: '"$[[ inputs.vigil ]]" == "true" && "$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
