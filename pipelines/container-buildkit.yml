  # Every rule below that names another brick's switch is doing one job: the
  # include's own `inputs:` hard-code that brick's job name, into sbom-job,
  # scan-job, sign-job or gate-jobs, and a `needs:` entry cannot name a job the
  # pipeline does not create. 1.3.0 made those inputs optional on the
  # COMPONENTS, which is what lets a consumer including bricks directly drop
  # one; it does not make these conjuncts removable, because the composition
  # still forwards a literal name and has no way to forward an empty one
  # conditionally. Measured 2026/09/18: deleting any of them and resolving with
  # the guarded brick off gives `undefined need` from the CI Lint API.
  # Chasing the alternative — an include entry per producer subset — is sixteen
  # copies of the cosign entry, and it would let a promotion publish an image
  # whose scan was switched off.
  - local: '/templates/security-sbom-upload-dtrack/template.yml'
    rules:
      - if: '"$[[ inputs.dependency-track ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: scan
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      sbom-job: '$[[ inputs.instance ]]:security-sbom-syft'
      gate-jobs: []
      api-url: $[[ inputs.dependency-track-api-url ]]
      project-name: '$CI_PROJECT_NAME'
      project-version: '$CI_COMMIT_SHA'
      wait-for-analysis: $[[ inputs.dependency-track-wait ]]
      analysis-timeout: $[[ inputs.dependency-track-timeout ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  - local: '/templates/security-sbom-upload-dtrack/template.yml'
    rules:
      - if: '"$[[ inputs.dependency-track ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.build-sources ]]" == "tags-only"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: scan
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      sbom-job: '$[[ inputs.instance ]]:security-sbom-syft'
      gate-jobs: []
      api-url: $[[ inputs.dependency-track-api-url ]]
      project-name: '$CI_PROJECT_NAME'
      project-version: '$CI_COMMIT_SHA'
      wait-for-analysis: $[[ inputs.dependency-track-wait ]]
      analysis-timeout: $[[ inputs.dependency-track-timeout ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'

  #### attest ####
  # Two include entries for one component, selected by the smoke-test input.
  # A `gate-jobs` list is a fixed array, so the only way to add the smoke test
  # to the signing gate when it exists — and to leave it out when it does not,
  # which would fail pipeline creation — is to choose between two lists here.
  - local: '/templates/container-sign-attest-cosign/template.yml'
    rules:
      - if: '"$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.smoke-test ]]" == "false" && "$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sbom-job: '$[[ inputs.instance ]]:security-sbom-syft'
      scan-job: '$[[ inputs.instance ]]:security-image-trivy'
      scan-component: security-image-trivy
      gate-jobs: []
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      cosign-release-url: $[[ inputs.cosign-release-url ]]

  - local: '/templates/container-sign-attest-cosign/template.yml'
    rules:
      - if: '"$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.smoke-test ]]" == "false" && "$[[ inputs.build-sources ]]" == "tags-only"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sbom-job: '$[[ inputs.instance ]]:security-sbom-syft'
      scan-job: '$[[ inputs.instance ]]:security-image-trivy'
      scan-component: security-image-trivy
      gate-jobs: []
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      cosign-release-url: $[[ inputs.cosign-release-url ]]

  - local: '/templates/container-sign-attest-cosign/template.yml'
    rules:
      - if: '"$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.smoke-test ]]" == "true" && "$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sbom-job: '$[[ inputs.instance ]]:security-sbom-syft'
      scan-job: '$[[ inputs.instance ]]:security-image-trivy'
      scan-component: security-image-trivy
      gate-jobs:
        - job: '$[[ inputs.instance ]]:container-smoke-test'
          artifacts: false
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      cosign-release-url: $[[ inputs.cosign-release-url ]]

  - local: '/templates/container-sign-attest-cosign/template.yml'
    rules:
      - if: '"$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.smoke-test ]]" == "true" && "$[[ inputs.build-sources ]]" == "tags-only"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sbom-job: '$[[ inputs.instance ]]:security-sbom-syft'
      scan-job: '$[[ inputs.instance ]]:security-image-trivy'
      scan-component: security-image-trivy
      gate-jobs:
        - job: '$[[ inputs.instance ]]:container-smoke-test'
          artifacts: false
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      cosign-release-url: $[[ inputs.cosign-release-url ]]

  - local: '/templates/security-sync-vigil/template.yml'
    rules:
      - if: '"$[[ inputs.vigil ]]" == "true" && "$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sign-job: '$[[ inputs.instance ]]:container-sign-attest-cosign'
      gate-jobs: []
      vigil-url: $[[ inputs.vigil-url ]]
      request-timeout: $[[ inputs.vigil-request-timeout ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  - local: '/templates/security-sync-vigil/template.yml'
    rules:
      - if: '"$[[ inputs.vigil ]]" == "true" && "$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.build-sources ]]" == "tags-only"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sign-job: '$[[ inputs.instance ]]:container-sign-attest-cosign'
      gate-jobs: []
      vigil-url: $[[ inputs.vigil-url ]]
      request-timeout: $[[ inputs.vigil-request-timeout ]]
