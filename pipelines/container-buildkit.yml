---
# pipelines/container-buildkit.yml
#
# The container release pipeline for a project that builds from a Dockerfile.
# One root composition: it owns `workflow:` and `stages:`, includes the
# components at its own revision and forwards every input explicitly, because
# inputs do not flow through nested includes (section 6.2).
#
# Stage order is the section 7.1 container release sequence:
#
#   verify  -> secret detection, SAST, filesystem scan, lockfile reproducibility
#   build   -> one builder, BuildKit, exporting an immutable image.json
#   test    -> optional Compose smoke test against that exact digest
#   scan    -> one authoritative SBOM producer (syft) and the image scan (trivy)
#   attest  -> cosign signature and attestations, optional Vigil readiness gate
#   publish -> Harbor dev -> prod promotion of the digest that passed
#
# One builder and one authoritative SBOM producer, per section 6.2. To build
# with ko or Jib, use pipelines/container-ko.yml or pipelines/container-jib.yml
# instead; do not include two of these.
#
# Source eligibility belongs to this composition, not to the consumer, so
# `run-rules` is not exposed as an input. What a consumer selects instead is
# `build-sources`, which picks the candidate rule set. Four rule sets are used:
#
#   verify     merge request, default branch, tag   always
#   candidate  default branch, tag                  build-sources:
#                                                     default-branch-and-tags
#   candidate  protected tag                        build-sources: tags-only
#   release    protected tag, manual                promotion only
#
# `run-rules` is a fixed array, so one include entry cannot carry both candidate
# rule sets. Each candidate component is included twice instead, once per source
# set, under mutually exclusive include `rules:`; exactly one entry is ever
# active, and the pair is identical apart from those rules. That is the device
# the smoke-test and Vigil gate lists already use for the same reason.
#
# The candidate set deliberately excludes merge requests. A merge request
# pipeline that ran the scanners but not the build would ask trivy and syft to
# consume an artifact no job produced, and pipeline creation would fail.
#
# Blocking by default. The `*-policy-mode` inputs are what a project relaxes
# while it onboards, and doing so is an explicit choice, spelled out in
# examples/container-buildkit-onboarding/, never a default here.
#
# Every brick after the build is an `enable-<brick>` switch, default true, read
# by that component's include `rules:` -- the same device smoke-test,
# dependency-track and vigil already use. The whole chain on is what a consumer
# that names none of them gets, so the defaults are the pipeline as it was.
#
# Turning a brick off has to remove it from every `needs:` list that names it,
# or pipeline creation fails on an undefined need. Section 8.3 rules out an
# optional need, so a dependant's own include rule carries its producers'
# switches instead, and the dependant is not created when they are off. That is
# why the cosign rule names enable-syft and enable-image-trivy, and why the
# promotion requires the whole release chain rather than only enable-promote.
#
# The four verify bricks gate the signing job through the verify stage barrier
# rather than through `needs:`. The builder has no `needs:`, so it waits for the
# whole verify stage, and everything downstream of the builder waits with it.
# Naming those four in the signing job's `gate-jobs` as well would mean one
# include entry per subset of them -- thirty-two -- for an ordering the barrier
# already provides. docs/howto/pick-your-bricks.md states the rules of the set.

#### Consumer interface ####
spec:
  inputs:
    instance:
      type: string
      description: >-
        Workload identifier. Every job in this pipeline is named
        `<instance>:<component-name>`, and every artifact lands under
        `.ci-artifacts/<instance>/`.
      regex: '^[a-z][a-z0-9-]{0,47}$'
    image-repository:
      type: string
      description: >-
        Candidate repository the image is built into, without a tag, for
        example registry.example.com/dev/platform/demo-app.
    working-directory:
      type: string
      description: Directory the build runs from, relative to the checkout.
      default: '.'
    context:
      type: string
      description: Build context, relative to working-directory.
      default: '.'
    dockerfile:
      type: string
      description: Dockerfile path, relative to the context.
      default: 'Dockerfile'
    build-args:
      type: array
      description: >-
        NAME=value build arguments. Never a secret: a build argument is
        recorded in the image history.
      default: []
    platforms:
      type: string
      description: Comma-separated target platforms.
      default: 'linux/amd64'
    tags:
      type: array
      description: Tags applied to the candidate image alongside its digest.
      default: ['$CI_COMMIT_SHORT_SHA']
    release-tag-pattern:
      type: string
      description: >-
        Which tags are release tags, as a regular expression applied to
        $CI_COMMIT_TAG. GitLab's protected-tag patterns are globs and cannot
        express a version number, so a project that protects `*` would otherwise
        build, push and promote on every tag it creates -- a documentation
        marker, a vendor import, anything. The default is semver with an
        optional pre-release suffix. A tag that does not match creates no
        pipeline at all, rather than one whose jobs are all gated off. No `/`:
        the value becomes a regular expression literal.
      regex: '^[^/]+$'
      default: '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
    build-sources:
      type: string
      description: >-
        Which pushes produce a release candidate. `default-branch-and-tags`
        builds, scans, signs and attests on a default-branch push as well as on
        a tag. `tags-only` confines the whole candidate chain to a protected tag
        push: the verify jobs still run on merge requests and default-branch
        pushes, and between tags nothing is built, pushed to a registry, signed
        or promoted.
      options: ['default-branch-and-tags', 'tags-only']
      default: 'default-branch-and-tags'
    enable-gitleaks:
      type: boolean
      description: >-
        Run secret detection. Off drops the job and its gate on the signing job.
      default: true
    enable-semgrep:
      type: boolean
      description: >-
        Run the SAST scan. Off drops the job and its gate on the signing job.
        An empty semgrep-rules has the same effect, so a project that has not
        chosen a ruleset gets no scan rather than an uncompilable pipeline.
      default: true
    enable-filesystem-trivy:
      type: boolean
      description: >-
        Run the filesystem scan. Off drops the job and its gate on the signing
        job.
      default: true
    enable-lockfiles:
      type: boolean
      description: >-
        Run the lockfile reproducibility check. Off drops the job and its gate
        on the signing job. An empty lockfiles has the same effect.
      default: true
    enable-syft:
      type: boolean
      description: >-
        Produce the authoritative SBOM. Off also drops the signing job, the
        Dependency-Track upload and the Vigil jobs, which read the SBOM or
        depend on something that does: nothing signs or publishes evidence that
        was never produced.
      default: true
    enable-image-trivy:
      type: boolean
      description: >-
        Scan the built image. Off also drops the signing job and the Vigil
        jobs, which attest the scan result, and removes the scan gate from the
        promotion. An image no one scanned can then be promoted: that is the
        consequence of turning this off, not an oversight.
      default: true
    enable-cosign:
      type: boolean
      description: >-
        Sign the digest and attach the SBOM and scan attestations. Off also
        drops the Vigil jobs and the signature gate on the promotion; set
        require-signatures to false as well, or the promotion refuses a digest
        with no signature beside it.
      default: true
    enable-promote:
      type: boolean
      description: >-
        Promote the digest that passed into the release project. Off ends the
        pipeline after attest, leaving the candidate where the build pushed it.
      default: true
    semgrep-rules:
      type: string
      description: >-
        Rule source for the SAST scan, passed to `semgrep --config`. A path in
        the consumer checkout is pinned, a registry pack is fetched live. Empty
        skips the scan, the same as enable-semgrep false; a project that runs
        the SAST brick states its ruleset, since inferring one is a choice made
        on the project's behalf.
      default: ''
    lockfiles:
      type: string
      description: >-
        Comma-separated list of every lockfile that must exist and be pinned,
        each relative to working-directory. Inferring the set from the checkout
        root reports a monorepo as having no dependencies at all, so the set is
        declared. A project that genuinely has none -- a stdlib-only Go module,
        whose go.sum is empty -- declares the literal `none`, which cannot be
        combined with a path. Empty skips the check, the same as
        enable-lockfiles false.
      default: ''
    secrets-policy-mode:
      type: string
      description: >-
        `blocking` fails the pipeline on a secret-detection finding.
        `advisory` records findings and still fails on a scanner that could
        not run.
      options: ['blocking', 'advisory']
      default: 'blocking'
    sast-policy-mode:
      type: string
      description: >-
        `blocking` fails the pipeline on a SAST finding at or above the
        threshold. `advisory` records findings and still fails on a scanner that
        could not run. Blocking is the release default; see
        examples/container-buildkit-onboarding/ before changing it.
      options: ['blocking', 'advisory']
      default: 'blocking'
    scan-severity:
      type: string
      description: Lowest severity that fails a filesystem or image scan.
      options: ['critical', 'high', 'medium', 'low']
      default: 'high'
    filesystem-policy-mode:
      type: string
      description: >-
        `blocking` fails the pipeline on a filesystem finding at or above
        scan-severity. `advisory` records findings and still fails on a scanner
        that could not run.
      options: ['blocking', 'advisory']
      default: 'blocking'
    image-policy-mode:
      type: string
      description: >-
        `blocking` fails the pipeline on an image finding at or above
        scan-severity, which is what keeps an unfit digest out of the release
        project. `advisory` records findings and still fails on a scanner that
        could not run.
      options: ['blocking', 'advisory']
      default: 'blocking'
    filesystem-ignore-unfixed:
      type: boolean
      description: >-
        Ignore filesystem findings with no fix available. The default keeps them
        gating. Two inputs rather than one because the two bricks declare the
        input with different types: security-filesystem-trivy takes a boolean
        and security-image-trivy takes a string, and an input forwarded at the
        wrong type is rejected when the include resolves.
      default: false
    image-ignore-unfixed:
      type: string
      description: >-
        Ignore image findings with no fix available. The default keeps them
        gating.
      options: ['true', 'false']
      default: 'false'
    push-candidate:
      type: boolean
      description: >-
        Push the build result to the candidate registry. False builds only,
        produces no image.json and leaves nothing for the rest of the chain to
        consume, so it is useful with every brick after build switched off.
      default: true
    smoke-test:
      type: string
      description: >-
        Run a Compose smoke test against the built digest before it is scanned,
        signed and promoted. When enabled it becomes a required gate on the
        signing job.
      options: ['true', 'false']
      default: 'false'
    smoke-test-image-variable:
      type: string
      description: >-
        Environment variable the Compose file reads for the image under test.
        Only used when smoke-test is true.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'APP_IMAGE'
    smoke-test-compose-file:
      type: string
      description: Compose file the smoke test runs, relative to working-directory.
      default: 'docker-compose.test.yml'
    smoke-test-make-target:
      type: string
      description: Make target the smoke test invokes.
      default: 'test-smoke'
    dependency-track:
      type: string
      description: >-
        Upload the authoritative SBOM to Dependency-Track and wait for the
        analysis to complete. Needs dependency-track-api-url.
      options: ['true', 'false']
      default: 'false'
    dependency-track-api-url:
      type: string
      description: >-
        Dependency-Track API base URL. Only read when dependency-track is true.
      default: ''
    dependency-track-wait:
      type: string
      description: >-
        Wait for Dependency-Track to finish analysing the uploaded SBOM. False
        uploads and returns, which makes the upload a record rather than a gate.
      options: ['true', 'false']
      default: 'true'
    dependency-track-timeout:
      type: number
      description: Seconds to wait for that analysis before failing the job.
      default: 600
    vigil:
      type: string
      description: >-
        Publish the release record to Vigil and require a readiness verdict
        before the image is promoted. Needs vigil-url.
      options: ['true', 'false']
      default: 'false'
    vigil-url:
      type: string
      description: Vigil base URL. Only read when vigil is true.
      default: ''
    vigil-request-timeout:
      type: number
      description: Seconds the release-record publish waits for Vigil.
      default: 120
    vigil-require-readiness:
      type: string
      description: Lowest readiness verdict that lets the promotion proceed.
      options: ['green', 'amber', 'yellow']
      default: 'green'
    vigil-max-wait:
      type: number
      description: Seconds to wait for that verdict before failing the job.
      default: 300
    vigil-poll-interval:
      type: number
      description: Seconds between readiness polls.
      default: 15
    destination-project:
      type: string
      description: Harbor project the release is promoted into.
      default: 'prod'
    destination-tags:
      type: string
      description: Tags applied to the promoted digest in the release project.
      default: '$CI_COMMIT_TAG'
    require-signatures:
      type: string
      description: >-
        Refuse to promote a digest with no cosign signature beside it in the
        candidate project. Leave it true unless enable-cosign is false, in which
        case the promotion would refuse every digest.
      options: ['true', 'false']
      default: 'true'
    environment:
      type: string
      description: >-
        GitLab environment recorded by the promotion. One of the estate's
        names in .ci/estate.yml.
      options: ['mgt', 'dev', 'prod']
      default: 'prod'
    registry-username-variable:
      type: string
      description: >-
        Name of the CI variable holding the registry username. The name, never
        the value: the build, test, scan and signing jobs read it with printenv
        at job time. The default is the name this library read before the input
        existed.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'HARBOR_USER'
    registry-password-variable:
      type: string
      description: >-
        Name of the CI variable holding the registry password or robot token.
        The name, never the value.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'HARBOR_PASSWORD'
    ca-bundle-variable:
      type: string
      description: >-
        Name of a CI variable holding a PEM bundle every registry-facing job
        trusts before its first call, for a registry whose certificate an
        internal authority issued. A file variable (the value is a path) or an
        ordinary one (the value is the PEM). Empty skips it and downloads
        nothing.
      regex: '^$|^[A-Z][A-Z0-9_]*$'
      default: ''
    trivy-db-repository:
      type: string
      description: >-
        OCI repository both trivy scans pull the vulnerability database from.
        Empty keeps trivy's default, which reaches ghcr.io directly. A site with
        no egress points this at its own mirror of that repository.
      default: ''
    trivy-java-db-repository:
      type: string
      description: >-
        OCI repository for trivy's Java database, fetched only when a scan finds
        a jar. Empty keeps trivy's default.
      default: ''
    cosign-release-url:
      type: string
      description: >-
        Base URL the signing job downloads the pinned cosign binary from. The
        checksum is pinned, so a mirror changes where the bytes come from and
        not which bytes are accepted.
      default: 'https://github.com/sigstore/cosign/releases/download'
    runner-tags:
      type: array
      description: Approved runner selection from the estate profile.
      default: []
    build-image:
      type: string
      description: >-
        Approved BuildKit image. A digest pins what runs; a tag is accepted so a
        site whose only path to an image is a proxy cache can name
        <mirror>/moby/buildkit:v0.33.0 and let the cache resolve it. The default
        is moby/buildkit v0.33.0, by digest.
      regex: '^.+(@sha256:[0-9a-f]{64}|:[A-Za-z0-9._-]{1,128})$'
      default: 'docker.io/moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3'
    trivy-image:
      type: string
      description: Approved Trivy image pinned by digest, used by both scans.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c'
    syft-image:
      type: string
      description: Approved Syft image pinned by digest.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/anchore/syft@sha256:c5a32143787730c72c58aee4227d9b0242ccc463aa42214b26e2b18f692c1a71'
    semgrep-image:
      type: string
      description: Approved Semgrep image pinned by digest.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/semgrep/semgrep@sha256:570305f199ab668295ac0921667263cc03dcc3cbd7a8099866d3699cc0f2cdcc'
    gitleaks-image:
      type: string
      description: Approved gitleaks image pinned by digest.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46'
    alpine-image:
      type: string
      description: Approved Alpine image pinned by digest, used by the lockfile check.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
    python-image:
      type: string
      description: >-
        Approved Python image pinned by digest. Carries the cosign, promotion,
        Dependency-Track and Vigil runtimes.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
    docker-image:
      type: string
      description: >-
        Approved Docker CLI and dind image pinned by digest. Only used when
        smoke-test is true.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/docker@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce'
---

#### Pipeline ownership ####
# One pipeline per change. The second rule is what stops a branch pipeline
# running beside the merge request pipeline for the same commits.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # The one place a release tag is defined. Gating the pipeline rather than
    # each job means there is one condition to read and none to drift.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /$[[ inputs.release-tag-pattern ]]/'
    - when: never

stages:
  - verify
  - build
  - test
  - scan
  - attest
  - publish

#### Components at the same shared-CI revision ####
include:
  #### verify ####
  - local: '/templates/security-secrets-gitleaks/template.yml'
    rules:
      - if: '"$[[ inputs.enable-gitleaks ]]" == "true"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: verify
      working-directory: $[[ inputs.working-directory ]]
      execution-image: $[[ inputs.gitleaks-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      policy-mode: $[[ inputs.secrets-policy-mode ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  - local: '/templates/security-sast-semgrep/template.yml'
    rules:
      - if: '"$[[ inputs.enable-semgrep ]]" == "true" && "$[[ inputs.semgrep-rules ]]" != ""'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: verify
      working-directory: $[[ inputs.working-directory ]]
      execution-image: $[[ inputs.semgrep-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      rules-ref: $[[ inputs.semgrep-rules ]]
      severity-threshold: $[[ inputs.scan-severity ]]
      policy-mode: $[[ inputs.sast-policy-mode ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  - local: '/templates/security-filesystem-trivy/template.yml'
    rules:
      - if: '"$[[ inputs.enable-filesystem-trivy ]]" == "true"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: verify
      working-directory: $[[ inputs.working-directory ]]
      execution-image: $[[ inputs.trivy-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      severity-threshold: $[[ inputs.scan-severity ]]
      scanners: 'vuln,secret,misconfig'
      ignore-unfixed: $[[ inputs.filesystem-ignore-unfixed ]]
      policy-mode: $[[ inputs.filesystem-policy-mode ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      db-repository: $[[ inputs.trivy-db-repository ]]
      java-db-repository: $[[ inputs.trivy-java-db-repository ]]

  - local: '/templates/quality-dependency-lockfiles/template.yml'
    rules:
      - if: '"$[[ inputs.enable-lockfiles ]]" == "true" && "$[[ inputs.lockfiles ]]" != ""'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: verify
      working-directory: $[[ inputs.working-directory ]]
      execution-image: $[[ inputs.alpine-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      lockfiles: $[[ inputs.lockfiles ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  #### build ####
  # The builder has no `needs:`, so it waits for the whole verify stage. That
  # stage barrier is what puts secret detection ahead of the build (section
  # 11.1) without wiring four edges by hand.
  - local: '/templates/container-build-buildkit/template.yml'
    rules:
      - if: '"$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: build
      execution-image: $[[ inputs.build-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      working-directory: $[[ inputs.working-directory ]]
      context: $[[ inputs.context ]]
      dockerfile: $[[ inputs.dockerfile ]]
      image-repository: $[[ inputs.image-repository ]]
      tags: $[[ inputs.tags ]]
      build-args: $[[ inputs.build-args ]]
      platforms: $[[ inputs.platforms ]]
      push-candidate: $[[ inputs.push-candidate ]]
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  - local: '/templates/container-build-buildkit/template.yml'
    rules:
      - if: '"$[[ inputs.build-sources ]]" == "tags-only"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: build
      execution-image: $[[ inputs.build-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      working-directory: $[[ inputs.working-directory ]]
      context: $[[ inputs.context ]]
      dockerfile: $[[ inputs.dockerfile ]]
      image-repository: $[[ inputs.image-repository ]]
      tags: $[[ inputs.tags ]]
      build-args: $[[ inputs.build-args ]]
      platforms: $[[ inputs.platforms ]]
      push-candidate: $[[ inputs.push-candidate ]]
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'

  #### test ####
  - local: '/templates/container-smoke-test/template.yml'
    rules:
      - if: '"$[[ inputs.smoke-test ]]" == "true" && "$[[ inputs.build-sources ]]" == "default-branch-and-tags"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: test
      execution-image: $[[ inputs.docker-image ]]
      dind-image: $[[ inputs.docker-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      working-directory: $[[ inputs.working-directory ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      service-image-jobs: []
      image-identities:
        - '$[[ inputs.smoke-test-image-variable ]]=.ci-artifacts/$[[ inputs.instance ]]/container-build-buildkit/image.json'
      compose-file: $[[ inputs.smoke-test-compose-file ]]
      make-target: $[[ inputs.smoke-test-make-target ]]
      registry-username-variable: $[[ inputs.registry-username-variable ]]
      registry-password-variable: $[[ inputs.registry-password-variable ]]
      ca-bundle-variable: $[[ inputs.ca-bundle-variable ]]
      run-rules:
