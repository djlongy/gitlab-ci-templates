      gate-jobs: []
      vigil-url: $[[ inputs.vigil-url ]]
      require-readiness: $[[ inputs.vigil-require-readiness ]]
      max-wait: $[[ inputs.vigil-max-wait ]]
      poll-interval: $[[ inputs.vigil-poll-interval ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'

  - local: '/templates/security-verify-vigil/template.yml'
    rules:
      - if: '"$[[ inputs.vigil ]]" == "true" && "$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true" && "$[[ inputs.build-sources ]]" == "tags-only"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: attest
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      sync-job: '$[[ inputs.instance ]]:security-sync-vigil'
      gate-jobs: []
      vigil-url: $[[ inputs.vigil-url ]]
      require-readiness: $[[ inputs.vigil-require-readiness ]]
      max-wait: $[[ inputs.vigil-max-wait ]]
      poll-interval: $[[ inputs.vigil-poll-interval ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'

  #### publish ####
  # Promotion carries the scan and the signature in its own `needs:`, so the
  # release gates are in its transitive chain rather than merely in an earlier
  # stage (section 8.8). The Vigil branch adds the readiness verdict; without
  # it, enabling Vigil would produce a verdict nothing waits for.
  #
  # Both entries require the whole release chain, not only enable-promote. A
  # promotion whose scan and signature gates were switched off would publish on
  # no evidence at all, so switching one of those off ends the pipeline at
  # attest instead of promoting something nothing checked.
  - local: '/templates/container-promote-harbor/template.yml'
    rules:
      - if: '"$[[ inputs.enable-promote ]]" == "true" && "$[[ inputs.vigil ]]" == "false" && "$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: publish
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      gate-jobs:
        - job: '$[[ inputs.instance ]]:security-image-trivy'
          artifacts: false
        - job: '$[[ inputs.instance ]]:container-sign-attest-cosign'
          artifacts: false
      destination-project: $[[ inputs.destination-project ]]
      destination-tags: $[[ inputs.destination-tags ]]
      require-signatures: $[[ inputs.require-signatures ]]
      environment: $[[ inputs.environment ]]
      run-rules:
        # The same protected-tag gate the other publish jobs in this repository
        # use, spelled the same way, so the three can be compared by eye.
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
          when: manual
        - when: never

  - local: '/templates/container-promote-harbor/template.yml'
    rules:
      - if: '"$[[ inputs.enable-promote ]]" == "true" && "$[[ inputs.vigil ]]" == "true" && "$[[ inputs.enable-cosign ]]" == "true" && "$[[ inputs.enable-syft ]]" == "true" && "$[[ inputs.enable-image-trivy ]]" == "true"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: publish
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-buildkit'
      build-component: container-build-buildkit
      gate-jobs:
        - job: '$[[ inputs.instance ]]:security-image-trivy'
          artifacts: false
        - job: '$[[ inputs.instance ]]:container-sign-attest-cosign'
          artifacts: false
        - job: '$[[ inputs.instance ]]:security-verify-vigil'
          artifacts: false
      destination-project: $[[ inputs.destination-project ]]
      destination-tags: $[[ inputs.destination-tags ]]
      require-signatures: $[[ inputs.require-signatures ]]
      environment: $[[ inputs.environment ]]
      run-rules:
        # The same protected-tag gate the other publish jobs in this repository
        # use, spelled the same way, so the three can be compared by eye.
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
          when: manual
        - when: never
