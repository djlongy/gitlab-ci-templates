  #### publish ####
  # Promotion carries the scan and the signature in its own `needs:`, so the
  # release gates are in its transitive chain rather than merely in an earlier
  # stage (section 8.8). The Vigil branch adds the readiness verdict; without
  # it, enabling Vigil would produce a verdict nothing waits for.
  - local: '/templates/container-promote-harbor/template.yml'
    rules:
      - if: '"$[[ inputs.vigil ]]" == "false"'
    inputs:
      instance: $[[ inputs.instance ]]
      stage: publish
      execution-image: $[[ inputs.python-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      build-job: '$[[ inputs.instance ]]:container-build-jib'
      build-component: container-build-jib
      gate-jobs:
        - job: '$[[ inputs.instance ]]:security-image-trivy'
          artifacts: false
        - job: '$[[ inputs.instance ]]:container-sign-attest-cosign'
          artifacts: false
      destination-project: $[[ inputs.destination-project ]]
      destination-tags: $[[ inputs.destination-tags ]]
      require-signatures: 'true'
      environment: $[[ inputs.environment ]]
      run-rules:
        # The same protected-tag gate the other publish jobs in this repository
        # use, spelled the same way, so the three can be compared by eye.
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
          when: manual
        - when: never

