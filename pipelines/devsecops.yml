# Full DevSecOps pipeline — include this single file to get the complete chain
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/pipelines/devsecops.yml'
#       ref: main
#
# Stages (in execution order):
#   - verify        (semgrep SAST, trivy-fs SCA/secrets/misconfig, lockfile-check, sonarqube)
#   - secret-scan   (gitleaks)
#   - build         (ko, buildkit, jib, helm-oci — images pushed to the registry)
#   - test          (smoke tests — validate containers boot, wiring, and flows)
#   - scan          (trivy-image vuln gate + syft-sbom deep component analysis)
#   - sign          (cosign sign + 3 attestations: SBOM, SLSA provenance, vuln)
#
# SBOM strategy: Syft is the primary SBOM generator (deeper dependency detection).
# Trivy remains the vulnerability scanner and gate. Cosign attests the Syft SBOM.
# If Syft is not used, the pipeline falls back to Trivy's SBOM output.
#
# This template provides hidden jobs (prefixed with .). Extend them in your
# pipeline to create concrete jobs:
#   my-build:
#     extends: .buildkit-build
#     variables:
#       IMAGE_NAME: registry.example.com/myteam/myapp
#   my-smoke-test:
#     extends: .smoke-test
#     variables:
#       API_IMAGE: registry.example.com/myteam/myapp:${CI_COMMIT_SHORT_SHA}
#   my-scan:
#     extends: .trivy-image
#     variables:
#       TRIVY_IMAGE: registry.example.com/myteam/myapp:${CI_COMMIT_SHORT_SHA}
#
# Tool versions (all pinned — see Trivy supply chain advisory):
#   Trivy: 0.69.3 (last safe release before 0.69.4-6 compromise)
#   Syft: v1.20.0
#   Semgrep: 1.79.0
#   Cosign: v2.4.1
#   BuildKit: v0.18.2

stages:
  - verify
  - secret-scan
  - build
  - test
  - scan
  - sign

include:
  # Build
  - local: '/build/buildkit.yml'
  - local: '/build/ko.yml'
  - local: '/build/jib.yml'
  - local: '/build/helm-oci.yml'
  # Test
  - local: '/test/smoke-test.yml'
  # Verify — source code analysis
  - local: '/security/gitleaks.yml'
  - local: '/security/semgrep.yml'
  - local: '/security/sonarqube.yml'
  - local: '/security/lockfile-check.yml'
  - local: '/security/trivy-fs.yml'
  # Scan — image vulnerability analysis + SBOM generation
  - local: '/security/trivy-image.yml'
  - local: '/security/syft-sbom.yml'
  # Sign — cosign signature + attestations (SBOM, SLSA, vuln)
  - local: '/security/cosign-sign.yml'
