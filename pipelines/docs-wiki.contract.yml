---
# pipelines/docs-wiki.contract.yml — the contract for the composition beside it.
#
# Section 6.3. The catalogue generator reads this plus the spec:inputs header
# of docs-wiki.yml; do not restate inputs here.
name: docs-wiki
kind: pipeline
status: released
introduced_in: 1.0.0
minimum_gitlab: '18.9'
emitted_jobs:
  - pattern: '{instance}:docs-wiki-sync'
    stage: verify
    blocking: true
outputs: []
required_secrets:
  - name: WIKI_TOKEN
    kind: ci-variable
    scope: write_repository on the project, Maintainer when the default branch is protected.
      Clones and pushes the wiki, and pushes pulled wiki edits to the default branch.
    protected_ref_required: false
runtime_image:
  reference: 'per component: every include forwards a digest-pinned execution image, and the
    ones a consumer may need to change are inputs of this composition'
  pinning: input
trust:
  privileged: false
  network_egress:
    - gitlab.example.com
    - registry.example.com
    - the configured Python package index
  runner_profile: shared-docker, the estate instance runners. They are registered untagged,
    so runner-tags selects nothing today and a tag is not a permission boundary.
  protected_ref_required: false
validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
    - integration-tested
  verified_at: 2026/09/16
  revision: '1.0.0-rc.2'
  environment: >-
    gitlab.example.com 18.9.1-ee, POST /api/v4/projects/:id/ci/lint. Executed on shared
    ref 1.0.0-rc.2 by consumer pipelines on the originating estate, 2026/09: three
    wiki-sync consumers and a documentation consumer. Every job the composition creates
    ran green, on the push and the schedule sources.
  notes: 'Three pipeline sources and no others: a default-branch push, the wiki-page-event
    webhook that calls the trigger API, and the schedule that is the safety net. WIKI_TOKEN
    is required by every rule, so a project without it skips the job rather than failing partway
    through regenerating its wiki. This composition deliberately does not ship the `.not_for_wiki_sync`
    fragment the old template had, which suppressed every job in a consumer''s pipeline on
    trigger and schedule and cost one consumer its scheduled pipelines. The runtime is vendored
    into the component at this revision, so pinning the include pins the code that runs. Executed in three
    consumer projects on 2026/09/16, all green; those runs exposed RC2-2, so the evidence
    covers the docs-to-wiki direction and not the wiki-to-repo pull, which a swallowed
    failure skipped. Fixed in 1.0.0-rc.2; the pull direction needs a re-run on that ref.'
