---
# pipelines/kubernetes-gitops.contract.yml — the contract for the composition beside it.
#
# Section 6.3. The catalogue generator reads this plus the spec:inputs header
# of kubernetes-gitops.yml; do not restate inputs here.
name: kubernetes-gitops
kind: pipeline
status: released
introduced_in: 1.0.0
minimum_gitlab: '18.9'
emitted_jobs:
  - pattern: '{instance}:kubernetes-validate'
    stage: verify
    blocking: true
  - pattern: '{instance}:security-secrets-gitleaks'
    stage: verify
    blocking: true
  - pattern: '{instance}:helm-validate'
    stage: verify
    blocking: true
outputs: []
required_secrets: []
runtime_image:
  reference: 'per component: every include forwards a digest-pinned execution image, and the
    ones a consumer may need to change are inputs of this composition'
  pinning: input
trust:
  privileged: false
  network_egress:
    - registry.example.com
    - github.com
    - objects.githubusercontent.com
    - raw.githubusercontent.com
  runner_profile: shared-docker, the estate instance runners. They are registered untagged,
    so runner-tags selects nothing today and a tag is not a permission boundary.
  protected_ref_required: false
validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
    - integration-tested
  verified_at: 2026/09/16
  revision: '1.0.0-rc.2'
  environment: >-
    gitlab.example.com 18.9.1-ee, POST /api/v4/projects/:id/ci/lint. Executed on shared
    ref 1.0.0-rc.2 by consumer pipelines on the originating estate, 2026/09: two
    consumers. Every job the composition creates -- kubernetes-validate and
    security-secrets-gitleaks -- ran green on the merge-request and default-branch
    sources in both projects.
  notes: 'CI validates, a controller applies. .ci/estate.yml records kubernetes.deployment_mode
    as gitops, so no deploy stage exists here and adding one would give the same objects two
    owners. Chart validation is opt-in through `charts`. Rendering is not reconciliation:
    `helm template` and a manifest render run without a cluster. Evidence is gitlab-linted
    only.'
