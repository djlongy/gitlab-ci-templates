---
# pipelines/repository-secret-audit.contract.yml — the contract for the composition beside it.
#
# Section 6.3. The catalogue generator reads this plus the spec:inputs header
# of repository-secret-audit.yml; do not restate inputs here.
name: repository-secret-audit
kind: pipeline
status: experimental
introduced_in: 1.0.0
minimum_gitlab: '18.9'
emitted_jobs:
  - pattern: '{secrets-instance}:security-repository-audit'
    stage: verify
    blocking: true
  - pattern: '{terraform-instance}:security-repository-audit'
    stage: verify
    blocking: true
outputs:
  - path: .ci-artifacts/{instance}/security-repository-audit/audit-coverage.json
    producer: '{instance}:security-repository-audit'
    format: json
    schema: schema_version 1; source (explicit|group), group_path, generated_at, in_scope,
      cloned, repositories[] with path and outcome
    subject_identity: The full path of every repository in scope, with whether it was actually
      cloned. This is the coverage claim the audit is allowed to make, and it is written by
      both instances under their own instance name.
    retention: 1 week
  - path: .ci-artifacts/{instance}/security-repository-audit/scan-result.json
    producer: '{instance}:security-repository-audit'
    format: json
    schema: schema_version 1; subject, the coverage record embedded, each scanner's outcome
      (clean|findings|error|skipped), policy_mode, source_commit, pipeline_id, job_id, completed_at
    subject_identity: The repository set named in the embedded coverage record.
    retention: 1 week
  - path: .ci-artifacts/{instance}/security-repository-audit/gitleaks/<repository>.json
    producer: '{instance}:security-repository-audit'
    format: json
    schema: Native gitleaks JSON report, one per scanned repository, redacted.
    subject_identity: Repository directory name, which is its full path with / replaced by _.
    retention: 1 week
  - path: .ci-artifacts/{instance}/security-repository-audit/terraform-audit.log
    producer: '{terraform-instance}:security-repository-audit'
    format: text
    schema: Console output of audit-secrets.sh. Only the Terraform instance writes it; the
      secrets instance runs with scan-terraform false.
    retention: 1 week
  - path: .ci-artifacts/{instance}/security-repository-audit/terraform-state-scan.log
    producer: '{terraform-instance}:security-repository-audit'
    format: text
    schema: Console output of scan-state.sh, under the same condition as the log above.
    retention: 1 week
required_secrets:
  - name: GROUP_SCAN_TOKEN
    kind: ci-variable
    scope: Default name only; the consuming project names the variable through the api-token-variable
      input and both instances read the same one. read_api to list a group, read_repository
      to clone. Section 10.2 prefers a short-lived identity; this is a static token inherited
      from security/group-scan.yml and is recorded as such rather than presented as compliant.
    protected_ref_required: false
runtime_image:
  reference: 'per component: the include forwards a digest-pinned execution image, and the
    one a consumer may need to change is the audit-image input of this composition'
  pinning: input
trust:
  privileged: false
  network_egress:
    - gitlab.example.com
    - registry.example.com
    - the Alpine package mirror, for bash, curl, jq and git
  runner_profile: shared-docker, the estate instance runners. They are registered untagged,
    so runner-tags selects nothing today and a tag is not a permission boundary.
  protected_ref_required: false
validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
  verified_at: 2026/09/15
  environment: gitlab.example.com 18.9.1-ee, project 18, POST /api/v4/projects/<project-id>/ci/lint
  notes: 'Two schedules and nothing else: `schedule` and `web`. An audit is not a branch or
    merge request check, and the workflow rules close with `when: never` so including this
    file cannot add a second pipeline beside a consumer''s own. Both jobs come from one
    component under two instances, which is what replaced the four hand-copied jobs in
    security/group-scan.yml and security/terraform-audit.yml; the two copies had drifted
    on cloning and on the execution image. The secrets instance scans the group or an explicit
    set for secrets only; the Terraform instance scans its named repositories for secrets
    AND runs the Terraform anti-pattern and state checks over the same clones. Scope is an
    input, the schedule and the token belong to the project that runs the pipeline. Evidence
    is gitlab-linted only: the merged configuration compiles and no pipeline has been executed.'
