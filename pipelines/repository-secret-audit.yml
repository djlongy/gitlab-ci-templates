---
# pipelines/repository-secret-audit.yml
#
# The scheduled estate audit, as one root composition. It replaces the four jobs
# that security/group-scan.yml and security/terraform-audit.yml created:
# `group-secret-scan`, `clone-terraform-repos`, `terraform-secret-audit` and
# `terraform-state-scan`.
#
# Section 11.6: "The former Terraform secret audit is a composition: obtain an
# explicit repository set and scan it. Make the executor project's schedule,
# scope and credentials operational configuration." The scope is inputs here,
# the schedule and the token belong to whichever project runs this pipeline.
#
# Both jobs come from one component with different inputs, which is what the
# `instance` mechanism is for. The old files hand-copied a job stanza instead,
# and the two copies drifted: one cloned into an artifact and the other did not,
# one used the gitleaks image and the other alpine.
#
# This composition owns `workflow:` and `stages:`, so a project includes it as
# its whole pipeline. A project that also has other jobs includes the component
# directly instead, as this repository's own .gitlab-ci.yml does.

#### Consumer interface ####
spec:
  inputs:
    secrets-instance:
      type: string
      description: Instance name for the estate-wide secret scan.
      regex: '^[a-z][a-z0-9-]{0,47}$'
      default: secrets
    terraform-instance:
      type: string
      description: Instance name for the Terraform repository audit.
      regex: '^[a-z][a-z0-9-]{0,47}$'
      default: terraform
    repositories:
      type: string
      description: >-
        Explicit set for the secret scan: whitespace-separated full repository
        paths. Supply this or group-path, not both and not neither. It is a
        string rather than an array because GitLab rejects an array as a job
        variable value.
      default: ''
    group-path:
      type: string
      description: >-
        Alternative scope for the secret scan: a group's full path, subgroups
        included, resolved through the API at job time.
      default: ''
    terraform-repositories:
      type: string
      description: >-
        Explicit set for the Terraform audit, whitespace-separated full paths.
        Required: an audit with no declared scope has nothing to certify.
    api-token-variable:
      type: string
      description: >-
        Name of the CI variable holding the token that lists and clones the
        repositories. The name, never the value.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: GROUP_SCAN_TOKEN
    audit-image:
      type: string
      description: Approved audit execution image, pinned by digest.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46'
    clone-depth:
      type: number
      description: >-
        git clone depth for both jobs. 1 scans the current tree; 0 clones full
        history, which is what finding a secret that was later deleted needs.
      default: 1
    runner-tags:
      type: array
      description: Approved runner selection.
      default: []
---

#### Pipeline ownership ####
# An audit runs on its schedule or when somebody starts it deliberately. It is
# not a branch or merge request check, and it must not create a second pipeline
# beside one.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - verify

#### Components at the same shared-CI revision ####
include:
  - local: '/templates/security-repository-audit/template.yml'
    inputs:
      instance: $[[ inputs.secrets-instance ]]
      stage: verify
      repositories: $[[ inputs.repositories ]]
      group-path: $[[ inputs.group-path ]]
      scan-secrets: true
      scan-terraform: false
      clone-depth: $[[ inputs.clone-depth ]]
      api-token-variable: $[[ inputs.api-token-variable ]]
      execution-image: $[[ inputs.audit-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
  - local: '/templates/security-repository-audit/template.yml'
    inputs:
      instance: $[[ inputs.terraform-instance ]]
      stage: verify
      repositories: $[[ inputs.terraform-repositories ]]
      # The Terraform repositories get both scanners: the anti-pattern and state
      # checks are what the old terraform-audit did, and gitleaks over the same
      # clones costs one pass and is why this audit exists.
      scan-secrets: true
      scan-terraform: true
      clone-depth: $[[ inputs.clone-depth ]]
      api-token-variable: $[[ inputs.api-token-variable ]]
      execution-image: $[[ inputs.audit-image ]]
      runner-tags: $[[ inputs.runner-tags ]]
      run-rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
