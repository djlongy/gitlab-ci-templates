# Reusable Cosign image signing + attestation template (Vault Transit backend)
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/cosign-sign.yml'
#       ref: main
#   variables:
#     IMAGE_DIGEST: "registry.example.com/myteam/myapp@sha256:abc123..."
#
# Include trivy-image.yml alongside this file: the cosign-sign job has a hard
# needs: on trivy-image and will not resolve on its own.
#
# Authentication: CI job must have VAULT_ADDR and VAULT_TOKEN set.
# The GitLab CI JWT auth role 'gitlab-ci' includes the svc-cosign-sign policy.
#
# How it works:
#   - Cosign calls Vault Transit API to sign — private key NEVER leaves Vault
#   - Uses hashivault://cosign URI (ECDSA P-256 key in Transit engine)
#   - Three attestations (each toggleable): SBOM, SLSA provenance, vulnerability scan
#   - SBOM source: prefers Syft output (sbom.cdx.json) for higher-fidelity component
#     detection; falls back to Trivy SBOM if Syft is not in the pipeline
#
# Toggle variables:
#   COSIGN_VERSION:       Cosign image tag (default: v2.4.1, pinned)
#   COSIGN_SIGN_ENABLED:  "true" to sign the image (default: true)
#   COSIGN_ATTEST_SBOM:   "true" to attach SBOM attestation (default: true)
#   COSIGN_ATTEST_SLSA:   "true" to attach SLSA provenance (default: true)
#   COSIGN_ATTEST_VULN:   "true" to attach vuln scan results (default: true)
#   SBOM_FILE:            Path to CycloneDX/SPDX SBOM (default: sbom.cdx.json)
#   VULN_FILE:            Path to Trivy JSON report (default: trivy-report.json)
#   COSIGN_TLOG_UPLOAD:   "true" to upload to Rekor transparency log (default: false)

.cosign-sign:
  stage: sign
  image:
    name: alpine:3.21
    entrypoint: [""]
  variables:
    COSIGN_VERSION: "v2.4.1"
    IMAGE_DIGEST: ""
    VAULT_ADDR: "https://vault.example.com:8200"
    VAULT_TOKEN: ""
    COSIGN_KEY: "hashivault://cosign"
    SBOM_FILE: "sbom.cdx.json"
    VULN_FILE: "trivy-report.json"
    COSIGN_SIGN_ENABLED: "true"
    COSIGN_ATTEST_SBOM: "true"
    COSIGN_ATTEST_SLSA: "true"
    COSIGN_ATTEST_VULN: "true"
    COSIGN_TLOG_UPLOAD: "false"
  id_tokens:
    VAULT_JWT:
      aud: https://vault.example.com:8200
  before_script:
    - |
      # Install cosign into Alpine
      apk add --no-cache curl bash > /dev/null 2>&1
      COSIGN_URL="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
      curl -sL "${COSIGN_URL}" -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
      echo "Cosign ${COSIGN_VERSION} installed"
    - |
      # Configure Docker registry auth for cosign (needs to pull image manifests)
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        REGISTRY=$(echo "${IMAGE_DIGEST}" | cut -d/ -f1)
        if [ -z "${REGISTRY}" ] || [ "${REGISTRY}" = "${IMAGE_DIGEST}" ]; then
          REGISTRY="registry.example.com"
        fi
        mkdir -p ~/.docker
        AUTH=$(echo -n "${REGISTRY_USER}:${REGISTRY_PASSWORD}" | base64)
        echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > ~/.docker/config.json
        echo "Registry auth configured for ${REGISTRY}"
      fi
    - |
      # Obtain Vault token via GitLab CI JWT auth
      if [ -z "${VAULT_TOKEN}" ]; then
        # Check for JWT token availability
        JWT_TOKEN="${VAULT_JWT:-${CI_JOB_JWT_V2:-${CI_JOB_JWT:-}}}"
        if [ -z "${JWT_TOKEN}" ]; then
          echo "WARN: No JWT available — cannot authenticate to Vault"
          echo "Check id_tokens configuration in cosign-sign template"
        else
          echo "Authenticating to Vault via JWT (token length: ${#JWT_TOKEN})..."
          VAULT_RESPONSE=$(curl -sf -X POST             -H "Content-Type: application/json"             -d "{\"jwt\":\"${JWT_TOKEN}\",\"role\":\"gitlab-ci\"}"             "${VAULT_ADDR}/v1/auth/jwt/login" 2>&1 || true)
          if echo "${VAULT_RESPONSE}" | grep -q "client_token"; then
            export VAULT_TOKEN=$(echo "${VAULT_RESPONSE}" | grep -o '"client_token":"[^"]*"' | cut -d'"' -f4)
            echo "Vault token obtained (length: ${#VAULT_TOKEN})"
          else
            echo "WARN: JWT auth failed — response: ${VAULT_RESPONSE:0:200}"
          fi
        fi
      fi
  script:
    - |
      if [ -z "${IMAGE_DIGEST}" ]; then
        echo "ERROR: IMAGE_DIGEST must be set to the full image digest reference"
        exit 1
      fi
      if [ -z "${VAULT_TOKEN}" ]; then
        echo "WARN: No VAULT_TOKEN — skipping cosign signing"
        echo "Set up Vault JWT auth or provide VAULT_TOKEN CI variable"
        exit 0
      fi

      TLOG_FLAG="--tlog-upload=${COSIGN_TLOG_UPLOAD}"

      echo "=== Cosign Sign + Attest ==="
      echo "Image: ${IMAGE_DIGEST}"
      echo "Sign: ${COSIGN_SIGN_ENABLED} | SBOM: ${COSIGN_ATTEST_SBOM} | SLSA: ${COSIGN_ATTEST_SLSA} | Vuln: ${COSIGN_ATTEST_VULN}"
      echo "Transparency log: ${COSIGN_TLOG_UPLOAD}"
    # Generate SLSA v0.2 provenance (always, even if attestation is off — cheap)
    - |
      cat > provenance.slsa.json <<SLSA_EOF
      {
        "builder": {"id": "${CI_SERVER_URL}"},
        "buildType": "https://gitlab.com/gitlab-ci",
        "invocation": {
          "configSource": {
            "uri": "git+${CI_PROJECT_URL}",
            "digest": {"sha1": "${CI_COMMIT_SHA}"},
            "entryPoint": "${CI_CONFIG_PATH:-.gitlab-ci.yml}"
          }
        },
        "metadata": {
          "buildStartedOn": "${CI_JOB_STARTED_AT}",
          "completeness": {"parameters": true, "environment": false, "materials": true}
        },
        "materials": [
          {"uri": "git+${CI_PROJECT_URL}", "digest": {"sha1": "${CI_COMMIT_SHA}"}}
        ]
      }
      SLSA_EOF
    # Verify Transit key is accessible
    - |
      echo "Verifying Vault Transit access..."
      cosign public-key --key "${COSIGN_KEY}" > /dev/null 2>&1 || {
        echo "ERROR: Cannot read cosign public key from Vault Transit."
        exit 1
      }
    # Sign the image
    - |
      if [ "${COSIGN_SIGN_ENABLED}" = "true" ]; then
        cosign sign --key "${COSIGN_KEY}" --yes ${TLOG_FLAG} \
          -a "ci.commit.sha=${CI_COMMIT_SHA}" \
          -a "ci.job.url=${CI_JOB_URL}" \
          -a "ci.project=${CI_PROJECT_PATH}" \
          "${IMAGE_DIGEST}"
        echo "Image signed: ${IMAGE_DIGEST}"
      else
        echo "SKIP: Image signing disabled (COSIGN_SIGN_ENABLED=false)"
      fi
    # Attest SBOM
    - |
      if [ "${COSIGN_ATTEST_SBOM}" = "true" ]; then
        if [ -f "${SBOM_FILE}" ]; then
          # Detect format from filename
          SBOM_TYPE="cyclonedx"
          echo "${SBOM_FILE}" | grep -qi "spdx" && SBOM_TYPE="spdxjson"
          cosign attest --key "${COSIGN_KEY}" --type "${SBOM_TYPE}" \
            --predicate "${SBOM_FILE}" --yes ${TLOG_FLAG} "${IMAGE_DIGEST}"
          echo "SBOM attestation attached (${SBOM_TYPE})"
        else
          echo "WARN: No SBOM file at ${SBOM_FILE} — skipping SBOM attestation"
        fi
      else
        echo "SKIP: SBOM attestation disabled"
      fi
    # Attest SLSA provenance
    - |
      if [ "${COSIGN_ATTEST_SLSA}" = "true" ]; then
        cosign attest --key "${COSIGN_KEY}" --type slsaprovenance \
          --predicate provenance.slsa.json --yes ${TLOG_FLAG} "${IMAGE_DIGEST}"
        echo "SLSA provenance attestation attached"
      else
        echo "SKIP: SLSA provenance attestation disabled"
      fi
    # Attest vulnerability scan results
    - |
      if [ "${COSIGN_ATTEST_VULN}" = "true" ]; then
        if [ -f "${VULN_FILE}" ]; then
          cosign attest --key "${COSIGN_KEY}" --type vuln \
            --predicate "${VULN_FILE}" --yes ${TLOG_FLAG} "${IMAGE_DIGEST}"
          echo "Vulnerability attestation attached"
        else
          echo "WARN: No vuln file at ${VULN_FILE} — skipping vuln attestation"
        fi
      else
        echo "SKIP: Vulnerability attestation disabled"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

cosign-sign:
  extends: .cosign-sign
  needs:
    - job: trivy-image
      artifacts: true
    - job: syft-sbom
      artifacts: true
      optional: true
