# Reusable gitleaks secret scanning template
# Usage in consumer repos:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/gitleaks.yml'
#       ref: main

.gitleaks:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact --report-format sarif --report-path gitleaks-report.sarif
  artifacts:
    reports:
      sast: gitleaks-report.sarif
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

gitleaks:
  extends: .gitleaks
