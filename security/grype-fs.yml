# Reusable Grype filesystem scan template (SCA vulnerability scanner)
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/grype-fs.yml'
#       ref: main
#
# Scans source code BEFORE building for vulnerable dependencies in lockfiles.
# Grype is from the Anchore ecosystem (same as Syft) and pairs well with
# Syft-generated SBOMs for container image scanning (see grype-image.yml).
#
# Drop-in replacement for trivy-fs.yml — same stage, same artifact paths,
# same toggle variables where possible. Switch by changing the include path.
#
# Gate mode: GRYPE_EXIT_CODE defaults to "1" — pipeline FAILS on vulnerabilities
# matching GRYPE_SEVERITY. Set to "0" for advisory mode (report only, don't fail).
#
# Toggle variables:
#   GRYPE_VERSION:        Grype image tag (default: v0.118.0, pinned)
#   GRYPE_SEVERITY:       Minimum severity to gate on (default: high)
#                         Grype uses: negligible, low, medium, high, critical
#   GRYPE_EXIT_CODE:      "1" = fail pipeline, "0" = advisory only
#   GRYPE_ONLY_FIXED:     "true" = ignore CVEs with no fix available (default: true)
#   GRYPE_EXTRA_ARGS:     Additional grype arguments

.grype-fs:
  stage: verify
  image:
    # The -debug variant includes /busybox/sh — the default anchore/grype image
    # is built FROM scratch (no shell) and GitLab Runner cannot execute scripts.
    name: anchore/grype:${GRYPE_VERSION}-debug
    entrypoint: [""]
  variables:
    GRYPE_VERSION: "v0.118.0"
    GRYPE_SEVERITY: "high"
    GRYPE_EXIT_CODE: "1"
    GRYPE_ONLY_FIXED: "true"
    GRYPE_EXTRA_ARGS: ""
  script:
    - |
      echo "=== Grype Filesystem Scan (SCA) ==="
      echo "Severity gate: ${GRYPE_SEVERITY}"
      echo "Exit code: ${GRYPE_EXIT_CODE} (1=fail, 0=advisory)"
      echo "Only fixed: ${GRYPE_ONLY_FIXED}"
    - |
      FIXED_FLAG=""
      if [ "${GRYPE_ONLY_FIXED}" = "true" ]; then
        FIXED_FLAG="--only-fixed"
      fi
    # Hydrate the vulnerability DB first. A client too old for the current DB
    # schema fails here instead of writing an empty report the gate reads as clean.
    - |
      if ! /grype db update; then
        echo "ERROR: grype db update failed - no vulnerability database, refusing to scan"
        exit 2
      fi
    # JSON report (for downstream processing / D-Track upload)
    - >
      /grype dir:.
      --output json
      --file grype-fs.json
      ${FIXED_FLAG}
      ${GRYPE_EXTRA_ARGS}
    - |
      if [ ! -s grype-fs.json ]; then
        echo "ERROR: grype wrote an empty report - scanner failure, not a clean scan"
        exit 2
      fi
    # SARIF report (for GitLab security dashboard)
    - >
      /grype dir:.
      --output sarif
      --file grype-fs.sarif
      ${FIXED_FLAG}
      ${GRYPE_EXTRA_ARGS}
    # Human-readable table + gate (exit code controls pass/fail)
    - >
      /grype dir:.
      --output table
      --fail-on "${GRYPE_SEVERITY}"
      ${FIXED_FLAG}
      ${GRYPE_EXTRA_ARGS}
      ; SCAN_EXIT=$?
    - |
      if [ "${GRYPE_EXIT_CODE}" = "0" ]; then
        echo "Advisory mode — vulnerabilities reported but not gating"
        exit 0
      fi
      exit ${SCAN_EXIT}
  artifacts:
    reports:
      sast: grype-fs.sarif
    paths:
      - grype-fs.sarif
      - grype-fs.json
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

grype-fs:
  extends: .grype-fs
