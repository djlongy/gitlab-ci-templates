# Reusable Grype container image scan template (GATE MODE)
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/grype-image.yml'
#       ref: main
#   variables:
#     GRYPE_IMAGE: "registry.example.com/myteam/myapp:${CI_COMMIT_SHORT_SHA}"
#
# Drop-in replacement for trivy-image.yml — same stage, same artifact paths,
# same toggle variables where possible. Switch by changing the include path.
#
# Pairs with syft-sbom.yml: if a Syft SBOM artifact (sbom.cdx.json) exists
# from an earlier stage, Grype scans that instead of pulling the image again.
# This is faster and avoids redundant image pulls.
#
# Gate mode: GRYPE_EXIT_CODE defaults to "1" — pipeline FAILS on vulnerabilities
# matching GRYPE_SEVERITY. Set to "0" for advisory mode (report only, don't fail).
#
# Toggle variables:
#   GRYPE_VERSION:        Grype image tag (default: v0.118.0, pinned)
#   GRYPE_IMAGE:          Container image reference to scan
#   GRYPE_SEVERITY:       Minimum severity to gate on (default: high)
#                         Grype uses: negligible, low, medium, high, critical
#   GRYPE_EXIT_CODE:      "1" = fail pipeline, "0" = advisory only
#   GRYPE_ONLY_FIXED:     "true" = ignore CVEs with no fix available (default: true)
#   GRYPE_EXTRA_ARGS:     Additional grype arguments
#   SBOM_ENABLED:         "true" to generate SBOM via Grype (default: false)
#                         Set to false if using syft-sbom.yml in an earlier stage.
#   SBOM_FORMAT:          "cyclonedx-json" or "spdx-json" (default: cyclonedx-json)

.grype-image:
  stage: scan
  image:
    # The -debug variant includes /busybox/sh — the default anchore/grype image
    # is built FROM scratch (no shell) and GitLab Runner cannot execute scripts.
    name: anchore/grype:${GRYPE_VERSION}-debug
    entrypoint: [""]
  variables:
    GRYPE_VERSION: "v0.118.0"
    GRYPE_IMAGE: ""
    GRYPE_SEVERITY: "high"
    GRYPE_EXIT_CODE: "1"
    GRYPE_ONLY_FIXED: "true"
    GRYPE_EXTRA_ARGS: ""
    SBOM_ENABLED: "false"
    SBOM_FORMAT: "cyclonedx-json"
  script:
    - |
      # Auto-construct GRYPE_IMAGE from dotenv if not explicitly set
      if [ -z "${GRYPE_IMAGE}" ] && [ -n "${IMAGE_NAME}" ] && [ -n "${BUILDKIT_TAG}" ]; then
        export GRYPE_IMAGE="${IMAGE_NAME}:${BUILDKIT_TAG}"
        echo "Auto-detected: GRYPE_IMAGE=${GRYPE_IMAGE}"
      fi
      if [ -z "${GRYPE_IMAGE}" ]; then
        echo "ERROR: GRYPE_IMAGE variable must be set"
        exit 1
      fi
    - |
      echo "=== Grype Image Scan (Gate Mode) ==="
      echo "Image: ${GRYPE_IMAGE}"
      echo "Severity gate: ${GRYPE_SEVERITY}"
      echo "Exit code: ${GRYPE_EXIT_CODE} (1=fail, 0=advisory)"
      echo "Only fixed: ${GRYPE_ONLY_FIXED}"
    # Determine scan target — prefer Syft SBOM if available from earlier stage
    - |
      SCAN_TARGET="${GRYPE_IMAGE}"
      if [ -f "sbom.cdx.json" ]; then
        SCAN_TARGET="sbom:sbom.cdx.json"
        echo "Using Syft SBOM from earlier stage (faster, no image pull)"
      elif [ -f "sbom.spdx.json" ]; then
        SCAN_TARGET="sbom:sbom.spdx.json"
        echo "Using Syft SBOM from earlier stage (faster, no image pull)"
      fi
    - |
      FIXED_FLAG=""
      if [ "${GRYPE_ONLY_FIXED}" = "true" ]; then
        FIXED_FLAG="--only-fixed"
      fi
    # Configure registry auth for remote image scanning
    - |
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        REGISTRY=$(echo "${GRYPE_IMAGE}" | cut -d/ -f1)
        export GRYPE_REGISTRY_AUTH_AUTHORITY="${REGISTRY}"
        export GRYPE_REGISTRY_AUTH_USERNAME="${REGISTRY_USER}"
        export GRYPE_REGISTRY_AUTH_PASSWORD="${REGISTRY_PASSWORD}"
        echo "Registry auth configured for ${REGISTRY}"
      fi
    # Hydrate the vulnerability DB first. A client too old for the current DB
    # schema fails here instead of writing an empty report the gate reads as clean.
    - |
      if ! /grype db update; then
        echo "ERROR: grype db update failed - no vulnerability database, refusing to scan"
        exit 2
      fi
    # Generate SBOM if enabled (skip if Syft already produced one)
    - |
      if [ "${SBOM_ENABLED}" = "true" ] && [ ! -f "sbom.cdx.json" ] && [ ! -f "sbom.spdx.json" ]; then
        echo "Generating SBOM via Grype (consider syft-sbom.yml for better results)"
        /grype "${GRYPE_IMAGE}" --output "${SBOM_FORMAT}" --file sbom.cdx.json ${FIXED_FLAG} || true
      fi
    # JSON report (for downstream processing / D-Track upload)
    - >
      /grype ${SCAN_TARGET}
      --output json
      --file grype-report.json
      ${FIXED_FLAG}
      ${GRYPE_EXTRA_ARGS}
    - |
      if [ ! -s grype-report.json ]; then
        echo "ERROR: grype wrote an empty report - scanner failure, not a clean scan"
        exit 2
      fi
    # SARIF report (for GitLab security dashboard)
    - >
      /grype ${SCAN_TARGET}
      --output sarif
      --file grype-report.sarif
      ${FIXED_FLAG}
      ${GRYPE_EXTRA_ARGS}
    # Human-readable table + gate
    - >
      /grype ${SCAN_TARGET}
      --output table
      --fail-on "${GRYPE_SEVERITY}"
      ${FIXED_FLAG}
      ${GRYPE_EXTRA_ARGS}
      ; SCAN_EXIT=$?
    - |
      if [ "${GRYPE_EXIT_CODE}" = "0" ]; then
        echo "Advisory mode — vulnerabilities reported but not gating"
        exit 0
      fi
      exit ${SCAN_EXIT}
  artifacts:
    reports:
      sast: grype-report.sarif
    paths:
      - sbom.cdx.json
      - sbom.spdx.json
      - grype-report.sarif
      - grype-report.json
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

grype-image:
  extends: .grype-image
