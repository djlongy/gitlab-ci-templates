# Reusable lockfile enforcement template
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/lockfile-check.yml'
#       ref: main

.lockfile-check:
  stage: verify
  image:
    name: alpine:3.20
    entrypoint: [""]
  script:
    - |
      FAILED=0
      echo "=== Lockfile Enforcement Check ==="

      # Python (Poetry or pip)
      if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.in" ]; then
        echo "[Python] Project detected"
        if [ -f "poetry.lock" ]; then
          echo "  OK: poetry.lock found"
        elif [ -f "requirements.txt" ]; then
          if grep -q "==" requirements.txt; then
            echo "  OK: requirements.txt found with pinned versions"
          else
            echo "  FAIL: requirements.txt exists but versions are not pinned"
            FAILED=1
          fi
        else
          echo "  FAIL: No poetry.lock or requirements.txt found"
          FAILED=1
        fi
      fi

      # Node.js (npm or pnpm)
      if [ -f "package.json" ]; then
        echo "[Node] Project detected"
        if [ -f "pnpm-lock.yaml" ]; then
          echo "  OK: pnpm-lock.yaml found"
        elif [ -f "package-lock.json" ]; then
          echo "  OK: package-lock.json found"
        elif [ -f "yarn.lock" ]; then
          echo "  OK: yarn.lock found"
        else
          echo "  FAIL: No lockfile found (expected pnpm-lock.yaml, package-lock.json, or yarn.lock)"
          FAILED=1
        fi
      fi

      # Go
      if [ -f "go.mod" ]; then
        echo "[Go] Project detected"
        if [ -f "go.sum" ]; then
          echo "  OK: go.sum found"
        else
          echo "  FAIL: go.mod found but go.sum missing"
          FAILED=1
        fi
      fi

      # Java (Gradle)
      if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
        echo "[Java/Gradle] Project detected"
        if [ -f "gradle.lockfile" ] || find . -name "*.lockfile" -path "*/gradle/*" | head -1 | grep -q .; then
          echo "  OK: Gradle lockfile found"
        else
          echo "  WARN: No gradle.lockfile found (recommended but not required)"
        fi
      fi

      # Helm
      if [ -f "Chart.yaml" ]; then
        echo "[Helm] Chart detected"
        if [ -f "Chart.lock" ]; then
          echo "  OK: Chart.lock found"
        elif grep -q "dependencies:" Chart.yaml 2>/dev/null; then
          echo "  FAIL: Chart has dependencies but Chart.lock missing"
          FAILED=1
        fi
      fi

      if [ "${FAILED}" -eq 1 ]; then
        echo ""
        echo "FAILED: One or more lockfiles missing. Pin your dependencies."
        exit 1
      fi
      echo ""
      echo "All lockfile checks passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: false

lockfile-check:
  extends: .lockfile-check
