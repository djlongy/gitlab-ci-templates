# Reusable Semgrep SAST template
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/semgrep.yml'
#       ref: main

.semgrep:
  stage: verify
  image:
    name: semgrep/semgrep:${SEMGREP_VERSION}
    entrypoint: [""]
  variables:
    SEMGREP_VERSION: "1.79.0"
    SEMGREP_RULES: "p/default"
  script:
    - semgrep scan --config "${SEMGREP_RULES}" --sarif -o semgrep.sarif . || true
    - semgrep scan --config "${SEMGREP_RULES}" --json -o semgrep.json . || true
    - |
      if [ -f semgrep.json ]; then
        python3 -c "
      import json, sys
      data = json.load(open('semgrep.json'))
      results = data.get('results', [])
      cc = []
      for r in results:
        severity_map = {'ERROR': 'critical', 'WARNING': 'major', 'INFO': 'minor'}
        cc.append({
          'type': 'issue',
          'check_name': r.get('check_id', 'unknown'),
          'description': r.get('extra', {}).get('message', ''),
          'categories': ['Security'],
          'severity': severity_map.get(r.get('extra', {}).get('severity', 'INFO'), 'info'),
          'location': {
            'path': r.get('path', ''),
            'lines': {'begin': r.get('start', {}).get('line', 0)}
          },
          'fingerprint': r.get('extra', {}).get('fingerprint', '')
        })
      json.dump(cc, open('semgrep-codeclimate.json', 'w'), indent=2)
      print(f'Converted {len(cc)} findings to CodeClimate format')
      "
      fi
  artifacts:
    reports:
      sast: semgrep.sarif
      codequality: semgrep-codeclimate.json
    paths:
      - semgrep.sarif
      - semgrep.json
      - semgrep-codeclimate.json
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

semgrep:
  extends: .semgrep
