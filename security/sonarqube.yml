# Reusable SonarQube code analysis template
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/sonarqube.yml'
#       ref: main
#
# Required CI/CD variables (set at group or project level):
#   SONAR_HOST_URL  — SonarQube server URL (e.g. https://sonarqube.example.com)
#   SONAR_TOKEN     — SonarQube analysis token (masked)
#
# Optional variables:
#   SONAR_PROJECT_KEY    — override auto-derived project key
#   SONAR_EXTRA_ARGS     — additional sonar-scanner arguments
#   SONAR_EXCLUSIONS     — comma-separated glob patterns to exclude
#   SONAR_SOURCES        — source directories (default: .)
#   SONAR_SARIF_PATHS    — comma-separated SARIF files to import
#                          (default: auto-discover every *.sarif in the workspace)
#   SONAR_QUALITYGATE_WAIT — "true" makes the job block on the quality gate result
#
# SARIF ingestion (why this job has `needs:`)
# -------------------------------------------
# Community Build has no security dashboard of its own, but its scanner imports
# SARIF from any tool via `sonar.sarifReportPaths`. semgrep.yml and trivy-fs.yml
# already write SARIF, so this job pulls their artifacts in and the findings
# become first-class SonarQube issues: rule `external_<tool>:<rule-id>`, counted
# in the `vulnerabilities` measure and the security rating, shown on the project
# Activity graph, and able to fail a quality gate. Verified against Community
# Build 26.4 on 2026/09/09.
#
# `optional: true` keeps this working in repos that include sonarqube.yml alone
# with no semgrep/trivy job to depend on.
#
# WARNING: a consumer that sets its own `needs:` on the sonarqube job REPLACES
# this list — GitLab does not merge them — and so silently stops importing
# SARIF. If you override `needs:` to pull in a coverage artifact, re-add the
# two scanner jobs alongside it.
#
# gitleaks is deliberately NOT imported: it runs in the later `secret-scan`
# stage so its artifact is not available here, and SonarQube's bundled `text`
# plugin already reports hardcoded secrets. A leaked credential should fail the
# gitleaks job outright, not land on a dashboard.
#
# SARIF results are dropped silently if their file is outside `sonar.sources`,
# so keep SONAR_SOURCES wide enough to cover everything the scanners look at.

.sonarqube:
  stage: verify
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  needs:
    - job: semgrep
      artifacts: true
      optional: true
    - job: trivy-fs
      artifacts: true
      optional: true
  variables:
    SONAR_PROJECT_KEY: ""
    SONAR_EXTRA_ARGS: ""
    SONAR_EXCLUSIONS: ""
    SONAR_SOURCES: "."
    SONAR_SARIF_PATHS: ""
    SONAR_QUALITYGATE_WAIT: "false"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-${CI_PROJECT_ID}
    paths:
      - .sonar/cache
  script:
    - |
      # Derive project key from CI variables if not explicitly set
      if [ -z "${SONAR_PROJECT_KEY}" ]; then
        SONAR_PROJECT_KEY="${CI_PROJECT_NAMESPACE}:${CI_PROJECT_NAME}"
      fi
    - |
      # Collect the SARIF reports left behind by the upstream scanners, and warn
      # about findings SonarQube will drop. Written in python3 (present in the
      # scanner image; `find` and `jq` are NOT — don't reintroduce them).
      SARIF_LIST=$(python3 - "${SONAR_SARIF_PATHS}" <<'PY'
      import glob, json, os, sys

      wanted = [p for p in sys.argv[1].split(",") if p]
      if wanted:
          files = [p for p in wanted if os.path.isfile(p)]
      else:
          files = sorted(set(glob.glob("*.sarif") + glob.glob("*/*.sarif")))
      files = [p for p in files if not p.startswith(".sonar/")]

      keep, dropped = [], 0
      for path in files:
          try:
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
          except (OSError, ValueError) as exc:
              print(f"WARNING: {path} is not readable SARIF ({exc}) — skipping.",
                    file=sys.stderr)
              continue
          total = bad = 0
          for run in doc.get("runs", []):
              for res in run.get("results", []):
                  for loc in res.get("locations", []):
                      uri = (loc.get("physicalLocation", {})
                                .get("artifactLocation", {}).get("uri", ""))
                      total += 1
                      # SonarQube's SARIF importer cannot resolve a path
                      # containing a space: raw spaces are dropped outright and
                      # %20 lands the issue on the project root with no file or
                      # line. Verified on Community Build 26.4, 2026/09/09.
                      if " " in uri or "%20" in uri:
                          bad += 1
                          if bad <= 5:
                              print(f"WARNING:   unimportable path: {uri}",
                                    file=sys.stderr)
                      break
          keep.append(path)
          dropped += bad
          note = f" ({bad} will be dropped: space in path)" if bad else ""
          print(f"SARIF {path}: {total} finding(s){note}", file=sys.stderr)
      if dropped:
          print(f"WARNING: {dropped} finding(s) will NOT reach SonarQube. "
                "Rename the offending directories to remove spaces.",
                file=sys.stderr)
      print(",".join(keep), end="")
      PY
      )
      if [ -n "${SARIF_LIST}" ]; then
        echo "Importing SARIF reports: ${SARIF_LIST}"
      else
        echo "No SARIF reports found — running SonarQube's own analysis only."
        echo "  If this pipeline runs semgrep or trivy-fs, check whether this"
        echo "  repo overrides the sonarqube job's needs: — that replaces the"
        echo "  template's list and drops the scanner artifacts."
      fi
    - |
      # Build scanner arguments
      SCANNER_ARGS="-Dsonar.projectKey=${SONAR_PROJECT_KEY}"
      SCANNER_ARGS="${SCANNER_ARGS} -Dsonar.projectName=${CI_PROJECT_NAME}"
      SCANNER_ARGS="${SCANNER_ARGS} -Dsonar.sources=${SONAR_SOURCES}"

      if [ -n "${SONAR_EXCLUSIONS}" ]; then
        SCANNER_ARGS="${SCANNER_ARGS} -Dsonar.exclusions=${SONAR_EXCLUSIONS}"
      fi

      if [ -n "${SARIF_LIST}" ]; then
        SCANNER_ARGS="${SCANNER_ARGS} -Dsonar.sarifReportPaths=${SARIF_LIST}"
      fi

      if [ "${SONAR_QUALITYGATE_WAIT}" = "true" ]; then
        SCANNER_ARGS="${SCANNER_ARGS} -Dsonar.qualitygate.wait=true"
      fi

      # Branch/MR analysis requires Developer Edition or above.
      # Community Build only supports mainline analysis — skip branch parameters.

      # Run the scan
      echo "Running SonarQube analysis for project: ${SONAR_PROJECT_KEY}"
      sonar-scanner ${SCANNER_ARGS} ${SONAR_EXTRA_ARGS}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

sonarqube:
  extends: .sonarqube
