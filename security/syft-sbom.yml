# Reusable Syft SBOM generation template (specialist SBOM generator)
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/syft-sbom.yml'
#       ref: main
#   variables:
#     SYFT_IMAGE: "registry.example.com/myteam/myapp:${CI_COMMIT_SHORT_SHA}"
#
# Why Syft over Trivy for SBOM:
#   - Purpose-built for SBOM generation (not a scanner with SBOM bolted on)
#   - Deeper transitive/vendored dependency detection (Go vendor/, shaded JARs)
#   - More accurate package cataloging across ecosystems
#   - Trivy remains the scanner for CVEs, misconfigs, and secrets (trivy-image.yml)
#
# Toggle variables:
#   SYFT_VERSION:   Syft image tag (default: v1.20.0, pinned)
#   SYFT_IMAGE:     Image reference to generate SBOM for
#   SBOM_FORMAT:    "cyclonedx-json" or "spdx-json" (default: cyclonedx-json)
#   SBOM_FILE:      Output filename (default: sbom.cdx.json)

.syft-sbom:
  stage: scan
  image:
    # The -debug variant includes /busybox/sh — the default anchore/syft image
    # is built FROM scratch (no shell) and GitLab Runner cannot execute scripts.
    name: anchore/syft:${SYFT_VERSION}-debug
    entrypoint: [""]
  variables:
    SYFT_VERSION: "v1.20.0"
    SYFT_IMAGE: ""
    SBOM_FORMAT: "cyclonedx-json"
    SBOM_FILE: "sbom.cdx.json"
  script:
    - |
      # Binary is at /syft (distroless image, not in $PATH)
      if [ -z "${SYFT_IMAGE}" ]; then
        echo "ERROR: SYFT_IMAGE variable must be set"
        exit 1
      fi
      echo "=== Syft SBOM Generation ==="
      echo "Image: ${SYFT_IMAGE}"
      echo "Format: ${SBOM_FORMAT}"
      echo "Output: ${SBOM_FILE}"
    # Configure registry auth for private image scanning
    - |
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        REGISTRY=$(echo "${SYFT_IMAGE}" | cut -d/ -f1)
        export SYFT_REGISTRY_AUTH_AUTHORITY="${REGISTRY}"
        export SYFT_REGISTRY_AUTH_USERNAME="${REGISTRY_USER}"
        export SYFT_REGISTRY_AUTH_PASSWORD="${REGISTRY_PASSWORD}"
        echo "Registry auth configured for ${REGISTRY}"
      fi
    - /syft "${SYFT_IMAGE}" -o "${SBOM_FORMAT}=${SBOM_FILE}"
    - |
      COMPONENT_COUNT=$(cat "${SBOM_FILE}" | /busybox/grep -c '"name"' || echo "0")
      echo "SBOM generated: ${SBOM_FILE} (${COMPONENT_COUNT} components detected)"
  artifacts:
    paths:
      - "${SBOM_FILE}"
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  allow_failure: false

syft-sbom:
  extends: .syft-sbom
