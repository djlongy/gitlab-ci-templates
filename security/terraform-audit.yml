# Scheduled Terraform security audit
# Clones a list of Terraform repos from the same namespace and scans them for
# committed secrets. Configure as a scheduled pipeline or trigger manually.
#
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/security/terraform-audit.yml'
#       ref: main
#
# The consuming pipeline must define an `audit` stage.
#
# Toggle variables:
#   TERRAFORM_REPOS:  Space-separated repo names in ${CI_PROJECT_NAMESPACE}
#   GITLEAKS_VERSION: gitleaks image tag (default: v8.21.2, pinned)
#   RUNNER_TAG:       runner tag these jobs ask for (default: docker)

.terraform-audit-base:
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash git jq curl
  variables:
    RUNNER_TAG: "docker"
  tags:
    - ${RUNNER_TAG}

clone-terraform-repos:
  extends: .terraform-audit-base
  stage: audit
  variables:
    GIT_STRATEGY: none
    TERRAFORM_REPOS: ""
  script:
    - |
      if [ -z "${TERRAFORM_REPOS}" ]; then
        echo "ERROR: TERRAFORM_REPOS must list the repo names to audit"
        exit 1
      fi
    - mkdir -p repos
    - |
      for repo in ${TERRAFORM_REPOS}; do
        echo "Cloning ${repo}..."
        CLONE_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/${repo}.git"
        if git clone --depth 1 "$CLONE_URL" "repos/${repo}" 2>/dev/null; then
          echo "  OK"
        else
          echo "  WARN: Could not clone ${repo}"
        fi
      done
  artifacts:
    paths:
      - repos/
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

terraform-secret-audit:
  stage: audit
  image:
    name: zricethezav/gitleaks:${GITLEAKS_VERSION}
    entrypoint: [""]
  variables:
    GITLEAKS_VERSION: "v8.21.2"
    GIT_STRATEGY: none
  needs: [clone-terraform-repos]
  script:
    - gitleaks detect --no-git --source repos --verbose --redact --report-format sarif --report-path terraform-audit.sarif
  artifacts:
    reports:
      sast: terraform-audit.sarif
    when: always
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
