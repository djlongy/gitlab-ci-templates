---
# Machine-readable half of the component contract (section 6.1). The input
# surface is declared in template.yml and read from there by the catalogue
# generator, so it is not restated here.
name: container-build-buildkit
kind: component
status: released
introduced_in: 1.0.0
minimum_gitlab: '18.9'
# Retry policy: the `max-retries` input (0, 1 or 2, default 1) sets `retry: max`,
# and `retry: when` is `runner_system_failure` and nothing else. A job killed by
# its runner runs again; a failed gate never does.
# Resource group: the `resource-group` input sets `resource_group` on the job.
# Empty is the default and adds no group; a set value serialises this job across
# every pipeline in the project, because a resource group is project-scoped.
# Build secrets: the `build-secrets` input takes NAME=VARIABLE pairs and emits
# `--secret id=NAME,src=<path>`, resolving VARIABLE with printenv. A secret never
# reaches `--opt build-arg:`, which is recorded in the image history. VARIABLE
# must be a file-type CI variable; an ordinary one holding the secret itself is
# refused, because its value would land in the argv and so in the trace.
# Ordering: the job declares neither `needs:` nor `dependencies:`. One of the
# two files under templates/_needs/ supplies one of them, chosen by mutually
# exclusive rules on the includes. `gate-jobs-set` false with
# `upstream-image-job` empty keeps `dependencies: []` and the stage barrier,
# which is what every consumer gets by default and what the compositions rely
# on. Either input set instead gives `needs:` and no `dependencies:` (section
# 8.5), and a job carrying `needs:` is no longer held by its stage, so
# `gate-jobs` must then name every gate this build must not overtake (section
# 8.8).
# `gate-jobs-set` is a boolean beside the array because an array input cannot be
# tested for emptiness in an include rule: an empty one never matches, and a
# non-empty one is refused with `include:rule if invalid expression syntax`.
# Nothing in the YAML can check one against the other, so the job does it:
# runtime/builder/gate_inputs.sh fails before the build when they disagree, in
# either direction, naming both inputs.
# Upstream image: `upstream-image-job` names an earlier build job, and the job
# reads that job's .ci-artifacts/<instance>/<component>/image.json, derived from
# the name. Naming it creates the `needs:` edge, with `artifacts: true` and
# without `optional: true`, so a parent a rule can filter out of the pipeline
# cannot be used here: the non-optional edge fails pipeline creation for the
# whole pipeline. Linted, never run: no consumer has built a two-image chain.
emitted_jobs:
  - pattern: '{instance}:container-build-buildkit'
    stage: build
    blocking: true
outputs:
  - path: '.ci-artifacts/{instance}/container-build-buildkit/image.json'
    producer: '{instance}:container-build-buildkit'
    format: json
    schema: 'image identity schema 1, section 9.1'
    subject_identity: 'repository@sha256 digest, taken from BuildKit''s exported metadata'
    retention: 1 week
  - path: '.ci-artifacts/{instance}/container-build-buildkit/build.env'
    producer: '{instance}:container-build-buildkit'
    format: dotenv
    schema: 'CI_TPL_IMAGE_REFERENCE and CI_TPL_IMAGE_PUSHED'
    subject_identity: 'same digest as image.json; convenience only, never authoritative'
    retention: 1 week
  - path: '.ci-artifacts/{instance}/container-build-buildkit/metadata.json'
    producer: '{instance}:container-build-buildkit'
    format: json
    schema: 'BuildKit --metadata-file output, kept as the evidence the digest came from'
    retention: 1 week
# The names below are the DEFAULTS of the registry-username-variable and
# registry-password-variable inputs. A consumer that holds its credentials under
# other names passes those names instead; the job resolves whatever it is given
# with printenv and fails naming both variables when either is empty.
required_secrets:
  - name: HARBOR_USER
    kind: ci-variable
    scope: 'push to the candidate registry, default name of registry-username-variable'
    protected_ref_required: false
  - name: HARBOR_PASSWORD
    kind: ci-variable
    scope: 'push to the candidate registry, default name of registry-password-variable'
    protected_ref_required: false
runtime_image:
  reference: 'docker.io/moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3'
  pinning: digest
  tool_versions:
    buildkit: v0.33.0
trust:
  privileged: false
  network_egress:
    - 'the registry host in image-repository: manifest and blob push'
    - 'every registry named in a FROM line of the consumer Dockerfile, and every
       host that Dockerfile fetches from while it builds'
    - 'nothing else: the execution image carries buildctl, the trust anchor
       comes from a CI variable rather than a download, and the credentials come
       from the environment'
  runner_profile: >-
    Docker executor running buildctl-daemonless.sh. The estate's instance
    runners are unprivileged and registered untagged, which is what the current
    template already builds on. A rootless or privileged BuildKit daemon is not
    required and not requested.
  protected_ref_required: false
validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
    - integration-tested
  verified_at: 2026/09/18
  revision: '1.3.0'
  environment: >-
    gitlab.example.com 18.9.1-ee, POST /api/v4/projects/:id/ci/lint.
    Executed on the originating estate, 2026/09: three consumer projects
    built and pushed to a Quay 3.15.7 registry with an internally issued
    certificate, one of them running every job this composition creates on a
    default-branch push, green through to a signature and two attestations
    in the registry. Each was repinned to 1.3.0 and re-run green on that tag.
  notes: >-
    Failure semantics (section 10.1). The job fails when the image repository
    carries a tag or digest, when a tag alias is not a usable tag, when a build
    argument is not NAME=VALUE, when the registry credentials are absent, when
    BuildKit exits non-zero, and when its metadata file carries no manifest
    digest. There is no registry-query fallback and no tag fallback: the
    previous template wrote the tag into a field named digest and exited 0.
    With push-candidate false the job records CI_TPL_IMAGE_PUSHED=false, writes
    no image.json, and every downstream component then fails its own identity
    validation.
    Evidence: the job built a Dockerfile whose base came from a proxy cache
    and pushed the result to a registry whose certificate an internal
    authority issued, with the credentials named through
    registry-username-variable and registry-password-variable and the trust
    anchor through ca-bundle-variable. The trace carries buildctl v0.33.0
    and the digest it recorded in image.json; a second job then read the
    same digest back from the registry with regctl.
    On 1.3.0 the component also ran included on its own, outside any
    composition, as the first brick of kit B: it built and pushed a tagged
    image, and the SBOM and image-scan jobs beside it read that digest out of
    its image.json rather than resolving the tag again.
