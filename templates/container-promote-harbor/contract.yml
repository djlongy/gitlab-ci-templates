---
name: container-promote-harbor
kind: component
status: experimental
introduced_in: 1.0.0
minimum_gitlab: '18.9'
# Retry policy: the `max-retries` input (0, 1 or 2, default 1) sets `retry: max`,
# and `retry: when` is `runner_system_failure` and nothing else. A job killed by
# its runner runs again; a failed gate never does.
emitted_jobs:
  - pattern: '{instance}:container-promote-harbor'
    stage: publish
    blocking: true
outputs:
  - path: .ci-artifacts/{instance}/container-promote-harbor/promotion-result.json
    producer: '{instance}:container-promote-harbor'
    format: JSON
    schema: >-
      schema_version 1; status, registry, repository_path, source_project,
      destination_project, digest, source_reference, destination_reference,
      verified_destination_digest, referrers_copied, referrers_absent,
      tags_applied, source_commit, created_at.
    subject_identity: >-
      repository@sha256 digest, read from the build's image.json and read back
      from the destination project after the copy.
    retention: 1 week
required_secrets:
  - name: HARBOR_USER
    kind: ci-variable
    scope: >-
      Robot account with pull on the candidate project and push on the release
      project. A separate identity from the build credential.
    protected_ref_required: true
  - name: HARBOR_PASSWORD
    kind: ci-variable
    scope: Robot account token for the above.
    protected_ref_required: true
runtime_image:
  reference: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
  pinning: digest
  tool_versions:
    python: '3.12'
# No checkout: this job reads the named producer's artifacts and the APIs it
# calls, so it runs with GIT_STRATEGY none and never clones the consumer
# repository. tests/contracts/test_git_strategy.py holds both halves together.
trust:
  privileged: false
  network_egress:
    - registry.example.com
  runner_profile: >-
    Any unprivileged Docker executor. No image is pulled, built or pushed: the
    registry mounts the existing manifest through its own API.
  protected_ref_required: true
validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
    - runtime-tested
  verified_at: 2026/09/15
  environment: gitlab.example.com 18.9.1-ee, project 18
  notes: >-
    An empty gate-jobs fails the job: nothing in the pipeline checked what is
    about to be published, and that is a release decision rather than a default.
    allow-ungated: true turns the failure into a warning.
    Exactly one of build-job and subject-reference. build-job reads the
    producer's image.json from its artifacts; subject-reference names an image
    this pipeline did not build, and the job then writes the same record into
    its own artefact root. Neither or both fails the job, naming both inputs.
    Failure semantics: an image.json without a digest, a candidate artifact that is not
    there, a destination project equal to the source, a refused copy, a destination
    that cannot be read back or whose digest differs, a missing cosign signature while
    require-signatures is true, or a tag that is not a valid tag name. allow_failure is
    set explicitly to false because GitLab defaults manual jobs to true, which is how
    the predecessor made a failed production publication green. Referrers: cosign
    stores a signature and attestations as the separate tags sha256-<hex>.sig and .att.
    Those are copied explicitly; a digest copy does not carry them. The .att tag is
    copied when present and its absence is recorded, not fatal. Approval is a control
    on the environment, not on this template: the default rules require a protected tag
    and a manual action, and the environment named by the environment input carries the
    protection and approvers. .ci/estate.yml records every environment's protected and
    approvers fields as unresolved, so no approval is proven to exist today.
    gitlab-linted through the CI Lint API; no job ran. runtime-tested: unit tests cover
    every failure path above against a stubbed Harbor API. No artifact has been
    promoted by this component. Status: experimental, because no consumer pipeline has
    run this component on 1.0.0-rc.2. `released` in this repository means a consumer
    job executed green, not that the component looks finished. a consumer is the
    container consumer and its build source is tags-only, so no candidate chain job was
    created at all.
