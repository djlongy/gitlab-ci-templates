---
# Promote one digest from one OCI repository to another, on any registry.
#
# container-promote-harbor speaks the Harbor API, so the estate's promotion step
# is the one place a site cannot swap its registry for a different vendor. This
# component speaks the OCI distribution API through skopeo, which Harbor, Quay
# and Artifactory all implement, so the vendor is two repository names and two
# credential variable names rather than a second component.
#
# What it keeps from container-promote-harbor: the source is a digest, never a
# tag resolved at promotion time; the copy is verified by reading the target
# back rather than by trusting the copy's exit status; and the gates are needs
# entries rather than a stage name.
#
# What it does not do: cosign referrers. Harbor's API copy is told to carry the
# `.sig` and `.att` tags across; skopeo copies one manifest, so a signed release
# promoted here has to sign the target or copy the referrer tags as further
# promotions. `container-sign-attest-cosign` after this job is the shorter path,
# and .agent/PENDING.md carries the item.

#### Public interface ####
spec:
  inputs:
    instance:
      type: string
      description: Unique workload instance used in the job name.
      regex: '^[a-z][a-z0-9-]{0,47}$'
    stage:
      type: string
      description: Stage supplied by the owning composition.
      default: publish
    source-repository:
      type: string
      description: >-
        Repository the digest is read from, as `registry/path`, with no tag and
        no digest. Which digest is the source-digest or source-digest-job input.
      regex: '^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$'
    target-repository:
      type: string
      description: >-
        Repository the digest is copied to, in the same form. It may be on
        another registry, another organisation or the same repository path under
        a different project; the two credential pairs below decide which
        identity each side is contacted with.
      regex: '^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$'
    source-digest:
      type: string
      description: >-
        The digest to promote, stated explicitly. Use this when the artifact was
        built by some earlier pipeline and this one only publishes it. Empty
        selects source-digest-job instead, and setting neither is an error.
      regex: '^$|^sha256:[0-9a-f]{64}$'
      default: ''
    source-digest-job:
      type: array
      description: >-
        The build job whose image.json states the digest to promote, as zero or
        one job name. An array because GitLab has no conditional needs: the
        empty list is how a pipeline with no build job in it says so, and a name
        here becomes a needs entry that downloads that job's artifacts.
      default: []
    source-digest-component:
      type: string
      description: >-
        Component name the job above writes its artifacts under, which is the
        directory image.json lives in. Ignored when source-digest is set.
      default: container-build-buildkit
    target-tags:
      type: array
      description: >-
        Tags the promoted digest is published under. At least one is required:
        skopeo refuses a digest as a copy destination, and an untagged manifest
        is what a registry's garbage collection is entitled to remove.
      default: ['$CI_COMMIT_TAG']
    source-username-variable:
      type: string
      description: >-
        Name of the CI variable holding the username for the source registry.
        The name, never the value.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'HARBOR_USER'
    source-password-variable:
      type: string
      description: Name of the CI variable holding the source registry password or robot token.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'HARBOR_PASSWORD'
    target-username-variable:
      type: string
      description: >-
        Name of the CI variable holding the username for the target registry.
        The same name as the source when one identity has both ends.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'HARBOR_USER'
    target-password-variable:
      type: string
      description: Name of the CI variable holding the target registry password or robot token.
      regex: '^[A-Z][A-Z0-9_]*$'
      default: 'HARBOR_PASSWORD'
    ca-bundle-variable:
      type: string
      description: >-
        Name of a CI variable holding a PEM bundle to trust before any registry
        call, for a registry whose certificate an internal authority issued. A
        file variable (the value is a path) or an ordinary one (the value is the
        PEM) both work. Empty skips it, and nothing is downloaded either way.
      regex: '^$|^[A-Z][A-Z0-9_]*$'
      default: ''
    execution-image:
      type: string
      description: >-
        Approved execution image pinned by digest. Needs apk and a busybox
        userland; skopeo and ca-certificates are installed from the image's own
        package repositories. No Docker Hub image ships skopeo, which is why
        this is Alpine and not a skopeo image; container-mirror-skopeo resolves
        it the same way.

        A leading `$UPPER_SNAKE/` is accepted, so a site that mirrors these
        images into its own registry names that registry once as a group
        variable and passes `$CI_TPL_MIRROR/library/alpine@sha256:...`
        here. GitLab expands a CI variable in `image:` at job time. The digest
        stays in this value rather than in the variable: what runs is then
        still reviewable in the consumer file.
      default: 'docker.io/alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d'
      regex: '^(\$[A-Z][A-Z0-9_]*/)?[A-Za-z0-9][A-Za-z0-9._/:-]*@sha256:[0-9a-f]{64}$'
    gate-jobs:
      type: array
      description: >-
        Every gate that must pass before the promotion, as needs entries with
        artifacts false. Empty by default because only the composition knows the
        instance job names; a composition that leaves it empty promotes on the
        build alone, which its own review should catch.
      default: []
    runner-tags:
      type: array
      description: Runner selection from the estate profile.
      default: []
    max-retries:
      type: number
      description: >-
        How many times the runner may retry this job. The condition is
        runner_system_failure only, so this retries infrastructure and never a
        failed gate.
      default: 1
      options: [0, 1, 2]
    run-rules:
      type: array
      description: >-
        Job eligibility set by the composition. The default requires a protected
        tag and a manual action: a release publication is never automatic, and
        an unprotected ref cannot reach the target repository.
      default:
        - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
          when: manual
        - when: never
---
#### Executable capability ####
"$[[ inputs.instance ]]:container-promote-skopeo":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.execution-image ]]
    entrypoint: ['']
  tags: $[[ inputs.runner-tags ]]
  # One promotion of one instance into one repository at a time, so two
  # pipelines cannot race the same tag onto two different digests.
  resource_group: '$[[ inputs.instance ]]-$[[ inputs.target-repository ]]'
  variables:
    # Non-root execution images own their build directory: the runner reads the
    # image's uid and gid and chowns it, instead of relying on umask 0000.
    # platform/docs 5794 job 48106 died on .git/objects that a root job
    # wrote in the same concurrency slot.
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 'true'
    # The digest arrives as an input or as an artifact, and the promotion is a
    # registry-to-registry copy, so this job never reads the checkout.
    GIT_STRATEGY: none
    CI_TPL_WORK: /tmp/ci-tpl
    CI_TPL_ARTIFACT_DIR: '.ci-artifacts/$[[ inputs.instance ]]/container-promote-skopeo'
    CI_TPL_IDENTITY_FILE: '.ci-artifacts/$[[ inputs.instance ]]/$[[ inputs.source-digest-component ]]/image.json'
    CI_TPL_SOURCE_REPOSITORY: '$[[ inputs.source-repository ]]'
    CI_TPL_TARGET_REPOSITORY: '$[[ inputs.target-repository ]]'
    CI_TPL_SOURCE_DIGEST: '$[[ inputs.source-digest ]]'
    # The 'json' prefix is what makes GitLab render this array as a JSON array
    # literal. A placeholder alone in a variable value substitutes the array
    # itself, and a CI variable cannot hold a list. ci_tpl_json_list reads the
    # quoted values and ignores the prefix.
    CI_TPL_TARGET_TAGS: 'json $[[ inputs.target-tags ]]'
    # Credential variable NAMES, never values. The runtime resolves them with
    # printenv, so a consumer names the variables it already has instead of
    # adopting the two this library used to read, and the two ends can be different identities.
    CI_TPL_SOURCE_USERNAME_VARIABLE: '$[[ inputs.source-username-variable ]]'
    CI_TPL_SOURCE_PASSWORD_VARIABLE: '$[[ inputs.source-password-variable ]]'
    CI_TPL_TARGET_USERNAME_VARIABLE: '$[[ inputs.target-username-variable ]]'
    CI_TPL_TARGET_PASSWORD_VARIABLE: '$[[ inputs.target-password-variable ]]'
    CI_TPL_CA_BUNDLE_VARIABLE: '$[[ inputs.ca-bundle-variable ]]'
  needs:
    - $[[ inputs.source-digest-job ]]
    - $[[ inputs.gate-jobs ]]
  before_script:
    - |
      set -eu
      mkdir -p "$CI_TPL_WORK"
      chmod 700 "$CI_TPL_WORK"
      apk add --no-cache skopeo ca-certificates >/dev/null
    - |
      # BEGIN embed inline runtime/registry/image-json.sh
      #!/bin/sh
      # Image identity helpers for the container build and container test components.
      #
      # Section 9.1 of docs/gitlab-ci-agent-standard.md makes image.json the
      # authoritative identity record for a built image, and section 10.1 makes a
      # missing or unverifiable identity a job failure rather than a warning. Every
      # function here fails loudly; none of them falls back to a tag.
      #
      # POSIX sh with awk only. The builder images are busybox userlands with no jq
      # and no python3, so the JSON handling below is deliberately small.
      #
      # This file is embedded verbatim into each component's before_script, because a
      # component include imports YAML and never checks out this repository (section
      # 12). tests/runtime/registry/test_embedded_helper.py fails when a copy drifts.

      CI_TPL_DIGEST_PATTERN='^sha256:[0-9a-f]\{64\}$'

      # Print the string value of the first "<key>": "<value>" pair in a JSON file.
      # Key matching is literal, so a key containing dots (BuildKit writes
      # "containerimage.digest") needs no escaping. Values carrying escaped quotes are
      # out of scope: every field read here is a digest, a reference or a media type.
      ci_tpl_json_string() {
          awk -v key="$2" '
              { blob = blob $0 }
              END {
                  needle = "\"" key "\""
                  p = index(blob, needle)
                  if (p == 0) exit 1
                  rest = substr(blob, p + length(needle))
                  c = index(rest, ":")
                  if (c == 0) exit 1
                  rest = substr(rest, c + 1)
                  q = index(rest, "\"")
                  if (q == 0) exit 1
                  rest = substr(rest, q + 1)
                  e = index(rest, "\"")
                  if (e == 0) exit 1
                  printf "%s", substr(rest, 1, e - 1)
              }
          ' "$1"
      }

      # GitLab renders an array input used in a string context as a JSON array
      # literal. Split one into a value per line so the job can quote each item as a
      # single argument. No eval: the values are consumer data.
      ci_tpl_json_list() {
          printf '%s' "$1" | awk '
              { blob = blob $0 }
              END {
                  n = length(blob)
                  inside = 0
                  item = ""
                  for (i = 1; i <= n; i++) {
                      c = substr(blob, i, 1)
                      if (inside) {
                          if (c == "\\") { i++; item = item substr(blob, i, 1); continue }
                          if (c == "\"") { print item; item = ""; inside = 0; continue }
                          item = item c
                      } else if (c == "\"") {
                          inside = 1
                      }
                  }
              }
          '
      }

      ci_tpl_fail() {
          echo "ERROR: $*" >&2
          return 1
      }

      # A digest is sha256 followed by 64 hex characters. Anything else -- a tag, an
      # empty string, a truncated digest -- is refused here rather than written into a
      # field named digest.
      ci_tpl_require_digest() {
          case "$1" in
              '') ci_tpl_fail "no image digest was produced; refusing to continue without one" ;;
              *)
                  if expr "$1" : "$CI_TPL_DIGEST_PATTERN" >/dev/null; then
                      return 0
                  fi
                  ci_tpl_fail "'$1' is not a sha256 digest; a tag is not an identity"
                  ;;
          esac
      }

      # A repository is registry[:port]/path with no tag and no digest attached.
      ci_tpl_require_repository() {
          case "$1" in
              '') ci_tpl_fail "image-repository is empty" ;;
              *@*) ci_tpl_fail "image-repository '$1' carries a digest; pass the repository alone" ;;
              */*) ;;
              *) ci_tpl_fail "image-repository '$1' has no registry host" ;;
          esac || return 1
          # A colon is only legitimate in the registry host, as a port.
          case "${1#*/}" in
              *:*) ci_tpl_fail "image-repository '$1' carries a tag; pass the repository alone" ;;
              *) return 0 ;;
          esac
      }

      # A comma-separated platform list of more than one entry is pushed as an index.
      ci_tpl_subject_kind_from_platforms() {
          case "$1" in
              *,*) echo index ;;
              *) echo manifest ;;
          esac
      }

      # BuildKit records the pushed descriptor's media type. That is the authoritative
      # answer to index-versus-manifest; the platform list is only the request.
      ci_tpl_subject_kind_from_metadata() {
          media_type=$(ci_tpl_json_string "$1" mediaType 2>/dev/null) || media_type=''
          case "$media_type" in
              *index*|*manifest.list*) echo index ;;
              '') ci_tpl_subject_kind_from_platforms "$2" ;;
              *) echo manifest ;;
          esac
      }

      # BuildKit writes both the exported image digest and the image config digest.
      # containerimage.digest is the manifest digest cosign and every scanner need;
      # containerimage.config.digest is not. Read the right one, or fail.
      ci_tpl_buildkit_digest() {
          digest=$(ci_tpl_json_string "$1" containerimage.digest 2>/dev/null) || digest=''
          ci_tpl_require_digest "$digest" || return 1
          echo "$digest"
      }

      # ko --image-refs writes one fully qualified repository@digest per built import
      # path. Parse it as a reference, never as "the last line of the build output".
      ci_tpl_reference_digest() {
          case "$1" in
              *@*) digest=${1##*@} ;;
              *) ci_tpl_fail "'$1' is not a repository@digest reference" ; return 1 ;;
          esac
          ci_tpl_require_digest "$digest" || return 1
          echo "$digest"
      }

      ci_tpl_reference_repository() {
          echo "${1%@*}"
      }

      # An OCI tag. The pattern is deliberately narrower than the specification: a
      # tag that still contains a dollar sign means GitLab did not expand the variable
      # it came from, and pushing a literal '$CI_COMMIT_SHORT_SHA' would be worse than
      # failing here.
      ci_tpl_require_tag() {
          expr "$1" : '^[A-Za-z0-9_][A-Za-z0-9._-]\{0,126\}$' >/dev/null && return 0
          ci_tpl_fail "'$1' is not a usable image tag"
      }

      ci_tpl_require_build_arg() {
          expr "$1" : '^[A-Za-z_][A-Za-z0-9_]*=' >/dev/null && return 0
          ci_tpl_fail "'$1' is not a NAME=VALUE build argument"
      }

      # A build secret is NAME=VARIABLE: the id BuildKit exposes the secret under, and
      # the NAME of a file-type CI variable that holds it. The value is never an input
      # and never a build argument: `--opt build-arg:` is recorded in the image
      # history, so a certificate or a token passed that way ships inside the image
      # and stays there. BuildKit mounts a `--secret` for one RUN step and writes it
      # into no layer.
      ci_tpl_require_build_secret() {
          expr "$1" : '^[A-Za-z_][A-Za-z0-9_.-]*=[A-Z][A-Z0-9_]*$' >/dev/null && return 0
          ci_tpl_fail "'$1' is not a NAME=VARIABLE build secret; VARIABLE names a file-type CI variable, never its value"
      }

      # Resolve one NAME=VARIABLE pair into the id=<name>,src=<path> form buildctl
      # takes. printenv, never eval or an indirect expansion: the variable name is
      # consumer input and must not become code. A GitLab file variable's value IS a
      # path, so a value that is not a readable file is refused here; handing it to
      # buildctl would mount the secret's own text as a filename and put it in the
      # trace. Nothing in this function prints the file's contents.
      ci_tpl_build_secret_argument() {
          ci_tpl_require_build_secret "$1" || return 1
          bs_id=${1%%=*}
          bs_var=${1#*=}
          bs_path=$(printenv "$bs_var") || bs_path=''
          if [ -z "$bs_path" ]; then
              ci_tpl_fail "build secret '$1' names \$${bs_var}, which is empty or not defined"
              return 1
          fi
          if [ ! -f "$bs_path" ]; then
              ci_tpl_fail "build secret '$1': \$${bs_var} is not a file-type CI variable, so its value is not a readable path"
              return 1
          fi
          printf 'id=%s,src=%s\n' "$bs_id" "$bs_path"
      }

      ci_tpl_json_array() {
          # Render a comma-separated list as a JSON array of strings.
          echo "$1" | awk -F, '{
              out = ""
              for (i = 1; i <= NF; i++) {
                  if (out != "") out = out ", "
                  out = out "\"" $i "\""
              }
              printf "[%s]", out
          }'
      }

      # Write image.json (schema 1) and the optional build.env convenience dotenv.
      # Arguments: artifact-dir repository digest platforms-csv subject-kind
      ci_tpl_write_image_json() {
          ci_tpl_require_repository "$2" || return 1
          ci_tpl_require_digest "$3" || return 1
          mkdir -p "$1"
          cat > "$1/image.json" <<JSON
      {
        "schema_version": 1,
        "repository": "$2",
        "digest": "$3",
        "reference": "$2@$3",
        "source_commit": "${CI_COMMIT_SHA}",
        "pipeline_id": "${CI_PIPELINE_ID}",
        "job_id": "${CI_JOB_ID}",
        "platforms": $(ci_tpl_json_array "$4"),
        "subject_kind": "$5",
        "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      }
      JSON
          {
              printf 'CI_TPL_IMAGE_REFERENCE=%s@%s\n' "$2" "$3"
              printf 'CI_TPL_IMAGE_PUSHED=true\n'
          } > "$1/build.env"
          ci_tpl_validate_image_json "$1/image.json"
      }

      # A build that did not push has no registry identity, so it writes no image.json
      # at all. Anything downstream then fails its own validation rather than scanning
      # or signing a reference that does not resolve.
      ci_tpl_write_unpushed_env() {
          mkdir -p "$1"
          printf 'CI_TPL_IMAGE_PUSHED=false\n' > "$1/build.env"
      }

      # Producers validate their own output before reporting success (section 9.4).
      # Consumers run the same check on what they downloaded.
      ci_tpl_validate_image_json() {
          file=$1
          [ -f "$file" ] || { ci_tpl_fail "$file does not exist"; return 1; }
          grep -q '"schema_version": 1' "$file" ||
              { ci_tpl_fail "$file is not image.json schema 1"; return 1; }
          repository=$(ci_tpl_json_string "$file" repository 2>/dev/null) || repository=''
          digest=$(ci_tpl_json_string "$file" digest 2>/dev/null) || digest=''
          reference=$(ci_tpl_json_string "$file" reference 2>/dev/null) || reference=''
          commit=$(ci_tpl_json_string "$file" source_commit 2>/dev/null) || commit=''
          pipeline=$(ci_tpl_json_string "$file" pipeline_id 2>/dev/null) || pipeline=''
          job=$(ci_tpl_json_string "$file" job_id 2>/dev/null) || job=''
          platforms=$(ci_tpl_json_string "$file" platforms 2>/dev/null) || platforms=''
          kind=$(ci_tpl_json_string "$file" subject_kind 2>/dev/null) || kind=''
          created=$(ci_tpl_json_string "$file" created_at 2>/dev/null) || created=''
          ci_tpl_require_repository "$repository" || return 1
          ci_tpl_require_digest "$digest" || return 1
          [ "$reference" = "$repository@$digest" ] ||
              { ci_tpl_fail "$file reference '$reference' disagrees with its repository and digest"; return 1; }
          expr "$commit" : '^[0-9a-f]\{40\}$' >/dev/null ||
              { ci_tpl_fail "$file source_commit '$commit' is not a full commit sha"; return 1; }
          [ -n "$pipeline" ] && [ -n "$job" ] ||
              { ci_tpl_fail "$file is missing pipeline_id or job_id"; return 1; }
          [ -n "$platforms" ] ||
              { ci_tpl_fail "$file records no platforms"; return 1; }
          case "$kind" in
              # `unresolved` is what ci_tpl_write_subject_record writes: the subject
              # arrived as a reference the consumer typed, so nothing here inspected
              # the registry and neither manifest nor index would be a fact.
              manifest|index|unresolved) ;;
              *) ci_tpl_fail "$file subject_kind '$kind' is not manifest, index or unresolved"; return 1 ;;
          esac
          [ -n "$created" ] ||
              { ci_tpl_fail "$file records no created_at"; return 1; }
          return 0
      }

      # Record a subject the consumer named rather than one this pipeline built.
      #
      # Same shape as a build's image.json so a downstream job reads one contract
      # (section 9.1), with the two fields nothing here can know written as
      # `unresolved`: no registry call was made, so the platform list and whether the
      # reference points at a manifest or an index are not facts this job has.
      # Arguments: artifact-dir reference
      ci_tpl_write_subject_record() {
          ci_tpl_write_image_json "$1" "${2%@*}" "${2##*@}" unresolved unresolved
      }

      # Which image.json this job acts on.
      #
      # Usually the build job's: the consumer named build-job, the artifact arrived,
      # and the record is already on disk. A consumer scanning, signing or publishing
      # an image this pipeline did not build names it with subject-reference instead,
      # and then there is nothing to read: the record is written into this job's own
      # artefact root.
      #
      # Exactly one of the two. Both set is a contradiction nobody can resolve;
      # neither leaves the job with no subject at all. Either message names both.
      # Arguments: build-job subject-reference build-identity-file own-artifact-dir
      # Prints the path of the image.json to use.
      ci_tpl_resolve_identity_file() {
          if [ -n "$1" ] && [ -n "$2" ]; then
              ci_tpl_fail "build-job and subject-reference are both set; this job takes exactly one (build-job '$1', subject-reference '$2')"
              return 1
          fi
          if [ -z "$1" ] && [ -z "$2" ]; then
              ci_tpl_fail "neither build-job nor subject-reference is set; this job takes exactly one: build-job names the job whose image.json states the subject, subject-reference names the image as repository@sha256:<digest>"
              return 1
          fi
          if [ -z "$2" ]; then
              echo "$3"
              return 0
          fi
          ci_tpl_write_subject_record "$4" "$2" >&2 || return 1
          echo "$4/image.json"
      }

      # Print the validated reference from an image.json.
      ci_tpl_image_reference() {
          ci_tpl_validate_image_json "$1" || return 1
          ci_tpl_json_string "$1" reference
      }

      # Read the registry credentials from the CI variables the consumer named.
      # CI_TPL_REGISTRY_USERNAME_VARIABLE and CI_TPL_REGISTRY_PASSWORD_VARIABLE hold
      # variable NAMES, never values, and printenv resolves them: an input must not
      # become code, which is what eval or an indirect expansion would make it. The
      # estate's own names are the defaults, so a consumer that passes neither input
      # keeps the behaviour it had.
      #
      # Sets CI_TPL_REGISTRY_USER and CI_TPL_REGISTRY_PASSWORD, either of which may be
      # empty. A job that may run unauthenticated tests them; a job that must push
      # calls ci_tpl_write_registry_auth, which refuses an empty one.
      ci_tpl_load_registry_credentials() {
          CI_TPL_REGISTRY_USERNAME_VARIABLE=${CI_TPL_REGISTRY_USERNAME_VARIABLE:-HARBOR_USER}
          CI_TPL_REGISTRY_PASSWORD_VARIABLE=${CI_TPL_REGISTRY_PASSWORD_VARIABLE:-HARBOR_PASSWORD}
          CI_TPL_REGISTRY_USER=$(printenv "$CI_TPL_REGISTRY_USERNAME_VARIABLE") ||
              CI_TPL_REGISTRY_USER=''
          CI_TPL_REGISTRY_PASSWORD=$(printenv "$CI_TPL_REGISTRY_PASSWORD_VARIABLE") ||
              CI_TPL_REGISTRY_PASSWORD=''
      }

      # "set" or "empty or not defined" for one credential. The state, never the value.
      ci_tpl_credential_state() {
          if [ -n "$1" ]; then
              echo 'set'
          else
              echo 'empty or not defined'
          fi
      }

      # Write a registry auth file for one registry host. The credentials are read
      # from the environment, never passed as arguments, so they do not appear in the
      # process table. base64 wraps at 76 columns in both busybox and coreutils, so
      # the newlines are stripped: a wrapped credential produces a config.json that no
      # client can parse.
      #
      # The failure names the two variables it read and which of them was empty.
      # "registry credentials are not set" on its own is what made a consumer who had
      # set its own variables believe the component could not see them, when the
      # component was reading two names that consumer had never heard of.
      ci_tpl_write_registry_auth() {
          config_dir=$1
          registry=$2
          ci_tpl_load_registry_credentials
          user_state=$(ci_tpl_credential_state "$CI_TPL_REGISTRY_USER")
          secret_state=$(ci_tpl_credential_state "$CI_TPL_REGISTRY_PASSWORD")
          if [ "$user_state" != 'set' ] || [ "$secret_state" != 'set' ]; then
              ci_tpl_fail "registry credentials are not set; this job cannot push to ${registry}"
              echo "ERROR: username, from \$${CI_TPL_REGISTRY_USERNAME_VARIABLE}: ${user_state}" >&2
              echo "ERROR: password, from \$${CI_TPL_REGISTRY_PASSWORD_VARIABLE}: ${secret_state}" >&2
              echo 'ERROR: define both as CI variables on this project, or name the variables you' >&2
              echo 'ERROR: already have through the registry-username-variable and' >&2
              echo 'ERROR: registry-password-variable inputs. A protected variable reaches' >&2
              echo 'ERROR: protected branches and protected tags only.' >&2
              return 1
          fi
          mkdir -p "$config_dir"
          auth=$(printf '%s:%s' "$CI_TPL_REGISTRY_USER" "$CI_TPL_REGISTRY_PASSWORD" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$registry" "$auth" > "$config_dir/config.json"
          chmod 600 "$config_dir/config.json"
      }

      ci_tpl_registry_host() {
          echo "${1%%/*}"
      }
      # END embed
    - |
      # BEGIN embed inline runtime/registry/ca-bundle.sh
      #!/bin/sh
      # Trust an extra certificate authority inside a job container.
      #
      # Its own file rather than part of image-json.sh because the signing component
      # needs it and needs nothing else there: that job runs Python, not the shell
      # image helpers, and embedding 250 lines of JSON handling to reach one function
      # would be worse than either.
      #
      # It depends on nothing else here, deliberately: the signing component embeds
      # this file and no other.
      #
      # Embedded verbatim by every component that talks to a registry over TLS;
      # tests/runtime/registry/test_ca_bundle.py drives this copy.
      # Trust one more certificate authority, for a registry issued by an internal
      # one. The PEM comes from the CI variable named by CI_TPL_CA_BUNDLE_VARIABLE,
      # which may be a GitLab file variable (the value is a path) or an ordinary one
      # (the value is the PEM itself). Nothing is downloaded: a job that has to fetch
      # its trust anchor cannot run at a site with no egress, which is the site that
      # needs this input.
      #
      # Empty or unset skips it. A variable holding no certificate is an error rather
      # than an empty success, because the job would otherwise fail later with a TLS
      # error naming the registry instead of the bundle.
      ci_tpl_trust_ca_bundle() {
          [ -n "${CI_TPL_CA_BUNDLE_VARIABLE:-}" ] || return 0
          bundle=$(printenv "$CI_TPL_CA_BUNDLE_VARIABLE") || bundle=''
          if [ -z "$bundle" ]; then
              echo "ERROR: ca-bundle-variable names \$${CI_TPL_CA_BUNDLE_VARIABLE}, which is empty or not defined" >&2
              return 1
          fi
          pem=${CI_TPL_WORK:-/tmp}/ci-tpl-ca-bundle.pem
          if [ -f "$bundle" ]; then
              cat "$bundle" > "$pem"
          else
              printf '%s\n' "$bundle" > "$pem"
          fi
          certs=$(grep -c 'BEGIN CERTIFICATE' "$pem") || certs=0
          if [ "$certs" -eq 0 ]; then
              echo "ERROR: \$${CI_TPL_CA_BUNDLE_VARIABLE} carries no PEM certificate" >&2
              return 1
          fi
          store=${CI_TPL_CA_STORE:-/etc/ssl/certs/ca-certificates.crt}
          if cat "$pem" >> "$store" 2>/dev/null; then
              echo "trusted ${certs} extra certificate(s) from \$${CI_TPL_CA_BUNDLE_VARIABLE}"
              return 0
          fi
          # A non-root execution image cannot write the system store, and refusing
          # there would mean the input works only for images that run as root.
          # Combine the store with the extra anchors and name the copy in the three
          # variables the clients in these jobs read: Go (buildctl, trivy, syft,
          # cosign) reads SSL_CERT_FILE, python-requests reads REQUESTS_CA_BUNDLE and
          # curl reads CURL_CA_BUNDLE.
          combined=${CI_TPL_WORK:-/tmp}/ci-tpl-ca-combined.pem
          if [ -r "$store" ]; then
              cat "$store" "$pem" > "$combined"
          else
              cat "$pem" > "$combined"
          fi
          SSL_CERT_FILE=$combined
          REQUESTS_CA_BUNDLE=$combined
          CURL_CA_BUNDLE=$combined
          export SSL_CERT_FILE REQUESTS_CA_BUNDLE CURL_CA_BUNDLE
          echo "trusted ${certs} extra certificate(s) from \$${CI_TPL_CA_BUNDLE_VARIABLE}"
          echo "the trust store at ${store} is not writable here, so SSL_CERT_FILE names ${combined}"
      }
      # END embed
    - |
      # BEGIN embed inline runtime/promote/skopeo.sh
      #!/bin/sh
      # Copy one digest from one OCI repository to another, and prove the copy.
      #
      # runtime/promote/harbor.py does the same job through the Harbor API, so a site
      # whose registry is Quay or Artifactory cannot promote at all. Every registry in
      # that list implements the OCI distribution API, and skopeo speaks only that, so
      # the vendor becomes two repository names instead of a second component.
      #
      # Nothing is rebuilt. A copy by digest reuses the manifest the source already
      # holds, and the target manifest is read back and hashed: a digest that differs
      # is a different artifact, whatever the copy reported.
      #
      # Functions only; sourcing it runs nothing. The component embeds it verbatim
      # after runtime/registry/image-json.sh, whose ci_tpl_fail, ci_tpl_json_string,
      # ci_tpl_json_list, ci_tpl_require_digest, ci_tpl_validate_image_json,
      # ci_tpl_write_registry_auth and ci_tpl_registry_host it calls. Section 12:
      # `include:` imports YAML, so a consumer job never has this repository on disk.
      #
      # tests/runtime/promote/test_skopeo.py drives this file with skopeo stubbed.

      # The digest to promote. Exactly one source, never a fallback: an unreadable
      # image.json that quietly became "whatever tag is there now" is the defect
      # container-promote-harbor was written to remove.
      ci_tpl_promote_source_digest() {
          if [ -n "${CI_TPL_SOURCE_DIGEST:-}" ]; then
              ci_tpl_require_digest "$CI_TPL_SOURCE_DIGEST" || return 1
              printf '%s\n' "$CI_TPL_SOURCE_DIGEST"
              return 0
          fi
          if [ -z "${CI_TPL_IDENTITY_FILE:-}" ] || [ ! -f "$CI_TPL_IDENTITY_FILE" ]; then
              ci_tpl_fail "neither source-digest nor a readable image.json at ${CI_TPL_IDENTITY_FILE:-<unset>}"
              return 1
          fi
          ci_tpl_validate_image_json "$CI_TPL_IDENTITY_FILE" || return 1
          ci_tpl_json_string "$CI_TPL_IDENTITY_FILE" digest
      }

      # The tags the promoted digest is published under, one per line.
      #
      # At least one is required. skopeo refuses a digest as a copy DESTINATION, and
      # an untagged push would land an artifact the registry's own garbage collection
      # is entitled to remove.
      ci_tpl_promote_tags() {
          _list=$(ci_tpl_json_list "${CI_TPL_TARGET_TAGS:-}")
          if [ -z "$_list" ]; then
              ci_tpl_fail 'target-tags is empty; a copy destination needs at least one tag'
              return 1
          fi
          # Split on newlines only, with globbing off: a tag is consumer data and
          # must not become a pattern that matches a file in the checkout.
          _saved_ifs=$IFS
          IFS='
      '
          set -f
          for _tag in $_list; do
              case "$_tag" in
                  *[!A-Za-z0-9._-]* | '')
                      set +f
                      IFS=$_saved_ifs
                      ci_tpl_fail "'$_tag' is not a valid tag name"
                      return 1
                      ;;
              esac
              printf '%s\n' "$_tag"
          done
          set +f
          IFS=$_saved_ifs
      }

      # Write the two docker config files skopeo reads, one per registry.
      #
      # Two calls to the same helper with the two credential variable NAMES swapped in
      # turn, so a promotion between registries takes two identities and a promotion
      # inside one takes the same identity twice. Neither credential reaches a command
      # line: skopeo is given a file path.
      ci_tpl_promote_authfiles() {
          _dir=$1
          _source_host=$(ci_tpl_registry_host "$CI_TPL_SOURCE_REPOSITORY")
          _target_host=$(ci_tpl_registry_host "$CI_TPL_TARGET_REPOSITORY")
          CI_TPL_REGISTRY_USERNAME_VARIABLE=$CI_TPL_SOURCE_USERNAME_VARIABLE
          CI_TPL_REGISTRY_PASSWORD_VARIABLE=$CI_TPL_SOURCE_PASSWORD_VARIABLE
          ci_tpl_write_registry_auth "$_dir/source" "$_source_host" || return 1
          CI_TPL_REGISTRY_USERNAME_VARIABLE=$CI_TPL_TARGET_USERNAME_VARIABLE
          CI_TPL_REGISTRY_PASSWORD_VARIABLE=$CI_TPL_TARGET_PASSWORD_VARIABLE
          ci_tpl_write_registry_auth "$_dir/target" "$_target_host" || return 1
          CI_TPL_SOURCE_AUTHFILE=$_dir/source/config.json
          CI_TPL_TARGET_AUTHFILE=$_dir/target/config.json
          export CI_TPL_SOURCE_AUTHFILE CI_TPL_TARGET_AUTHFILE
      }

      # Copy the digest to one tag on the target.
      #
      # --all copies every manifest an index names. Without it skopeo copies the one
      # image matching the runner's own platform, which silently turns a multi-arch
      # release into an amd64 one and changes the digest.
      ci_tpl_promote_copy() {
          _digest=$1
          _tag=$2
          skopeo copy --all \
              --src-authfile "$CI_TPL_SOURCE_AUTHFILE" \
              --dest-authfile "$CI_TPL_TARGET_AUTHFILE" \
              "docker://$CI_TPL_SOURCE_REPOSITORY@$_digest" \
              "docker://$CI_TPL_TARGET_REPOSITORY:$_tag"
      }

      # The digest the target tag resolves to.
      #
      # The raw manifest is hashed rather than a field of `skopeo inspect` being read.
      # A digest IS the sha256 of those bytes, so this answers with the registry's
      # content rather than with what the registry says about it; and plain `skopeo
      # inspect` resolves an index down to the runner's platform, which would report
      # a child digest and never equal the index digest it was asked about.
      ci_tpl_promote_target_digest() {
          _tag=$1
          _raw=${CI_TPL_WORK:-/tmp}/ci-tpl-target-manifest.json
          skopeo inspect --raw \
              --authfile "$CI_TPL_TARGET_AUTHFILE" \
              "docker://$CI_TPL_TARGET_REPOSITORY:$_tag" > "$_raw" || return 1
          printf 'sha256:%s\n' "$(sha256sum "$_raw" | cut -d ' ' -f 1)"
      }

      # Fail unless the target carries the digest that was copied.
      ci_tpl_promote_verify() {
          _digest=$1
          _tag=$2
          _got=$(ci_tpl_promote_target_digest "$_tag") || return 1
          if [ "$_got" != "$_digest" ]; then
              ci_tpl_fail "$CI_TPL_TARGET_REPOSITORY:$_tag is $_got, not the $_digest that was copied"
              return 1
          fi
          echo "verified $CI_TPL_TARGET_REPOSITORY:$_tag at $_digest"
      }

      # The evidence record. Written after the verification, never before: a result
      # file naming a digest nobody read back is the "HTTP 201 is proof" defect.
      ci_tpl_promote_result() {
          _file=$1
          _digest=$2
          shift 2
          mkdir -p "$(dirname "$_file")"
          _tags=''
          for _tag in "$@"; do
              _tags="$_tags${_tags:+, }\"$_tag\""
          done
          cat > "$_file" <<EOF
      {
        "schema_version": 1,
        "source": "$CI_TPL_SOURCE_REPOSITORY@$_digest",
        "target": "$CI_TPL_TARGET_REPOSITORY@$_digest",
        "digest": "$_digest",
        "tags": [$_tags],
        "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      }
      EOF
      }
      # END embed
  script:
    - |
      set -eu
      ci_tpl_trust_ca_bundle
      CI_TPL_DIGEST=$(ci_tpl_promote_source_digest)
      CI_TPL_TAG_LIST=$(ci_tpl_promote_tags)
      ci_tpl_promote_authfiles "$CI_TPL_WORK/auth"
      echo "promoting $CI_TPL_SOURCE_REPOSITORY@$CI_TPL_DIGEST to $CI_TPL_TARGET_REPOSITORY"
      # Deliberate word splitting, with globbing off: ci_tpl_promote_tags has
      # already refused every character outside [A-Za-z0-9._-], so a tag holds
      # no whitespace to split wrongly on and no pattern to expand.
      set -f
      set -- $CI_TPL_TAG_LIST
      set +f
      for CI_TPL_TAG in "$@"; do
        ci_tpl_promote_copy "$CI_TPL_DIGEST" "$CI_TPL_TAG"
        ci_tpl_promote_verify "$CI_TPL_DIGEST" "$CI_TPL_TAG"
      done
      ci_tpl_promote_result "$CI_TPL_ARTIFACT_DIR/promote-result.json" "$CI_TPL_DIGEST" "$@"
      cat "$CI_TPL_ARTIFACT_DIR/promote-result.json"
  artifacts:
    name: '$[[ inputs.instance ]]-container-promote-skopeo-$CI_JOB_ID'
    paths:
      - '.ci-artifacts/$[[ inputs.instance ]]/container-promote-skopeo/'
    when: always
    # .ci/estate.yml retention.evidence. release_records is unresolved there, so
    # this follows the evidence retention until an owner sets one.
    expire_in: 1 week
  rules: $[[ inputs.run-rules ]]
  # Manual jobs default to allow_failure: true in GitLab. A failed release
  # publication is not a success, so it is set explicitly.
  allow_failure: false
  interruptible: false
  # Infrastructure only. Section 10.1 forbids weakening an outcome, and any
  # condition other than runner_system_failure would retry a failed gate;
  # tests/contracts/test_retry_policy.py fails the build on one.
  retry:
    max: $[[ inputs.max-retries ]]
    when: [runner_system_failure]
  # Insulation from the consumer's `default:` block (section 13.1). A component
  # job runs in the image the component pins and the shell the component ships;
  # a consumer's global image, before_script, after_script, cache, services,
  # artifacts or hooks reaching it is a component running something nobody
  # reviewed. Runner selection and timeouts are the consumer's to set, so those
  # stay inherited. `retry` and `id_tokens` stay too: this component sets both
  # itself, and a consumer-level definition is a deliberate estate choice.
  inherit:
    default: [tags, timeout, interruptible, retry, id_tokens]
