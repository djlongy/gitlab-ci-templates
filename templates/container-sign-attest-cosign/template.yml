---
# Sign one built image with cosign and attach the evidence the release requires.
#
# Signing identity comes from Vault through a GitLab ID token, with the audience,
# auth mount and role supplied as inputs rather than baked in. Section 10.2: "Do
# not hardcode vault.example.com or a universal gitlab-ci role into a reusable
# component." The defaults below are this estate's values from .ci/estate.yml
# auth.vault, which a composition may replace.
#
# Nothing here degrades to a warning. A missing credential, a rejected login, a
# missing SBOM or vulnerability record, or a cosign binary that does not match
# its pinned checksum all fail the job. The predecessor exited 0 on the first
# three (audit 5.6) and downloaded cosign with no checksum at all.

#### Public interface ####
spec:
  inputs:
    instance:
      type: string
      description: Unique workload instance used in the job name.
      regex: '^[a-z][a-z0-9-]{0,47}$'
    stage:
      type: string
      description: Stage supplied by the owning composition.
      default: attest
    execution-image:
      type: string
      description: >-
        Approved Python execution image pinned by digest. cosign itself is
        downloaded at a pinned version and verified against the checksums
        committed in runtime/sign/.
      default: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
      regex: '^.+@sha256:[0-9a-f]{64}$'
    runner-tags:
      type: array
      description: Runner selection from the estate profile.
      default: []
    max-retries:
      type: number
      description: >-
        How many times the runner may retry this job. The condition is
        runner_system_failure only, so this retries infrastructure and never a
        failed gate.
      default: 1
      options: [0, 1, 2]
    run-rules:
      type: array
      description: >-
        Job eligibility set by the composition. Merge-request pipelines never
        receive the signing identity.
      default:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: never
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    build-job:
      type: string
      description: Exact name of the job whose image.json identifies the subject.
    build-component:
      type: string
      description: Component name the build job writes its artifacts under.
      default: container-build-buildkit
    sbom-job:
      type: string
      description: >-
        Exact name of the security-sbom-syft job. Required, not optional: the
        SBOM this attests is the release's evidence, and a missing producer is
        a missing attestation.
    scan-job:
      type: string
      description: >-
        Exact name of the image scan job whose scan-result.json is attested and
        whose gate must have passed before anything is signed.
    scan-component:
      type: string
      description: Component name the scan job writes its artifacts under.
      default: security-image-trivy
    gate-jobs:
      type: array
      description: >-
        Additional jobs that must succeed first, as needs entries with
        artifacts false. The three producers above are always included.
      default: []
    cosign-key:
      type: string
      description: >-
        cosign key URI. The estate signs with a Vault Transit key, so the
        private key never leaves Vault.
      default: 'hashivault://cosign'
    vault-address:
      type: string
      description: Vault address, from .ci/estate.yml auth.vault.address.
      default: 'https://vault.example.com:8200'
    vault-jwt-audience:
      type: string
      description: Audience the ID token is minted for.
      default: 'https://vault.example.com:8200'
    vault-auth-path:
      type: string
      description: Vault JWT auth mount, from .ci/estate.yml auth.vault.jwt_mount.
      default: jwt
    vault-role:
      type: string
      description: >-
        Vault JWT role this job authenticates as. An input so a composition can
        use a least-privilege signing identity instead of a shared one.
      default: gitlab-ci
    attest-sbom:
      type: string
      description: Attach the CycloneDX SBOM as an attestation.
      default: 'true'
      options: ['true', 'false']
    attest-vulnerabilities:
      type: string
      description: Attach the scan result as a vulnerability attestation.
      default: 'true'
      options: ['true', 'false']
    tlog-upload:
      type: string
      description: >-
        Upload to a Rekor transparency log. false by default: this estate runs
        no Rekor instance.
      default: 'false'
      options: ['true', 'false']
---
"$[[ inputs.instance ]]:container-sign-attest-cosign":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.execution-image ]]
    entrypoint: ['']
  tags: $[[ inputs.runner-tags ]]
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $[[ inputs.vault-jwt-audience ]]
  variables:
    # Non-root execution images own their build directory: the runner reads the
    # image's uid and gid and chowns it, instead of relying on umask 0000.
    # Without it, a job running as a non-root uid died on .git/objects that a
    # root job had written into the same concurrency slot.
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 'true'
    CI_TPL_RUNTIME_DIR: /tmp/ci-runtime
    CI_TPL_ARTIFACT_DIR: '.ci-artifacts/$[[ inputs.instance ]]/container-sign-attest-cosign'
    CI_TPL_IDENTITY_FILE: '.ci-artifacts/$[[ inputs.instance ]]/$[[ inputs.build-component ]]/image.json'
    CI_TPL_SBOM_DIR: '.ci-artifacts/$[[ inputs.instance ]]/security-sbom-syft'
    CI_TPL_SCAN_DIR: '.ci-artifacts/$[[ inputs.instance ]]/$[[ inputs.scan-component ]]'
    CI_TPL_COSIGN_KEY: $[[ inputs.cosign-key ]]
    CI_TPL_VAULT_ADDRESS: $[[ inputs.vault-address ]]
    CI_TPL_VAULT_AUTH_PATH: $[[ inputs.vault-auth-path ]]
    CI_TPL_VAULT_ROLE: $[[ inputs.vault-role ]]
    CI_TPL_ATTEST_SBOM: '$[[ inputs.attest-sbom ]]'
    CI_TPL_ATTEST_VULNERABILITIES: '$[[ inputs.attest-vulnerabilities ]]'
    CI_TPL_TLOG_UPLOAD: '$[[ inputs.tlog-upload ]]'
  needs:
    - job: $[[ inputs.build-job ]]
      artifacts: true
    - job: $[[ inputs.sbom-job ]]
      artifacts: true
    - job: $[[ inputs.scan-job ]]
      artifacts: true
    - $[[ inputs.gate-jobs ]]
  before_script:
    - |
      # BEGIN embed dir $CI_TPL_RUNTIME_DIR runtime/httpjson.py runtime/sign/cosign_attest.py runtime/sign/cosign_checksums.txt
      mkdir -p "$CI_TPL_RUNTIME_DIR" "$CI_TPL_RUNTIME_DIR/sign" || exit 1
      cat > "$CI_TPL_RUNTIME_DIR/httpjson.py" <<'CI_TPL_EMBED_EOF' || exit 1
      """Minimal JSON-over-HTTPS client shared by the runtime helpers.

      The predecessor templates parsed API responses with `grep -o '"key":"[^"]*"'`,
      which returns an empty string for a field the server never sent. An absent
      `readiness` field then compared unequal to `"red"` and the release gate passed on
      an empty response (audit 6.2). Everything here uses a real parser and treats a
      response it cannot parse as a failure.

      Only the standard library: runtime/<domain>/install.sh writes these helpers
      into a job's runtime directory, and nothing is installed there.

      Nothing in this module logs a header value or a request body. Credentials reach
      it as arguments and stay there.
      """

      from __future__ import annotations

      import json
      import urllib.error
      import urllib.request
      from typing import Any


      class HttpError(RuntimeError):
          """The request could not be completed, which is never a passing result."""


      class Response:
          def __init__(self, status: int, body: bytes):
              self.status = status
              self.body = body

          @property
          def text(self) -> str:
              return self.body.decode("utf-8", errors="replace")

          def json(self) -> Any:
              """Parsed body, or HttpError.

              A body that is not JSON is a failure and not an empty result: the caller
              asked an API a question and did not get an answer it can read.
              """
              try:
                  return json.loads(self.body)
              except (ValueError, UnicodeDecodeError) as error:
                  raise HttpError(f"response body is not JSON: {error}") from error

          def ok(self) -> bool:
              return 200 <= self.status < 300


      def request(
          method: str,
          url: str,
          *,
          headers: dict[str, str] | None = None,
          body: bytes | None = None,
          timeout: int = 30,
      ) -> Response:
          """Perform one HTTPS request and return its status and body.

          An HTTP error status is returned, not raised: callers decide which codes are
          expected. Only a transport-level failure raises, because that is a question
          that never reached the server.
          """
          if not url.startswith("https://"):
              # TLS is not optional, and neither is a maintained trust bundle
              # (section 10.2). A plaintext endpoint is a configuration error.
              raise HttpError(f"refusing a non-HTTPS request to {url}")

          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          try:
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return Response(response.status, response.read())
          except urllib.error.HTTPError as error:
              return Response(error.code, error.read())
          except urllib.error.URLError as error:
              raise HttpError(f"{method} {url} could not be completed: {error.reason}") from error
          except TimeoutError as error:
              raise HttpError(f"{method} {url} timed out after {timeout}s") from error


      def get_json(url: str, **kwargs: Any) -> Any:
          response = request("GET", url, **kwargs)
          if not response.ok():
              raise HttpError(f"GET {url} returned HTTP {response.status}: {response.text[:300]}")
          return response.json()
      CI_TPL_EMBED_EOF
      cat > "$CI_TPL_RUNTIME_DIR/sign/cosign_attest.py" <<'CI_TPL_EMBED_EOF' || exit 1
      """Sign a built image with cosign and attach the evidence the release requires.

          cosign_attest.py sign --identity image.json --sbom sbom.cdx.json
                                --subject subject.json --vulnerability-report F
                                --key hashivault://cosign --vault-address URL
                                --vault-auth-path jwt --vault-role gitlab-ci
                                --output attestation-result.json

      Every failure mode in audit 5.6 is a hard failure here:

        * no Vault credential                -> fail. The template this replaces printed
          "WARN: No VAULT_TOKEN - skipping cosign signing" and exited 0, so a broken
          Vault role produced a green job and an unsigned image (section 10.1:
          "Signing enabled but credentials unavailable -> Job fails").
        * JWT login rejected                 -> fail, rather than falling through.
        * SBOM or vulnerability report absent -> fail (section 10.1: "Required SBOM or
          attestation evidence absent").
        * cosign binary checksum mismatch    -> fail before it is made executable.

      The subject is the digest reference from the builder's image.json, and the SBOM
      is only attested once its own subject record agrees with that reference.

      No SLSA provenance is produced. The predecessor assembled a provenance document
      from CI variables in a heredoc and attached it as `--type slsaprovenance`;
      section 11.1 forbids labelling hand-written source metadata as a verified SLSA
      level, and this repository has no builder-produced provenance to attach instead.
      """

      from __future__ import annotations

      import argparse
      import base64
      import hashlib
      import json
      import os
      import stat
      import subprocess
      import sys
      import time
      from pathlib import Path

      sys.path.insert(0, str(Path(__file__).resolve().parent.parent))

      from httpjson import HttpError, request  # noqa: E402

      COSIGN_VERSION = "v2.4.1"
      COSIGN_RELEASE_URL = "https://github.com/sigstore/cosign/releases/download"
      ARCHITECTURES = {"x86_64": "amd64", "amd64": "amd64", "aarch64": "arm64", "arm64": "arm64"}


      class SigningFailure(RuntimeError):
          """Signing did not complete, or its evidence cannot be shown."""


      def now() -> str:
          return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


      def read_identity(path: Path) -> dict:
          if not path.is_file():
              raise SigningFailure(f"image identity record not found: {path}")
          try:
              identity = json.loads(path.read_text())
          except ValueError as error:
              raise SigningFailure(f"{path} is not valid JSON: {error}") from error
          digest = identity.get("digest", "")
          if not isinstance(digest, str) or not digest.startswith("sha256:") or len(digest) != 71:
              raise SigningFailure(f"{path} carries no sha256 digest; refusing to sign a tag")
          if identity.get("reference") != f"{identity.get('repository', '')}@{digest}":
              raise SigningFailure(f"{path} is inconsistent: reference is not repository@digest")
          return identity


      def expected_checksum(checksums: Path, asset: str) -> str:
          for line in checksums.read_text().splitlines():
              if line.startswith("#") or not line.strip():
                  continue
              digest, _, name = line.partition("  ")
              if name.strip() == asset:
                  return digest.strip()
          raise SigningFailure(f"{checksums} pins no checksum for {asset}")


      def install_cosign(destination: Path, checksums: Path, machine: str) -> str:
          """Download cosign and refuse to run it unless it matches the pinned hash."""
          architecture = ARCHITECTURES.get(machine)
          if architecture is None:
              raise SigningFailure(
                  f"no cosign checksum is pinned for machine {machine!r}; add one from "
                  "the release's cosign_checksums.txt rather than skipping verification"
              )

          asset = f"cosign-linux-{architecture}"
          wanted = expected_checksum(checksums, asset)

          response = request("GET", f"{COSIGN_RELEASE_URL}/{COSIGN_VERSION}/{asset}", timeout=180)
          if not response.ok():
              raise SigningFailure(f"downloading {asset} returned HTTP {response.status}")

          actual = hashlib.sha256(response.body).hexdigest()
          if actual != wanted:
              raise SigningFailure(
                  f"{asset} does not match the pinned checksum. "
                  f"expected {wanted}, got {actual}"
              )

          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes(response.body)
          destination.chmod(destination.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          print(f"cosign {COSIGN_VERSION} ({asset}) verified against the pinned checksum")
          return actual


      def vault_token(args: argparse.Namespace) -> str:
          """Exchange the job's ID token for a Vault token. No token, no signing."""
          jwt = os.environ.get(args.id_token_variable, "")
          if not jwt:
              raise SigningFailure(
                  f"{args.id_token_variable} is empty. The component declares it through "
                  "id_tokens; without it there is no identity to sign with."
              )

          response = request(
              "POST",
              f"{args.vault_address.rstrip('/')}/v1/auth/{args.vault_auth_path}/login",
              headers={"Content-Type": "application/json"},
              body=json.dumps({"jwt": jwt, "role": args.vault_role}).encode(),
              timeout=args.request_timeout,
          )
          if not response.ok():
              raise SigningFailure(
                  f"Vault rejected the JWT login for role {args.vault_role!r}: "
                  f"HTTP {response.status}: {response.text[:300]}"
              )

          body = response.json()
          token = (body.get("auth") or {}).get("client_token") if isinstance(body, dict) else None
          if not token:
              raise SigningFailure("Vault returned no client token for the JWT login")
          print(f"Vault login succeeded for role {args.vault_role} (token length {len(token)})")
          return token


      def registry_auth(registry: str, username_variable: str, password_variable: str) -> bool:
          """Write a docker config so cosign can read manifests from the registry."""
          username = os.environ.get(username_variable, "")
          password = os.environ.get(password_variable, "")
          if not username or not password:
              return False
          credential = base64.b64encode(f"{username}:{password}".encode()).decode("ascii")
          config = Path.home() / ".docker" / "config.json"
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(json.dumps({"auths": {registry: {"auth": credential}}}))
          config.chmod(0o600)
          return True


      def run_cosign(binary: Path, arguments: list[str], environment: dict[str, str]) -> None:
          completed = subprocess.run(
              [str(binary), *arguments],
              env={**os.environ, **environment},
              check=False,
          )
          if completed.returncode != 0:
              raise SigningFailure(
                  f"cosign {arguments[0]} failed with exit code {completed.returncode}"
              )


      def file_digest(path: Path) -> str:
          return hashlib.sha256(path.read_bytes()).hexdigest()


      def require_evidence(path: Path, what: str) -> None:
          if not path.is_file() or path.stat().st_size == 0:
              raise SigningFailure(
                  f"{what} is missing or empty at {path}. Attesting it was requested, so "
                  "the release has no evidence and this job fails."
              )


      def check_sbom_subject(subject_path: Path, reference: str) -> None:
          require_evidence(subject_path, "the SBOM subject record")
          try:
              subject = json.loads(subject_path.read_text())
          except ValueError as error:
              raise SigningFailure(f"{subject_path} is not valid JSON: {error}") from error
          if subject.get("image_reference") != reference:
              raise SigningFailure(
                  f"the SBOM describes {subject.get('image_reference')!r}, not the image "
                  f"being signed ({reference})"
              )


      def sign(args: argparse.Namespace) -> int:
          identity = read_identity(Path(args.identity))
          reference = identity["reference"]
          registry = identity["repository"].split("/", 1)[0]

          binary = Path(args.install_dir) / "cosign"
          binary_sha256 = install_cosign(binary, Path(args.checksums), os.uname().machine)

          token = vault_token(args)
          environment = {"VAULT_ADDR": args.vault_address, "VAULT_TOKEN": token}

          authenticated = registry_auth(registry, args.username_variable, args.password_variable)
          if not authenticated:
              print(
                  f"no {args.username_variable}/{args.password_variable} in the "
                  "environment; relying on an anonymous registry read"
              )

          tlog = f"--tlog-upload={'true' if args.tlog_upload else 'false'}"

          # An unreadable key is a credential failure, caught before anything is
          # signed rather than halfway through.
          run_cosign(binary, ["public-key", "--key", args.key], environment)

          run_cosign(
              binary,
              [
                  "sign", "--key", args.key, "--yes", tlog,
                  "-a", f"ci.commit.sha={identity.get('source_commit', '')}",
                  "-a", f"ci.pipeline.id={identity.get('pipeline_id', '')}",
                  "-a", f"ci.project={os.environ.get('CI_PROJECT_PATH', '')}",
                  reference,
              ],
              environment,
          )

          attached = [{"kind": "signature", "predicate": None}]

          if args.attest_sbom:
              sbom = Path(args.sbom)
              require_evidence(sbom, "the authoritative SBOM")
              check_sbom_subject(Path(args.subject), reference)
              run_cosign(
                  binary,
                  ["attest", "--key", args.key, "--type", "cyclonedx",
                   "--predicate", str(sbom), "--yes", tlog, reference],
                  environment,
              )
              attached.append({"kind": "cyclonedx", "predicate": str(sbom),
                               "sha256": file_digest(sbom)})

          if args.attest_vulnerabilities:
              report = Path(args.vulnerability_report)
              require_evidence(report, "the vulnerability report")
              run_cosign(
                  binary,
                  ["attest", "--key", args.key, "--type", "vuln",
                   "--predicate", str(report), "--yes", tlog, reference],
                  environment,
              )
              attached.append({"kind": "vuln", "predicate": str(report),
                               "sha256": file_digest(report)})

          output = Path(args.output)
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "status": "signed",
                      "subject": reference,
                      "digest": identity["digest"],
                      "signer": {
                          "tool": "cosign",
                          "version": COSIGN_VERSION,
                          "binary_sha256": binary_sha256,
                          "key": args.key,
                          "vault_address": args.vault_address,
                          "vault_auth_path": args.vault_auth_path,
                          "vault_role": args.vault_role,
                      },
                      "transparency_log_upload": bool(args.tlog_upload),
                      "attached": attached,
                      "created_at": now(),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          print(f"signed {reference} with {len(attached) - 1} attestation(s)")
          return 0


      def _boolean(value: str) -> bool:
          return str(value).lower() == "true"


      def build_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(description=__doc__)
          sub = parser.add_subparsers(dest="command", required=True)

          sign_parser = sub.add_parser("sign", help="sign an image and attach its evidence")
          sign_parser.add_argument("--identity", required=True)
          sign_parser.add_argument("--sbom", required=True)
          sign_parser.add_argument("--subject", required=True)
          sign_parser.add_argument("--vulnerability-report", required=True)
          sign_parser.add_argument("--output", required=True)
          sign_parser.add_argument("--key", required=True)
          sign_parser.add_argument("--vault-address", required=True)
          sign_parser.add_argument("--vault-auth-path", required=True)
          sign_parser.add_argument("--vault-role", required=True)
          sign_parser.add_argument("--id-token-variable", default="VAULT_ID_TOKEN")
          sign_parser.add_argument("--username-variable", default="HARBOR_USER")
          sign_parser.add_argument("--password-variable", default="HARBOR_PASSWORD")
          sign_parser.add_argument("--checksums", required=True)
          sign_parser.add_argument("--install-dir", default="/usr/local/bin")
          sign_parser.add_argument("--attest-sbom", default="true")
          sign_parser.add_argument("--attest-vulnerabilities", default="true")
          sign_parser.add_argument("--tlog-upload", default="false")
          sign_parser.add_argument("--request-timeout", type=int, default=60)
          sign_parser.set_defaults(handler=sign)

          return parser


      def main(argv: list[str] | None = None) -> int:
          args = build_parser().parse_args(argv)
          for flag in ("attest_sbom", "attest_vulnerabilities", "tlog_upload"):
              if isinstance(getattr(args, flag, None), str):
                  setattr(args, flag, _boolean(getattr(args, flag)))
          try:
              return args.handler(args)
          except (SigningFailure, HttpError) as error:
              print(f"ERROR: {error}", file=sys.stderr)
              return 1


      if __name__ == "__main__":
          raise SystemExit(main())
      CI_TPL_EMBED_EOF
      cat > "$CI_TPL_RUNTIME_DIR/sign/cosign_checksums.txt" <<'CI_TPL_EMBED_EOF' || exit 1
      # Pinned subset of the cosign v2.4.1 release checksums.
      #
      # Fetched 2026/09/15 from
      # https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign_checksums.txt
      # and committed so the verification input is pinned in this repository rather
      # than downloaded next to the binary it is supposed to vouch for. Section 12:
      # "use a pinned immutable source and independently verified checksum/signature;
      # fail validation errors."
      #
      # Bump this file and cosign-version together, never one alone.
      8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b  cosign-linux-amd64
      3b2e2e3854d0356c45fe6607047526ccd04742d20bd44afb5be91fa2a6e7cb4a  cosign-linux-arm64
      CI_TPL_EMBED_EOF
      # END embed
  script:
    - |
      mkdir -p "$CI_TPL_ARTIFACT_DIR" || exit 1
      # The vulnerability predicate is scan-result.json rather than a raw tool
      # report: it names the subject, the scanner, the database timestamp and
      # the policy the gate applied, and its producer validated it before
      # reporting success.
      python3 "$CI_TPL_RUNTIME_DIR/sign/cosign_attest.py" sign \
        --identity "$CI_TPL_IDENTITY_FILE" \
        --sbom "$CI_TPL_SBOM_DIR/sbom.cdx.json" \
        --subject "$CI_TPL_SBOM_DIR/subject.json" \
        --vulnerability-report "$CI_TPL_SCAN_DIR/scan-result.json" \
        --key "$CI_TPL_COSIGN_KEY" \
        --vault-address "$CI_TPL_VAULT_ADDRESS" \
        --vault-auth-path "$CI_TPL_VAULT_AUTH_PATH" \
        --vault-role "$CI_TPL_VAULT_ROLE" \
        --id-token-variable VAULT_ID_TOKEN \
        --username-variable HARBOR_USER \
        --password-variable HARBOR_PASSWORD \
        --checksums "$CI_TPL_RUNTIME_DIR/sign/cosign_checksums.txt" \
        --attest-sbom "$CI_TPL_ATTEST_SBOM" \
        --attest-vulnerabilities "$CI_TPL_ATTEST_VULNERABILITIES" \
        --tlog-upload "$CI_TPL_TLOG_UPLOAD" \
        --output "$CI_TPL_ARTIFACT_DIR/attestation-result.json" || exit 1
  artifacts:
    name: '$[[ inputs.instance ]]-container-sign-attest-cosign-$CI_JOB_ID'
    paths:
      - '.ci-artifacts/$[[ inputs.instance ]]/container-sign-attest-cosign/'
    when: always
    # .ci/estate.yml retention.evidence.
    expire_in: 1 week
  rules: $[[ inputs.run-rules ]]
  allow_failure: false
  # Signing writes to the registry; a cancelled half-run leaves partial evidence.
  interruptible: false
  # Infrastructure only. Section 10.1 forbids weakening an outcome, and any
  # condition other than runner_system_failure would retry a failed gate;
  # tests/contracts/test_retry_policy.py fails the build on one.
  retry:
    max: $[[ inputs.max-retries ]]
    when: [runner_system_failure]
  # Insulation from the consumer's `default:` block (section 13.1). A component
  # job runs in the image the component pins and the shell the component ships;
  # a consumer's global image, before_script, after_script, cache, services,
  # artifacts or hooks reaching it is a component running something nobody
  # reviewed. Runner selection and timeouts are the consumer's to set, so those
  # stay inherited. `retry` and `id_tokens` stay too: this component sets both
  # itself, and a consumer-level definition is a deliberate estate choice.
  inherit:
    default: [tags, timeout, interruptible, retry, id_tokens]
