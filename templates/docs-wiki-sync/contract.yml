---
name: docs-wiki-sync
kind: component
status: released
introduced_in: 1.0.0
minimum_gitlab: '18.9'
minimum_runner: '16.0'

# Retry policy: the `max-retries` input (0, 1 or 2, default 1) sets `retry: max`,
# and `retry: when` is `runner_system_failure` and nothing else. A job killed by
# its runner runs again; a failed gate never does.
emitted_jobs:
  - pattern: '{instance}:docs-wiki-sync'
    stage: verify
    # The sync either completes a cycle or fails: wiki-deploy.sh runs under
    # `set -euo pipefail` and the job carries no success mask.
    blocking: true

# The job mutates the project wiki and the default branch; it produces no
# pipeline artifact. Its record is the git history of both.
outputs: []

required_secrets:
  - name: WIKI_TOKEN
    kind: ci-variable
    scope: >-
      write_repository on the project, Maintainer when the default branch is
      protected. Clones and pushes the wiki, and pushes pulled wiki edits to the
      default branch.
    protected_ref_required: false

# The default, and what `executor: docker` runs. `executor: shell` emits no
# image at all and the job runs on the runner host's interpreter, which is
# python 3.9 on EL9; the runtime is tested on both (tests/runtime/wiki).
runtime_image:
  reference: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
  pinning: digest
  tool_versions:
    python: '3.12'
    pyyaml: 6.0.2

trust:
  privileged: false
  network_egress:
    - gitlab.example.com
    - registry.example.com, only when executor is docker
    - >-
      the configured Python package index, only when python3 cannot already
      import yaml. PIP_INDEX_URL and PIP_TRUSTED_HOST are read from the job
      environment; with neither set and no OS package present the job fails with
      a message naming both options rather than reaching pypi.org.
  runner_profile: >-
    shared-docker by default. `executor: shell` also supports a shell-executor
    runner, where the job runs as the runner's own user on the host.
  protected_ref_required: false

validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
    - runtime-tested
    - integration-tested
  verified_at: 2026/09/16
  revision: '1.0.0-rc.2'
  environment: >-
    gitlab.example.com 18.9.1-ee, POST /api/v4/projects/:id/ci/lint. Executed on shared
    ref 1.0.0-rc.2 by consumer pipelines on the originating estate, 2026/09: three
    wiki-sync consumers, all three docs:docs-wiki-sync green, and a documentation
    consumer on its merge-request, default-branch and scheduled pipelines. Both
    directions ran: the pull step reached its decision and reported "wiki has no edits
    since the last sync", which rc.1 skipped entirely through a swallowed failure.
    Importing an actual wiki edit has still not been exercised in a pipeline.

    Executed on a shell-executor runner on the originating estate, 2026/09: a
    throwaway project runner on EL9 with python 3.9 and gitlab-runner 19.3,
    tagged and refusing untagged jobs, against a documentation consumer pinned
    to the branch carrying this change. Six pipelines, in this order. The job
    renders with no image and the runner logs "Preparing the shell executor",
    "Using Shell (bash) executor" and the host's python version. The three
    pyyaml paths each ran: the OS package already importable, the OS package
    removed with a package index configured, and neither, which failed on the
    one-line error and nothing else. The round trip followed on the same runner
    with pypi.org blackholed in the host's /etc/hosts and no index configured,
    so none of it reached the internet: the wiki was wiped to zero pages and
    reseeded from docs/, a wiki edit that also changed the page title became a
    repository commit authored by the wiki editor and renaming the page's file,
    and a repository edit reached the wiki. The pull's own push to the default
    branch was skipped by its ci.skip, as designed.
  notes: >-
    Failure semantics (section 10.1): a missing WIKI_TOKEN excludes the job
    through run-rules rather than failing it; once the job runs, an absent token,
    an unreachable wiki, a rejected push after the bounded retries, a payload
    whose sha256 does not match, or a pyyaml that is neither importable nor installable
    all fail the job. Compatibility: this component drops the
    `.not_for_wiki_sync` rules fragment that consumers pulled in by
    `!reference`, and takes the documentation folder as the `working-directory`
    input instead of the top-level `DOCS_DIR` variable.
