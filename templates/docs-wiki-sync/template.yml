---
# templates/docs-wiki-sync/template.yml
#
# Two-way mirror between a repository's documentation folder and that project's
# GitLab wiki. The repository is the source of truth: a wiki edit becomes a
# repository commit authored by whoever made it, then the folder is regenerated
# into the wiki as the CI author.
#
# Replaces docs/wiki-sync.yml. Three things changed and none of them is cosmetic:
#
#   1. The runtime no longer arrives by `git clone --branch main` at job time.
#      It is vendored into the job variables below by runtime/pack/vendor.py, so
#      the code that runs is the code at the revision the consumer pinned its
#      `include:` to (section 11.6).
#   2. pyyaml is installed from a hash-pinned requirements file, not `pip install
#      pyyaml` (section 12).
#   3. There is no top-level `variables:` block. The old one merged into every
#      consumer's global variables and silently overwrote their DOCS_DIR
#      (section 6.1).
#
# The `.not_for_wiki_sync` rules fragment is deliberately not carried over. It
# suppressed EVERY job in a consumer's pipeline on `trigger` and `schedule`
# sources, which cost that consumer its scheduled pipelines (section 11.6:
# "do not suppress every scheduled job merely because a repository also has wiki
# sync"). A consumer that needs its other jobs to skip wiki-triggered pipelines
# declares that in its own rules.

#### Public interface ####
spec:
  inputs:
    instance:
      type: string
      description: Unique workload instance used in the job name.
      regex: '^[a-z][a-z0-9-]{0,47}$'
    stage:
      type: string
      description: >-
        Stage supplied by the owning composition. Section 7.1 places wiki sync
        in verify.
      default: verify
    working-directory:
      type: string
      description: >-
        Documentation folder, relative to the consumer checkout. This is the
        source of truth the wiki is regenerated from.
      default: docs
    mkdocs-config:
      type: string
      description: >-
        mkdocs.yml to read exclude_docs / not_in_nav from. Empty means the
        repository root mkdocs.yml when one exists, and no filtering otherwise.
      default: ''
    execution-image:
      type: string
      description: >-
        Approved Python execution image pinned by digest. Needs python3, pip,
        git, tar, base64 and sha256sum.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
    runner-tags:
      type: array
      description: Runner selection from the estate profile.
      default: []
    max-retries:
      type: number
      description: >-
        How many times the runner may retry this job. The condition is
        runner_system_failure only, so this retries infrastructure and never a
        failed gate.
      default: 1
      options: [0, 1, 2]
    run-rules:
      type: array
      description: >-
        Job eligibility set by the composition. The default states the three
        pipeline sources a wiki sync is intended for, rather than inferring them
        from a branch check: a push to the default branch, the wiki-page-event
        webhook that calls the trigger API, and the schedule that is the safety
        net. WIKI_TOKEN is required in every case because the job cannot clone
        or push the wiki without it.
      default:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WIKI_TOKEN'
        - if: '$CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WIKI_TOKEN'
        - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WIKI_TOKEN'
---

#### Executable capability ####
"$[[ inputs.instance ]]:docs-wiki-sync":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.execution-image ]]
    entrypoint: ['']
  tags: $[[ inputs.runner-tags ]]
  variables:
    # Non-root execution images own their build directory: the runner reads the
    # image's uid and gid and chowns it, instead of relying on umask 0000.
    # Without it, a job running as a non-root uid died on .git/objects that a
    # root job had written into the same concurrency slot.
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 'true'
    # wiki-pull.py measures "since the last CI sync" from a marker commit, so the
    # job needs history rather than a shallow checkout.
    GIT_DEPTH: 0
    CI_TPL_WORKING_DIRECTORY: $[[ inputs.working-directory ]]
    # The wiki clone lives outside the checkout so the consumer needs no
    # .gitignore entry and wiki-sync.py cannot mistake it for documentation.
    CI_TPL_WIKI_CLONE: /tmp/wiki-clone
    CI_TPL_RUNTIME_DIR: /tmp/ci-tpl-runtime/docs-wiki-sync
    MKDOCS_CONFIG: $[[ inputs.mkdocs-config ]]
  dependencies: []
  before_script:
    - |
      set -eu
      project_root=$(cd "$CI_PROJECT_DIR" && pwd -P)
      cd "$CI_PROJECT_DIR/$CI_TPL_WORKING_DIRECTORY"
      case "$(pwd -P)" in
        "$project_root"|"$project_root"/*) ;;
        *) echo 'ERROR: working-directory escapes the checkout'; exit 1 ;;
      esac
      cd "$project_root"
    - |
      set -eu
      # BEGIN embed dir $CI_TPL_RUNTIME_DIR runtime/wiki/wiki-deploy.sh runtime/wiki/wiki-pull.py runtime/wiki/wiki-import.py runtime/wiki/wiki-sync.py runtime/wiki/docfilter.py runtime/wiki/requirements.txt
      mkdir -p "$CI_TPL_RUNTIME_DIR" || exit 1
      cat > "$CI_TPL_RUNTIME_DIR/wiki-deploy.sh" <<'CI_TPL_EMBED_EOF' || exit 1
      #!/usr/bin/env bash
      # Two-way sync between docs/ in this repo and the project's GitLab wiki.
      #
      #   usage: runtime/wiki/wiki-deploy.sh DOCS_DIR WIKI_DIR        e.g. runtime/wiki/wiki-deploy.sh docs wiki
      #
      # One cycle:
      #   1. clone the wiki into WIKI_DIR (recreated every run; keep it gitignored)
      #   2. wiki -> repo: wiki-pull.py turns every wiki commit since the last CI sync into a repo
      #      commit by the person who edited the wiki (three-way merge, newer edit wins)
      #   3. push those commits to the docs branch with ci.skip (so the pipeline does not loop),
      #      rebasing onto the branch tip first if someone pushed meanwhile
      #   4. repo -> wiki: wiki-sync.py regenerates the wiki from docs/, committed as the CI author
      #   5. push the wiki
      # If step 5 is rejected because a person edited the wiki while the cycle ran, the whole cycle
      # runs again (bounded), so that edit is pulled too and nothing is overwritten or lost. Step 4
      # never runs before step 3 succeeded, so a wiki edit always lands in the repo first.
      #
      # Identity: this script never uses the caller's ssh keys or the checkout's origin. Everything
      # goes over https with a token, as a pipeline service account would, and git is told never to
      # prompt (GIT_TERMINAL_PROMPT=0). GitLab CI sets the CI_* variables; locally copy
      # .env.example to .env, fill it in, `source .env` (both are gitignored).
      #   WIKI_TOKEN          project (or personal) access token: scope write_repository, role
      #                       Maintainer if the docs branch is protected. Clones and pushes the wiki
      #                       and pushes the repo.
      #   CI_JOB_TOKEN        set by CI; pushes the repo when WIKI_TOKEN is not set
      #   CI_SERVER_FQDN      gitlab host (or GITLAB_HOST)
      #   CI_PROJECT_PATH     group/project (or GITLAB_PROJECT_PATH)
      #   CI_DEFAULT_BRANCH   branch the pulled wiki edits are pushed to (default: main)
      #   CI_AUTHOR_NAME      author of the CI sync commits (default: "<project> ci"), CI_AUTHOR_EMAIL
      #   MKDOCS_CONFIG       mkdocs.yml to read exclude_docs / not_in_nav from (default: mkdocs.yml)
      #   WIKI_URL            override the wiki clone URL (tests use a file:// repo)
      #   REPO_PUSH_URL       override where pulled edits are pushed (tests use a file:// repo)
      #   DRY_RUN=1           clone and report; commit and push nothing
      set -euo pipefail

      log() { printf '%s\n' "$*"; }
      die() { printf 'error: %s\n' "$*" >&2; exit 1; }

      # ---- settings ----------------------------------------------------------------------------
      configure() {
        docs=${1:?usage: wiki-deploy.sh DOCS_DIR WIKI_DIR}
        wiki_dir=${2:?usage: wiki-deploy.sh DOCS_DIR WIKI_DIR}
        scripts=$(cd "$(dirname "$0")" && pwd)
        docs=$(cd "$docs" && pwd)
        # Resolve the repo from the folder above docs/, so a stray docs/.git cannot answer instead.
        repo=$(git -C "$(dirname "$docs")" rev-parse --show-toplevel)
        guard_nested_repo
        host=${CI_SERVER_FQDN:-${GITLAB_HOST:-}}
        project=${CI_PROJECT_PATH:-${GITLAB_PROJECT_PATH:-}}
        branch=${CI_DEFAULT_BRANCH:-main}
        ci_name=${CI_AUTHOR_NAME:-"${project##*/} ci"}
        ci_email=${CI_AUTHOR_EMAIL:-"ci@${host%%:*}"}
        config=${MKDOCS_CONFIG:-$repo/mkdocs.yml}
        dry=${DRY_RUN:-0}
        attempts=${SYNC_ATTEMPTS:-3}

        wiki_url=${WIKI_URL:-}
        push_url=${REPO_PUSH_URL:-}
        if [ -z "$wiki_url" ] || [ -z "$push_url" ]; then
          [ -n "$host" ] && [ -n "$project" ] || die "set CI_SERVER_FQDN/GITLAB_HOST and CI_PROJECT_PATH/GITLAB_PROJECT_PATH (or WIKI_URL and REPO_PUSH_URL)"
        fi
        if [ -z "$wiki_url" ]; then
          [ -n "${WIKI_TOKEN:-}" ] || die "WIKI_TOKEN is required to clone https://$host/$project.wiki.git"
          wiki_url="https://oauth2@$host/$project.wiki.git"
        fi
        if [ -z "$push_url" ]; then
          if [ -n "${WIKI_TOKEN:-}" ]; then
            push_url="https://oauth2@$host/$project.git"
          elif [ -n "${CI_JOB_TOKEN:-}" ]; then
            push_url="https://gitlab-ci-token@$host/$project.git"
          else
            die "no token to push $project with: set WIKI_TOKEN (or run in CI, or REPO_PUSH_URL)"
          fi
        fi
      }

      # A stray docs/.git (seen on reused runner build dirs) would make every git command act on
      # that nested repo instead of this one. In CI it is junk from an earlier job: drop it.
      guard_nested_repo() {
        [ -e "$docs/.git" ] || return 0
        echo "warning: $docs/.git exists (last commit: $(git -C "$docs" log -1 --format='%h %an %s' 2>/dev/null || echo '?'))" >&2
        [ -n "${CI:-}" ] || die "remove $docs/.git first; docs/ must be a plain folder of this repo"
        rm -rf "$docs/.git"
        echo "warning: removed the nested repository (CI build dir)" >&2
      }

      # ---- credentials ---------------------------------------------------------------------------
      # One credential store file, readable only by this process, removed on exit. git picks the
      # entry by host and username, and the username is in each URL above, so the wiki token and the
      # job token never get confused. Nothing secret appears on a command line or in .git/config.
      credentials() {
        export GIT_TERMINAL_PROMPT=0
        export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null   # runner images carry stray config
        umask 077
        cred=$(mktemp)
        trap 'rm -f "$cred"' EXIT
        if [ -n "$host" ]; then
          [ -n "${WIKI_TOKEN:-}" ]   && printf 'https://oauth2:%s@%s\n' "$WIKI_TOKEN" "$host" >> "$cred"
          [ -n "${CI_JOB_TOKEN:-}" ] && printf 'https://gitlab-ci-token:%s@%s\n' "$CI_JOB_TOKEN" "$host" >> "$cred"
        fi
        return 0
      }
      gitc() { git -c "credential.helper=store --file=$cred" "$@"; }

      # ---- the steps -----------------------------------------------------------------------------
      clone_wiki() {
        rm -rf "$wiki_dir"
        gitc clone -q "$wiki_url" "$wiki_dir"
        wiki=$(cd "$wiki_dir" && pwd)
        wiki_branch=$(git -C "$wiki" symbolic-ref --short HEAD 2>/dev/null || echo main)
        local commits; commits=$(git -C "$wiki" rev-list --count HEAD 2>/dev/null || echo 0)
        log "wiki:   $wiki_url ($wiki_branch, $commits commits)"
        log "docs:   $docs on $(git -C "$repo" rev-parse --short HEAD)"
      }

      pull_wiki_edits() {
        git -C "$repo" config user.name  >/dev/null 2>&1 || git -C "$repo" config user.name  "$ci_name"
        git -C "$repo" config user.email >/dev/null 2>&1 || git -C "$repo" config user.email "$ci_email"
        before=$(git -C "$repo" rev-parse HEAD)
        local args=(--ci-author "$ci_name" --ci-email "$ci_email" --repo "$repo")
        [ -f "$config" ] && args+=(--config "$config")
        [ "$dry" = 1 ] && args+=(--dry-run)
        # `|| return 1` is not decoration. cycle() is called from an `if`, so `set -e`
        # is off for everything below it and a function returns the status of its LAST
        # command. Without this, wiki-pull.py could die and `after=$(git rev-parse)`
        # would still succeed, the pull would be skipped and the job would go green:
        # platform/wiki-tpl-flat job 47477 did exactly that, with wiki-pull.py raising
        # FileNotFoundError for the wiki-import.py the embed marker had left out.
        python3 "$scripts/wiki-pull.py" "$docs" "$wiki" ${args[@]+"${args[@]}"} || return 1
        after=$(git -C "$repo" rev-parse HEAD)
      }

      push_repo() {
        [ "$after" != "$before" ] || return 0
        log "pushing $(git -C "$repo" rev-list --count "$before..$after") wiki commit(s) to $branch"
        # ci.skip: the pushed commits are already reflected in the wiki by the sync that follows.
        if ! gitc -C "$repo" push -q -o ci.skip "$push_url" "HEAD:$branch" 2>/dev/null; then
          log "$branch moved while pulling; rebasing the wiki commits onto its tip"
          gitc -C "$repo" fetch -q "$push_url" "$branch" || die "cannot fetch $branch from $push_url"
          git -C "$repo" rebase -q FETCH_HEAD || { git -C "$repo" rebase --abort; die "wiki commits conflict with new commits on $branch; resolve in the repo and re-run"; }
          gitc -C "$repo" push -o ci.skip "$push_url" "HEAD:$branch" || die "push to $branch rejected twice; the wiki is left untouched"
        fi
      }

      sync_wiki() {
        local args=()
        [ -f "$config" ] && args+=(--config "$config")
        # Same reason as pull_wiki_edits: a failed regeneration must not be followed
        # by `git add -A` and a commit of whatever half-written tree it left.
        python3 "$scripts/wiki-sync.py" "$docs" "$wiki" ${args[@]+"${args[@]}"} || return 1
        git -C "$wiki" config user.name  "$ci_name"
        git -C "$wiki" config user.email "$ci_email"
        git -C "$wiki" add -A
        # Current means: the tree already matches docs/ AND the tip is a CI sync commit. A human
        # commit at the tip (an edit already pulled, or a wipe) still needs the marker commit that
        # wiki-pull.py measures "since the last sync" from.
        local tip_author; tip_author=$(git -C "$wiki" log -1 --format='%an <%ae>' 2>/dev/null || true)
        if git -C "$wiki" diff --cached --quiet && [ "$tip_author" = "$ci_name <$ci_email>" ]; then
          log "wiki already current"
          return 0
        fi
        if [ "$dry" = 1 ]; then
          log "dry-run: wiki would change:"
          git -C "$wiki" diff --cached --stat | tail -20
          return 0
        fi
        # --allow-empty: after a pull the wiki may already hold the content, but the CI commit is
        # the marker wiki-pull.py measures "since the last sync" from, so it is written regardless.
        git -C "$wiki" commit -q --allow-empty -m "Sync docs from $(git -C "$repo" rev-parse --short HEAD)"
        wiki_changed=1
      }

      push_wiki() {
        [ "${wiki_changed:-0}" = 1 ] || return 0
        if gitc -C "$wiki" push -q origin "HEAD:$wiki_branch" 2>/dev/null; then
          log "wiki updated from $(git -C "$repo" rev-parse --short HEAD)"
        else
          log "wiki push rejected: the wiki changed while this cycle ran"
          return 1
        fi
      }

      # Called from an `if`, where `set -e` is off, so every step's status is checked by hand:
      # a failed repo push must stop the cycle before the wiki is rewritten.
      cycle() {
        wiki_changed=0
        clone_wiki || return 1
        pull_wiki_edits || return 1
        if [ "$dry" != 1 ]; then push_repo || return 1; fi
        sync_wiki || return 1
        if [ "$dry" != 1 ]; then push_wiki || return 1; fi
      }

      main() {
        configure "$@"
        credentials
        local n
        for n in $(seq 1 "$attempts"); do
          if cycle; then return 0; fi
          log "retrying the whole cycle ($n of $attempts) so the new wiki edit is pulled first"
        done
        die "wiki still changing after $attempts attempts; nothing was overwritten, re-run later"
      }

      main "$@"
      CI_TPL_EMBED_EOF
      chmod +x "$CI_TPL_RUNTIME_DIR/wiki-deploy.sh" || exit 1
      cat > "$CI_TPL_RUNTIME_DIR/wiki-pull.py" <<'CI_TPL_EMBED_EOF' || exit 1
      #!/usr/bin/env python3
      """Bring wiki edits back into docs/ (the wiki -> repo half of the bidirectional sync).

      usage: wiki-pull.py DOCS_DIR WIKI_CLONE [--ci-author NAME] [--dry-run]
                          [--include P]... [--exclude P]... [--config mkdocs.yml]

      wiki-sync.py mirrors docs/ into the wiki and commits as the CI author. Every wiki commit after
      the last CI commit was made by a person in the wiki UI. This script walks those commits, turns
      each changed page back into its docs/ form (the wiki-import.py rules: home.md -> index.md,
      <section>.md beside a <section>/ folder -> <section>/index.md, links back to relative .md) and
      merges it into docs/ three ways with `git merge-file`:

          base   = the page as CI last wrote it (the wiki tree at the last CI commit)
          ours   = the page in docs/ now (may carry repo edits made since that sync)
          theirs = the page in the wiki now

      A clean merge keeps both sides. On conflict the newer edit wins: the wiki commit's author date
      against the repo's last author date for that file. A page deleted in the wiki is deleted from
      docs/ unless the repo edited it after the sync (then the repo copy stays and the next
      wiki-sync restores the wiki page).

      Each wiki commit becomes one repo commit carrying that wiki commit's author name, email and
      date, so attribution follows the person who edited the wiki. Nothing is pushed here; the caller
      (wiki-deploy.sh) pushes. Prints what it did; exit 0 (also when there is nothing to do), 1 on error.

      A wiki with no commits, or with no pages left after the human commits (everything deleted in
      the UI, or an empty branch force-pushed), is a reset: nothing is pulled and nothing is deleted
      from docs/; the caller reseeds the wiki from docs/. Deleting one page still propagates.
      """
      import argparse
      import importlib.util
      import json
      import os
      import re
      import subprocess
      import sys
      import tempfile
      from datetime import datetime
      from pathlib import Path

      sys.path.insert(0, str(Path(__file__).resolve().parent))
      import docfilter  # noqa: E402


      def load(name):
          spec = importlib.util.spec_from_file_location(name.replace("-", "_"), Path(__file__).resolve().parent / f"{name}.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          return mod


      wiki_import = load("wiki-import")

      CI_AUTHOR = "docs-site ci"
      CI_EMAIL = ""   # empty: match on the name alone
      DOCS_MAP = ".gitlab/docs-map.json"   # written by wiki-sync.py: wiki page -> docs file
      EMPTY_TREE = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
      EPOCH = "1970-01-01T00:00:00+00:00"
      INDEX = "index.md"


      def git(repo, *args, env=None):
          # List form, no shell: every argument reaches git as one argv element, so a path or a
          # commit subject with shell characters cannot become a command. Inputs are repo paths
          # and git's own output; none come from the network.
          result = subprocess.run(["git", "-C", str(repo), *args], capture_output=True, text=True, env=env, shell=False)
          if result.returncode:
              raise SystemExit(f"git {' '.join(args)} failed in {repo}:\n{result.stderr}")
          return result.stdout


      def has_commits(repo):
          return subprocess.run(["git", "-C", str(repo), "rev-parse", "--verify", "-q", "HEAD"], capture_output=True).returncode == 0


      def page_count(wiki):
          """Markdown pages in the wiki checkout, ignoring _sidebar.md and hidden paths."""
          return sum(1 for p in wiki.rglob("*.md") if not p.name.startswith("_") and not any(x.startswith(".") for x in p.relative_to(wiki).parts))


      def show(repo, rev, path):
          """File bytes at rev, or None if it does not exist there."""
          result = subprocess.run(["git", "-C", str(repo), "show", f"{rev}:{path}"], capture_output=True)
          return result.stdout if result.returncode == 0 else None


      def when(iso):
          return datetime.fromisoformat(iso.replace("Z", "+00:00"))


      def last_ci_commit(wiki, ci_author, ci_email=CI_EMAIL):
          """(hash, committer date) of the newest CI commit in the wiki; the empty tree if there is none.

          A person can pick the CI's display name in GitLab, so the email is matched too when known.
          """
          if not has_commits(wiki):
              return EMPTY_TREE, EPOCH
          # --author matches "Name <email>" as a regex; anchor both ends so "ci" cannot match "cindy".
          pattern = f"^{re.escape(ci_author)} <{re.escape(ci_email)}>$" if ci_email else f"^{re.escape(ci_author)} <"
          out = git(wiki, "log", "-1", "--format=%H%x00%cI", f"--author={pattern}", "--perl-regexp").strip()
          return tuple(out.split("\x00")) if out else (EMPTY_TREE, EPOCH)


      def human_commits(wiki, base):
          """(hash, name, email, author date, subject) for every wiki commit after base, oldest first."""
          rng = "HEAD" if base == EMPTY_TREE else f"{base}..HEAD"
          out = git(wiki, "log", "--reverse", "--format=%H%x00%an%x00%ae%x00%aI%x00%s", rng)
          return [tuple(line.split("\x00")) for line in out.splitlines() if line]


      def changed_files(wiki, commit):
          """(status, path, old_path) per file in one wiki commit. A rename git can pair by content
          (-M25%) comes through as ("R", new, old); everything else has old_path None."""
          # core.quotePath=false: otherwise a non-ASCII page name comes back octal-escaped in quotes
          out = git(wiki, "-c", "core.quotePath=false", "show", "--name-status", "--format=", "-M25%", commit)
          rows = []
          for line in out.splitlines():
              if not line:
                  continue
              parts = line.split("\t")
              if parts[0].startswith("R"):
                  rows.append(("R", parts[2], parts[1]))
              else:
                  rows.append((parts[0], parts[1], None))
          return rows


      def docs_map_at(wiki, rev):
          """The wiki page -> docs file record as CI last wrote it; empty when absent or unreadable."""
          raw = show(wiki, rev, DOCS_MAP)
          if raw is None:
              return {}
          try:
              return dict(json.loads(raw.decode()).get("pages", {}))
          except (ValueError, AttributeError):
              return {}


      def merge_file(base, ours, theirs, label):
          """Three-way merge; returns (text, clean)."""
          with tempfile.TemporaryDirectory() as tmp:
              paths = []
              for name, text in (("ours", ours), ("base", base or ""), ("theirs", theirs)):
                  p = Path(tmp) / name
                  p.write_text(text)
                  paths.append(str(p))
              result = subprocess.run(["git", "merge-file", "-p", "-L", "repo", "-L", "last-sync", "-L", label, *paths],
                                      capture_output=True, text=True)
              return result.stdout, result.returncode == 0


      class Puller:
          def __init__(self, repo, docs, wiki, flt, ci_author, ci_email, dry_run):
              self.repo, self.docs, self.wiki, self.flt = repo, docs, wiki, flt
              self.ci_author, self.dry_run = ci_author, dry_run
              self.base, self.base_date = last_ci_commit(wiki, ci_author, ci_email)
              self.docs_map = docs_map_at(wiki, self.base)   # recorded relationships, the authority
              self.pulled = 0
              self.pulled_paths = set()   # written by this run: a later delete in the same batch is not a repo edit
              self.claimed = {}           # docs path -> wiki page that wrote it this run (two claimants = refuse)

          # --- repo side helpers ---------------------------------------------------------------
          def repo_rel(self, dest):
              return str(self.docs.relative_to(self.repo) / dest)

          def repo_edited_since_sync(self, dest):
              """Did the repo change this file after CI last synced, other than through this run's own pulls?"""
              if dest in self.pulled_paths:
                  return False
              # Strictly after the CI commit: the repo commit CI synced from can share its second.
              out = git(self.repo, "log", "-1", "--format=%cI", "--", self.repo_rel(dest)).strip()
              return bool(out) and when(out) > when(self.base_date)

          def repo_last_edit(self, dest):
              out = git(self.repo, "log", "-1", "--format=%aI", "--", self.repo_rel(dest)).strip()
              return when(out) if out else when(EPOCH)

          def dest_for(self, rel):
              """docs/ path for a wiki page. `rel` is a wiki-relative Path from changed_files (git's own
              listing), never user input.

              Recorded first: a page CI wrote is in .gitlab/docs-map.json and maps back exactly, at any
              depth, whatever the folders look like. Only a page born in the wiki UI falls to the rule:
              it is a section index when the section exists on either side (a wiki folder of that name,
              or a docs folder of that name, which may hold only .pages or attachments the wiki never
              sees), else a plain page. home.md is always index.md. A docs page X.md beside a folder X/
              with its own index.md cannot occur: wiki-sync.py refuses to write such a tree."""
              if str(rel) in self.docs_map:
                  return Path(self.docs_map[str(rel)])
              if str(rel) == "home.md":
                  return Path(INDEX)
              section = rel.parent / rel.stem
              if (self.docs / section).is_dir() or (self.wiki / section).is_dir():
                  return section / INDEX
              return rel

          def claim(self, dest, rel):
              """Two wiki pages may not land on one docs file in a run: a copy made in the UI onto a
              path whose rule already points at a mapped file. Refusing leaves both wiki pages in
              place (the caller stops before the wiki is rewritten) and puts the decision on a person."""
              other = self.claimed.get(dest)
              if other is not None and other != rel:
                  raise SystemExit(f"wiki pages {other} and {rel} both map to docs/{dest}; rename one in the wiki")
              self.claimed[dest] = rel

          def convert(self, text, rel):
              """Wiki page text -> (docs-relative path, docs-form text)."""
              dest = self.dest_for(rel)
              unresolved = []
              out = wiki_import.rewrite(text, self.wiki / rel, self.wiki, dest, unresolved, self.flt)
              for u in unresolved:
                  print(f"  unresolved link left as-is: {u}")
              return dest, out

          def docs_file_for(self, rel):
              """Where a (possibly deleted) wiki page lives in docs/, or None. The section may be gone
              with the page, so both mappings are tried: the section index, then the plain path."""
              candidates = [self.dest_for(rel), rel.parent / rel.stem / INDEX, rel]
              return next((c for c in candidates if (self.docs / c).exists()), None)

          # --- one wiki commit -------------------------------------------------------------------
          def run(self):
              """Apply every human wiki commit since the last sync; a wiped wiki is a reset, not a mass delete."""
              if not has_commits(self.wiki):
                  print("wiki is empty (no commits): nothing to pull, it will be seeded from docs/")
                  return
              commits = human_commits(self.wiki, self.base)
              if not commits:
                  print("wiki has no edits since the last sync")
                  return
              if page_count(self.wiki) == 0:
                  print(f"wiki holds no pages after {len(commits)} commit(s): treating it as wiped, "
                        "nothing is pulled or deleted, it will be reseeded from docs/")
                  return
              for commit in commits:
                  self.apply(*commit)
              print(f"{self.pulled} file(s) pulled from {len(commits)} wiki commit(s)")

          def apply(self, chash, name, email, date, subject):
              touched = []
              for status, path, old_path in changed_files(self.wiki, chash):
                  rel = Path(path)
                  if rel.name.startswith("_") or any(p.startswith(".") for p in rel.parts) or not self.flt.allows(rel):
                      continue  # _sidebar.md, GitLab's .gitlab/ files and excluded paths are wiki furniture
                  if status == "R":
                      touched.extend(self.pull_rename(Path(old_path), rel, chash))
                      continue
                  dest = self.pull_page(status, rel, chash, when(date), name) if rel.suffix == ".md" \
                      else self.pull_attachment(status, rel, chash)
                  if dest:
                      touched.append(dest)
              if not touched:
                  return
              self.pulled += len(touched)
              self.pulled_paths.update(touched)
              if self.dry_run:
                  print(f"dry-run: would commit {len(touched)} file(s) as {name} <{email}>: {subject}")
                  return
              git(self.repo, "add", "-A", "--", *[self.repo_rel(t) for t in touched])
              env = dict(os.environ, GIT_AUTHOR_NAME=name, GIT_AUTHOR_EMAIL=email, GIT_AUTHOR_DATE=date)
              git(self.repo, "commit", "-q", "-m", f"wiki: {subject}\n\nPulled from wiki commit {chash[:8]} by {name}.", env=env)
              print(f"committed {len(touched)} file(s) as {name} <{email}>: {subject}")

          def pull_rename(self, old, new, chash):
              """A page renamed in the wiki: move its docs file (history follows) and write the new
              content there. The old page's docs file is the recorded one; the new path is unrecorded
              by definition, so it follows the rule."""
              source = self.docs_file_for(old)
              touched = []
              if new.suffix != ".md":
                  touched += [d for d in (self.pull_attachment("D", old, chash), self.pull_attachment("A", new, chash)) if d]
                  return touched
              dest, theirs = self.convert(show(self.wiki, chash, str(new)).decode(), new)
              self.claim(dest, new)
              print(f"rename {old} -> {new}: docs {source} -> {dest}")
              if not self.dry_run:
                  (self.docs / dest).parent.mkdir(parents=True, exist_ok=True)
                  if source and source != dest:
                      git(self.repo, "mv", "-k", self.repo_rel(source), self.repo_rel(dest))
                  (self.docs / dest).write_text(theirs)
              # the old path is already staged by git mv (and gone from disk), so only dest is re-added
              touched.append(dest)
              return touched

          def pull_page(self, status, rel, chash, date, who):
              if status == "D":
                  return self.delete_page(rel, who)
              dest, theirs = self.convert(show(self.wiki, chash, str(rel)).decode(), rel)
              self.claim(dest, rel)
              target = self.docs / dest
              ours = target.read_text() if target.exists() else None
              base_wiki = show(self.wiki, self.base, str(rel))
              base = self.convert(base_wiki.decode(), rel)[1] if base_wiki is not None else None
              outcome = self.reconcile(dest, base, ours, theirs, date, who)
              if outcome is None:
                  return None
              merged, how = outcome
              print(f"pull   {rel} -> {dest} ({how})")
              if not self.dry_run:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(merged)
              return dest

          def reconcile(self, dest, base, ours, theirs, date, who):
              """(text to write, how) for one page, or None when docs/ should stay as it is."""
              if ours == theirs:
                  return None
              if ours is None:
                  if base is not None and self.repo_last_edit(dest) > date:
                      print(f"keep   {dest}: deleted in repo after the wiki edit, repo wins")
                      return None
                  return theirs, "new" if base is None else "restored, wiki edit is newer than the repo delete"
              if base == ours:
                  return theirs, "fast-forward"
              merged, clean = merge_file(base, ours, theirs, f"wiki ({who})")
              if clean:
                  return merged, "merged with repo edits"
              if date >= self.repo_last_edit(dest):
                  return theirs, "conflict, wiki edit is newer, wiki wins"
              print(f"keep   {dest}: conflict, repo edit is newer, repo wins")
              return None

          def delete_page(self, rel, who):
              dest = self.docs_file_for(rel)
              if dest is None:
                  return None
              if self.repo_edited_since_sync(dest):
                  print(f"keep   {dest}: deleted in wiki but edited in repo since the sync")
                  return None
              print(f"delete {dest} (removed in wiki by {who})")
              if not self.dry_run:
                  (self.docs / dest).unlink()
              return dest

          def pull_attachment(self, status, rel, chash):
              target = self.docs / rel
              if status == "D":
                  if not target.exists():
                      return None
                  print(f"delete {rel}")
                  if not self.dry_run:
                      target.unlink()
                  return rel
              data = show(self.wiki, chash, str(rel))
              if target.exists() and target.read_bytes() == data:
                  return None
              print(f"pull   {rel} (attachment)")
              if not self.dry_run:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              return rel


      def main(docs, wiki, flt=None, ci_author=CI_AUTHOR, dry_run=False, repo=None, ci_email=CI_EMAIL):
          flt = flt or docfilter.Filter()
          if not (wiki / ".git").exists():
              raise SystemExit(f"{wiki} is not a git clone of the wiki")
          if (docs / ".git").exists():
              raise SystemExit(f"{docs}/.git exists: docs/ must be a plain folder of the repo, not a nested repository")
          repo = Path(repo or git(docs.parent, "rev-parse", "--show-toplevel").strip()).resolve()
          Puller(repo, docs.resolve(), wiki.resolve(), flt, ci_author, ci_email, dry_run).run()
          return 0


      def cli(argv=None):
          parser = argparse.ArgumentParser(description=__doc__.split("\n\n")[0])
          parser.add_argument("docs", type=Path)
          parser.add_argument("wiki", type=Path)
          parser.add_argument("--ci-author", default=CI_AUTHOR, help="author name wiki-sync.py commits as")
          parser.add_argument("--ci-email", default=CI_EMAIL, help="its email; when given, both must match")
          parser.add_argument("--repo", type=Path, help="repo to commit into (default: the one containing DOCS_DIR)")
          parser.add_argument("--dry-run", action="store_true", help="report, change nothing")
          docfilter.add_arguments(parser)
          args = parser.parse_args(argv)
          sys.exit(main(args.docs.resolve(), args.wiki.resolve(), docfilter.from_args(args), args.ci_author, args.dry_run,
                        args.repo, args.ci_email))


      if __name__ == "__main__":
          cli()
