      #!/usr/bin/env python3
      """One-time import of an existing GitLab wiki into a docs/ tree that wiki-sync.py can mirror back.

      usage: wiki-import.py WIKI_CLONE DOCS_DIR [--include P]... [--exclude P]... [--config mkdocs.yml]

      Takes a clone of <project>.wiki.git (root pages as <name>.md, child pages under <name>/,
      attachments under uploads/) and writes:

          docs/index.md                      from home.md (or generated: a list of the top level)
          docs/<name>/index.md               from each root page <name>.md that has children
          docs/<name>.md                     from each root page without children
          docs/<name>/<child>.md             unchanged path
          docs/uploads/...                   attachments, unchanged path (anywhere; nested ones too)

      Folders that hold pages but no landing page get a generated index.md listing them, so a wiki
      made of root folders only (operations/, engineering/) gets section pages and a home page.
      Generated pages are ordinary files; edit them afterwards.

      Links are rewritten to relative Markdown links with the .md extension, the style that renders
      in GitLab's file view, in MkDocs and (after wiki-sync.py rewrites them back) in the wiki.
      Wiki links come in several forms; each target is tried against the wiki root first (how GitLab
      resolves them) and then against the page's own directory, with and without .md. Unresolvable
      links are left as they are and listed at the end so you can fix them by hand.

      --include / --exclude apply to wiki paths (gitignore-style, see docfilter.py); a link to an
      excluded page is reported as unresolved rather than rewritten.
      """
      import argparse
      import os
      import re
      import shutil
      import sys
      import urllib.parse
      from pathlib import Path

      sys.path.insert(0, str(Path(__file__).resolve().parent))
      import docfilter  # noqa: E402

      LINK = re.compile(r"(\]\()([^)#\s]+?)(#[^)]*)?(\))")


      def link_quote(path: str) -> str:
          """Percent-encode only what breaks a Markdown link target; unicode names stay readable."""
          return re.sub(r"[ %#?]", lambda m: urllib.parse.quote(m.group()), path)
      INDEX = "index.md"


      def is_page(p: Path) -> bool:
          return p.suffix == ".md" and not p.name.startswith("_")


      def new_location(rel: Path, wiki: Path) -> Path:
          """Where a wiki page lands in docs/: the exact inverse of wiki-sync.py's wiki_path.

          home.md -> index.md; a page beside a folder of the same name, at any depth
          (compute/kubernetes.md beside compute/kubernetes/), is that section's index.md.
          """
          if str(rel) == "home.md":
              return Path(INDEX)
          if (wiki / rel.parent / rel.stem).is_dir():
              return rel.parent / rel.stem / INDEX
          return rel


      def resolve_target(target: str, page: Path, wiki: Path, flt: docfilter.Filter):
          """Return the wiki-relative path of a link target, or None.

          GitLab resolves `./x`, `../x` and anything ending in .md against the page's own directory,
          and a bare `x` or `/x` against the wiki root. Try it that way round first, then the other,
          so a sibling and a root page with the same name are told apart the way the UI does.
          """
          target = urllib.parse.unquote(target)
          stripped = target.lstrip("/")
          page_dir_first = target.startswith(("./", "../")) or target.endswith(".md")
          bases = (page.parent, wiki) if page_dir_first else (wiki, page.parent)
          for base in bases:
              for name in (stripped, stripped + ".md", target, target + ".md"):
                  candidate = base / name
                  try:
                      rel = candidate.resolve().relative_to(wiki.resolve())
                  except ValueError:
                      continue
                  if candidate.is_file() and flt.allows(rel):
                      return rel
          return None


      def rewrite(text: str, page: Path, wiki: Path, dest: Path, unresolved: list, flt: docfilter.Filter) -> str:
          def sub(m):
              target = m.group(2)
              if "://" in target or target.startswith(("mailto:", "/uploads/")):
                  return m.group(0)   # /uploads/ is the project's upload area, not the wiki's
              found = resolve_target(target, page, wiki, flt)
              if found is None:
                  unresolved.append(f"{page.relative_to(wiki)}: {target}")
                  return m.group(0)
              new_target = new_location(found, wiki) if is_page(found) else found
              rel = link_quote(os.path.relpath(new_target, dest.parent))
              return f"{m.group(1)}{rel}{m.group(3) or ''}{m.group(4)}"

          return LINK.sub(sub, text)


      def import_page(src: Path, wiki: Path, docs: Path, unresolved: list, flt: docfilter.Filter) -> None:
          dest = new_location(src.relative_to(wiki), wiki)
          out = docs / dest
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(rewrite(src.read_text(), src, wiki, dest, unresolved, flt))


      def copy_attachment(src: Path, wiki: Path, docs: Path) -> None:
          out = docs / src.relative_to(wiki)
          out.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, out)


      def title_of(md: Path) -> str:
          for line in md.read_text().splitlines():
              if line.startswith("# "):
                  return line[2:].strip()
          return md.stem.replace("-", " ")


      def listing(title: str, folder: Path) -> str:
          """A Markdown page linking every page and section directly under folder."""
          lines = [f"# {title}", ""]
          for p in sorted(folder.iterdir()):
              if p.suffix == ".md" and p.name != INDEX:
                  lines.append(f"- [{title_of(p)}]({p.name})")
              elif p.is_dir() and (p / INDEX).exists():
                  lines.append(f"- [{title_of(p / INDEX)}]({p.name}/{INDEX})")
          return "\n".join(lines) + "\n"


      def write_missing_indexes(docs: Path) -> int:
          """Give every folder that holds pages but no index.md a generated landing page, deepest first,
          so a wiki made of root folders (no root pages) still gets section pages and a home page."""
          made = 0
          folders = sorted({p.parent for p in docs.rglob("*.md")} | {docs}, key=lambda d: -len(d.parts))
          for folder in folders:
              if not (folder / INDEX).exists():
                  title = "Home" if folder == docs else folder.name.replace("-", " ")
                  (folder / INDEX).write_text(listing(title, folder))
                  made += 1
          return made


      def main(wiki: Path, docs: Path, flt: docfilter.Filter = None) -> None:
          flt = flt or docfilter.Filter()
          docs.mkdir(parents=True, exist_ok=True)
          unresolved, pages, files = [], 0, 0
          for src in sorted(wiki.rglob("*")):
              if not src.is_file() or ".git" in src.parts or not flt.allows(src.relative_to(wiki)):
                  continue
              if src.suffix != ".md":
                  copy_attachment(src, wiki, docs)
                  files += 1
              elif is_page(src):  # _sidebar.md and templates/ are wiki furniture; wiki-sync regenerates them
                  import_page(src, wiki, docs, unresolved, flt)
                  pages += 1
          generated = write_missing_indexes(docs)
          print(f"imported {pages} pages, {files} attachments into {docs}, generated {generated} index pages")
          if unresolved:
              print(f"{len(unresolved)} links could not be resolved (left unchanged):")
              for u in unresolved:
                  print("  " + u)


      def cli(argv=None) -> None:
          parser = argparse.ArgumentParser(description=__doc__.split("\n\n")[0])
          parser.add_argument("wiki", type=Path)
          parser.add_argument("docs", type=Path)
          docfilter.add_arguments(parser)
          args = parser.parse_args(argv)
          main(args.wiki.resolve(), args.docs.resolve(), docfilter.from_args(args))


      if __name__ == "__main__":
          cli()
      CI_TPL_EMBED_EOF
      cat > "$CI_TPL_RUNTIME_DIR/wiki-sync.py" <<'CI_TPL_EMBED_EOF' || exit 1
      #!/usr/bin/env python3
      """Mirror a docs/ tree into a GitLab wiki checkout and write _sidebar.md from the .pages nav.

      usage: wiki-sync.py DOCS_DIR WIKI_DIR [--include P]... [--exclude P]... [--config mkdocs.yml]

      - docs/index.md becomes home.md (the wiki front page); section/index.md becomes section.md
        so the wiki titles the page "section" instead of "index"; every other page keeps its path.
      - Page links are relative to the page's own directory and carry no extension: `./other`,
        `../dir/page`, `../home`. GitLab renders those as wiki pages from any depth; a link that
        ends in .md is served as the raw file instead, and a bare sibling (`other`, no ./) is
        resolved from the wiki root. Attachment links keep their extension (`../uploads/x/f.png`).
        The two relocated pages (index.md -> home.md, section/index.md -> section.md) get their
        relative paths recomputed.
      - _sidebar.md links are root-absolute (`/section/page`): the sidebar renders on every page,
        so a relative link there would mean something different on each.
      - Attachments are copied across; pages and attachments no longer in docs/ are deleted.
      - .gitlab/docs-map.json records, for every page written, which docs/ file it came from, so the
        reverse direction (wiki-pull.py) never has to infer where an edited page belongs. GitLab's own
        .gitlab/redirects.yml in the same folder is left alone.
      - Sidebar order follows each folder's .pages `nav` list (awesome-pages format); `...`
        expands to the remaining pages, sorted. Folders without .pages are listed alphabetically.
      - Filtering follows MkDocs: --exclude and exclude_docs skip paths entirely, --include keeps
        only matches, not_in_nav keeps the page but drops it from the sidebar (see docfilter.py).
      """
      import argparse
      import json
      import os
      import re
      import urllib.parse
      import shutil
      import sys
      from pathlib import Path

      import yaml

      sys.path.insert(0, str(Path(__file__).resolve().parent))
      import docfilter  # noqa: E402

      LINK = re.compile(r"(\]\()([^)#\s]+?)(#[^)]*)?(\))")


      def link_quote(path: str) -> str:
          """Percent-encode only what breaks a Markdown link target; unicode names stay readable."""
          return re.sub(r"[ %#?]", lambda m: urllib.parse.quote(m.group()), path)
      INDEX = "index.md"
      PAGES = ".pages"
      REST = "..."
      DOCS_MAP = Path(".gitlab/docs-map.json")   # wiki page -> docs file, written by every sync


      def title_of(md: Path) -> str:
          for line in md.read_text().splitlines():
              if line.startswith("# "):
                  return line[2:].strip()
          return md.stem.replace("-", " ").title()


      def wiki_path(rel: Path) -> str:
          if str(rel) == INDEX:
              return "home"
          if rel.name == INDEX:
              return str(rel.parent)
          return str(rel.with_suffix(""))


      def wiki_file(rel: Path) -> Path:
          """Where a docs file lands in the wiki clone (pages move for home and section indexes)."""
          return Path(wiki_path(rel) + ".md") if rel.suffix == ".md" else rel


      def page_relative(target: str) -> str:
          """GitLab resolves a bare target from the wiki ROOT, `./x` from the page's own folder, so every
          link this script writes needs the `./`. It matters for anything at or below the page's folder:
          a section link `deep/` from compute/nodes.md relpaths to `deep`, which the wiki reads as the
          root page `deep`. Attachments take the same rule."""
          return target if target.startswith(("./", "../")) else "./" + target


      def page_link(rel: Path, wiki_dir: Path) -> str:
          """Wiki page link from a page in wiki_dir: page-dir relative, no extension, ./ on siblings."""
          return page_relative(os.path.relpath(wiki_file(rel), wiki_dir)[:-len(".md")])


      def rewrite_links(text: str, page: Path, root: Path, flt: docfilter.Filter) -> str:
          """Re-point every resolvable relative link so it is relative to the page's wiki location."""
          page_rel = page.relative_to(root)
          wiki_dir = wiki_file(page_rel).parent

          def sub(m):
              target = m.group(2)
              if "://" in target or target.startswith(("mailto:", "/")):
                  return m.group(0)
              resolved = (page.parent / urllib.parse.unquote(target)).resolve()   # "my%20notes.md" is a file with a space
              try:
                  rel = resolved.relative_to(root.resolve())
              except ValueError:
                  return m.group(0)  # points outside docs/; leave it
              if not resolved.exists() or not flt.allows(rel):
                  return m.group(0)
              new = link_quote(page_link(rel, wiki_dir) if rel.suffix == ".md"
                               else page_relative(os.path.relpath(rel, wiki_dir)))
              return f"{m.group(1)}{new}{m.group(3) or ''}{m.group(4)}"

          return LINK.sub(sub, text)


      def pages_spec(folder: Path) -> dict:
          spec_file = folder / PAGES
          return (yaml.safe_load(spec_file.read_text()) if spec_file.exists() else None) or {}


      def nav_items(folder: Path) -> list:
          """(title_or_None, path) per .pages nav entry, with the string REST kept as a marker."""
          items = []
          for item in pages_spec(folder).get("nav") or [REST]:
              if item == REST:
                  items.append(REST)
              else:
                  title, target = next(iter(item.items())) if isinstance(item, dict) else (None, item)
                  items.append((title, folder / target))
          return items


      def unlisted(folder: Path, listed: set) -> list:
          """Pages and page-bearing folders not named in .pages, sorted, for the REST marker."""
          return sorted(
              p for p in folder.iterdir()
              if p not in listed and not p.name.startswith(".")
              and (p.suffix == ".md" or (p.is_dir() and any(p.rglob("*.md"))))
          )


      def nav_entries(folder: Path, root: Path, flt: docfilter.Filter) -> list:
          """(title, wiki_link_or_None, children) in .pages order for one folder."""
          items = nav_items(folder)
          rest = unlisted(folder, {path for item in items if item != REST for _, path in [item]})
          entries = []
          for item in items:
              for title, path in ([(None, p) for p in rest] if item == REST else [item]):
                  entry = resolve(title, path, root, flt)
                  if entry:
                      entries.append(entry)
          return entries


      def resolve(title, path: Path, root: Path, flt: docfilter.Filter):
          rel = path.relative_to(root)
          if not path.exists() or not flt.allows(rel) or not flt.in_nav(rel):
              return None
          if path.is_dir():
              index = path / INDEX
              fallback = title_of(index) if index.exists() else path.name.replace("-", " ").title()
              title = title or pages_spec(path).get("title") or fallback
              link = wiki_path(index.relative_to(root)) if index.exists() else None
              children = [c for c in nav_entries(path, root, flt) if c[1] != link]
              return (title, link, children) if link or children else None
          if path.suffix == ".md":
              return (title or title_of(path), wiki_path(rel), [])
          return None


      def render(entries, depth=0) -> list:
          lines = []
          for title, link, children in entries:
              # root-absolute: the sidebar shows on every page. Quoted like any other link: a page name
              # with a space is not a link at all to a strict Markdown reader of the wiki checkout.
              label = f"[{title}](/{link_quote(link)})" if link else title
              lines.append("  " * depth + f"- {label}")
              lines.extend(render(children, depth + 1))
          return lines


      def clear(wiki: Path) -> None:
          """Remove every synced file, then any directories left empty. .git and GitLab's own .gitlab/
          (redirects.yml, written when a page is renamed in the UI) are kept; the map is rewritten."""
          keep = {".git", ".gitlab"}
          for old in wiki.rglob("*"):
              if not keep & set(old.parts) and old.is_file():
                  old.unlink()
          for empty in sorted((d for d in wiki.rglob("*") if d.is_dir() and not keep & set(d.parts)), reverse=True):
              if not any(empty.iterdir()):
                  empty.rmdir()


      def check_collisions(docs: Path, flt: docfilter.Filter) -> None:
          """Two docs pages may not land on one wiki page (a/b.md next to a/b/index.md would)."""
          seen = {}
          for src in sorted(docs.rglob("*.md")):
              rel = src.relative_to(docs)
              if any(part.startswith(".") for part in rel.parts) or not flt.allows(rel):
                  continue
              target = wiki_path(rel)
              if target in seen:
                  raise SystemExit(f"{rel} and {seen[target]} would both become wiki page {target}: rename one")
              seen[target] = rel


      def copy_tree(docs: Path, wiki: Path, flt: docfilter.Filter) -> tuple:
          """Write pages (renamed, links rewritten) and copy attachments. Returns (pages, attachments)."""
          check_collisions(docs, flt)
          pages = attachments = 0
          docs_map = {}
          for src in docs.rglob("*"):
              rel = src.relative_to(docs)
              # Hidden files AND hidden directories are skipped: .pages, .git, .cache, tool caches.
              # Copying a stray docs/.git or docs/.cache into the wiki clone would corrupt it.
              if not src.is_file() or any(part.startswith(".") for part in rel.parts) or not flt.allows(rel):
                  continue
              if src.suffix == ".md":
                  dst = wiki / wiki_file(rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  # bytes in, bytes out: read_text() would turn CRLF pages into LF ones
                  dst.write_bytes(rewrite_links(src.read_bytes().decode(), src, docs, flt).encode())
                  docs_map[str(wiki_file(rel))] = str(rel)
                  pages += 1
              else:
                  dst = wiki / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  attachments += 1
          write_docs_map(wiki, docs_map)
          return pages, attachments


      def write_docs_map(wiki: Path, pages: dict) -> None:
          """The relationship record: which docs/ file each wiki page was written from."""
          (wiki / DOCS_MAP).parent.mkdir(parents=True, exist_ok=True)
          (wiki / DOCS_MAP).write_text(json.dumps({"version": 1, "pages": dict(sorted(pages.items()))}, indent=1) + "\n")


      def sidebar(docs: Path, flt: docfilter.Filter) -> list:
          home = docs / INDEX
          title = (title_of(home) if home.exists() else "") or "Home"
          entries = [e for e in nav_entries(docs, docs, flt) if e[1] != "home"]  # the header link already covers it
          return [f"**[{title}](/home)**", ""] + render(entries)


      def main(docs: Path, wiki: Path, flt: docfilter.Filter = None) -> None:
          flt = flt or docfilter.Filter()
          clear(wiki)
          pages, attachments = copy_tree(docs, wiki, flt)
          lines = sidebar(docs, flt)
          (wiki / "_sidebar.md").write_text("\n".join(lines) + "\n")
          print(f"synced {pages} pages, {attachments} attachments, sidebar {len(lines) - 2} lines")


      def cli(argv=None) -> None:
          parser = argparse.ArgumentParser(description=__doc__.split("\n\n")[0])
          parser.add_argument("docs", type=Path)
          parser.add_argument("wiki", type=Path)
          docfilter.add_arguments(parser)
          args = parser.parse_args(argv)
          main(args.docs.resolve(), args.wiki.resolve(), docfilter.from_args(args))


      if __name__ == "__main__":
          cli()
