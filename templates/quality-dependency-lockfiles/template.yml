#### Public interface ####
spec:
  inputs:
    instance:
      type: string
      description: Unique workload instance used in the job name.
      regex: '^[a-z][a-z0-9-]{0,47}$'
    stage:
      type: string
      description: Stage supplied by the owning composition.
      default: verify
    working-directory:
      type: string
      description: Root the declared lockfile paths are relative to.
      default: '.'
    execution-image:
      type: string
      description: >-
        Approved base image pinned by digest. The default is the estate mirror
        of alpine:3.20; the check needs a POSIX shell and nothing else.
      regex: '^.+@sha256:[0-9a-f]{64}$'
      default: 'docker.io/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
    runner-tags:
      type: array
      description: Runner selection from the estate profile.
      default: []
    max-retries:
      type: number
      description: >-
        How many times the runner may retry this job. The condition is
        runner_system_failure only, so this retries infrastructure and never a
        failed gate.
      default: 1
      options: [0, 1, 2]
    run-rules:
      type: array
      description: Job eligibility set by the composition.
      default:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    lockfiles:
      type: string
      description: >-
        Every lockfile that must exist, comma separated, each relative to
        working-directory: for example
        `services/api/package-lock.json,services/worker/poetry.lock`. Required,
        with no default, because the check this replaces inferred the languages
        from the checkout root and therefore reported a monorepo with
        services/api/package.json as having no Node project at all. Declaring
        the set is what makes a missing root visible. A requirements-style file
        is additionally checked line by line: every requirement must be pinned,
        not merely one of them.

        The literal `none` is the one value that is not a path. It declares that
        the project has no lockfile, which a project with no third-party
        dependencies genuinely does not: a stdlib-only Go module commits an
        empty go.sum. It records `"declared": "none"` in the evidence and
        passes. It cannot be combined with a path, and an empty value is still
        an error -- an input nobody filled in must not read the same as one
        saying there is nothing to fill in.
---

#### Executable capability ####
"$[[ inputs.instance ]]:quality-dependency-lockfiles":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.execution-image ]]
    entrypoint: ['']
  tags: $[[ inputs.runner-tags ]]
  variables:
    # Non-root execution images own their build directory: the runner reads the
    # image's uid and gid and chowns it, instead of relying on umask 0000.
    # Without it, a job running as a non-root uid died on .git/objects that a
    # root job had written into the same concurrency slot.
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 'true'
    CI_TPL_WORKING_DIRECTORY: $[[ inputs.working-directory ]]
    CI_TPL_ARTIFACT_DIR: '.ci-artifacts/$[[ inputs.instance ]]/quality-dependency-lockfiles'
    CI_TPL_LOCKFILES: $[[ inputs.lockfiles ]]
  dependencies: []
  before_script:
    - |
      project_root=$(cd "$CI_PROJECT_DIR" && pwd -P)
      cd "$CI_PROJECT_DIR/$CI_TPL_WORKING_DIRECTORY"
      case "$(pwd -P)" in
        "$project_root"|"$project_root"/*) ;;
        *) echo 'ERROR: working-directory escapes the checkout'; exit 1 ;;
      esac
      mkdir -p "$CI_PROJECT_DIR/.ci-tpl" "$CI_PROJECT_DIR/$CI_TPL_ARTIFACT_DIR"
    - |
      # BEGIN embed dir $CI_PROJECT_DIR/.ci-tpl runtime/scan/lockfiles.sh
      mkdir -p "$CI_PROJECT_DIR/.ci-tpl" || exit 1
      cat > "$CI_PROJECT_DIR/.ci-tpl/lockfiles.sh" <<'CI_TPL_EMBED_EOF' || exit 1
      #!/bin/sh
      # Declared-lockfile validator for quality-dependency-lockfiles.
      #
      # The template this replaces inferred the languages from whatever sat in the
      # checkout root, so a monorepo with services/api/package.json was reported as
      # having no Node project and passed. Here the consumer declares every lockfile
      # that must exist, per language root, and an undeclared root cannot be missed
      # because nothing is inferred.
      #
      # It also refuses the "one pinned line is reproducibility" reading: for a
      # requirements-style file EVERY requirement must be pinned, not merely one.
      #
      # Delivery: embedded verbatim in the component job script, because an
      # `include:` imports YAML and never checks out this repository.
      # tests/runtime/scan/test_embedded_runtime.py fails when the copy drifts.
      #
      # Usage:
      #   lockfiles.sh --out <file> --lockfiles <comma-separated relative paths>
      #   lockfiles.sh --out <file> --lockfiles none
      #
      # `none` is the one value that is not a path. It declares that the project has
      # no dependency lock file, which a project with no third-party dependencies
      # genuinely does not: a stdlib-only Go module commits an empty go.sum. An empty
      # list is still refused, because "I did not fill this in" and "there is nothing
      # to fill in" must not be the same input. `none` cannot be combined with a path.
      #
      # The list arrives as one comma-separated string because a GitLab `array` input
      # can only be interpolated where YAML expects an array (tags, rules, needs), not
      # into a variable a shell can read. Splitting it here rather than in the job
      # keeps the parsing under test.
      #
      # Exit codes: 0 every declared lockfile is present and pinned, 1 a declared
      # lockfile is missing, empty or unpinned, 2 usage or environment error.

      set -eu

      die() {
        echo "lockfiles: ERROR: $1" >&2
        exit 2
      }

      jstr() {
        printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
      }

      # A requirements-style file is reproducible only when every requirement line
      # names an exact version. Hash lines and nested -r/-c includes are part of the
      # pinning mechanism; an editable install (-e) and a bare or range requirement
      # are not.
      requirements_unpinned() {
        # Strip comments, indentation, a line-continuation backslash and trailing
        # whitespace, so an indented --hash continuation is recognised as part of the
        # pin rather than counted as a floating requirement.
        sed -e 's/[[:space:]]*#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*\\$//' \
          -e 's/[[:space:]]*$//' "$1" | while IFS= read -r line; do
          case "$line" in
            '') continue ;;
            -r*|--requirement*|-c*|--constraint*|--hash*|--index-url*|--extra-index-url*|--find-links*|--no-binary*|--only-binary*|--trusted-host*|--pre) continue ;;
            *'=='*) continue ;;
            *'@'*) continue ;;
            *) printf '%s\n' "$line" ;;
          esac
        done
      }

      out=''
      lockfiles=''

      while [ "$#" -gt 0 ]; do
        case "$1" in
          --out) out=$2 ; shift 2 ;;
          --lockfiles)
            old_ifs=$IFS
            IFS=','
            for declared in $2; do
              IFS=$old_ifs
              case "$declared" in
                '') continue ;;
                /*) die "lockfile path must be relative to the working directory: $declared" ;;
                *..*) die "lockfile path must not traverse outside the working directory: $declared" ;;
                *[[:space:]]*) die "lockfile path must not contain whitespace: $declared" ;;
              esac
              lockfiles="$lockfiles $declared"
              IFS=','
            done
            IFS=$old_ifs
            shift 2
            ;;
          *) die "unknown argument: $1" ;;
        esac
      done

      [ -n "$out" ] || die 'missing --out'
      [ -n "$lockfiles" ] || die 'no lockfile declared; this component validates a declared set, it does not guess one'

      declared=set
      case " $lockfiles " in
        *' none '*)
          # A declaration, not a path. Mixing it with one is ambiguous -- it would
          # read both as "there is nothing to check" and as "check this" -- so it is
          # refused rather than resolved in either direction.
          [ "$lockfiles" = ' none' ] ||
            die "'none' declares that there is no lockfile, so it cannot be combined with a path:$lockfiles"
          declared=none
          lockfiles=''
          ;;
      esac

      failed=0
      mkdir -p "$(dirname "$out")"

      {
        printf '{\n'
        printf '  "schema_version": 1,\n'
        printf '  "subject": {\n'
        printf '    "project": "%s",\n' "$(jstr "${CI_PROJECT_PATH:-unresolved}")"
        printf '    "commit": "%s",\n' "$(jstr "${CI_COMMIT_SHA:-unresolved}")"
        printf '    "working_directory": "%s"\n' "$(jstr "$(pwd)")"
        printf '  },\n'
        printf '  "declared": "%s",\n' "$declared"
        printf '  "checks": [\n'
      } > "$out"

      first=1
      for lockfile in $lockfiles; do
        present=true
        pinned=true
        detail=''

        if [ ! -f "$lockfile" ]; then
          present=false
          pinned=false
          detail='declared lockfile is missing'
        elif [ ! -s "$lockfile" ]; then
          pinned=false
          detail='declared lockfile is empty'
        else
          case "$(basename "$lockfile")" in
            requirements*.txt|constraints*.txt)
              unpinned_count=$(requirements_unpinned "$lockfile" | wc -l | tr -d ' ')
              if [ "$unpinned_count" -gt 0 ]; then
                pinned=false
                detail="$unpinned_count requirement line(s) are not pinned to an exact version"
                requirements_unpinned "$lockfile" | head -5 | while IFS= read -r bad; do
                  echo "lockfiles:   unpinned: $lockfile: $bad" >&2
                done
              fi
              ;;
          esac
        fi

        if [ "$present" = true ] && [ "$pinned" = true ]; then
          echo "lockfiles: OK   $lockfile"
        else
          echo "lockfiles: FAIL $lockfile: $detail" >&2
          failed=1
        fi

        if [ "$first" -eq 1 ]; then first=0; else printf ',\n' >> "$out"; fi
        printf '    {"path": "%s", "present": %s, "pinned": %s, "detail": "%s"}' \
          "$(jstr "$lockfile")" "$present" "$pinned" "$(jstr "$detail")" >> "$out"
      done

      {
        printf '\n  ],\n'
        if [ "$failed" -eq 0 ]; then
          printf '  "status": "pass",\n'
        else
          printf '  "status": "fail",\n'
        fi
        printf '  "created_at": "%s",\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf '  "pipeline_id": "%s",\n' "$(jstr "${CI_PIPELINE_ID:-unresolved}")"
        printf '  "job_id": "%s"\n' "$(jstr "${CI_JOB_ID:-unresolved}")"
        printf '}\n'
      } >> "$out"

      echo "lockfiles: evidence written to $out"

      if [ "$failed" -ne 0 ]; then
        echo 'lockfiles: FAIL: one or more declared lockfiles are missing or unpinned.' >&2
        exit 1
      fi
      if [ "$declared" = none ]; then
        echo 'lockfiles: PASS: the project declares no lockfile (lockfiles: none); nothing to validate.'
      else
        echo 'lockfiles: PASS: every declared lockfile is present and pinned.'
      fi
      CI_TPL_EMBED_EOF
      chmod +x "$CI_PROJECT_DIR/.ci-tpl/lockfiles.sh" || exit 1
      # END embed
  script:
    - |
      sh "$CI_PROJECT_DIR/.ci-tpl/lockfiles.sh" \
        --lockfiles "$CI_TPL_LOCKFILES" \
        --out "$CI_PROJECT_DIR/$CI_TPL_ARTIFACT_DIR/lockfile-result.json"
  artifacts:
    name: '$[[ inputs.instance ]]-quality-dependency-lockfiles-$CI_JOB_ID'
    paths:
      - '.ci-artifacts/$[[ inputs.instance ]]/quality-dependency-lockfiles/'
    when: always
    expire_in: 1 week
  rules: $[[ inputs.run-rules ]]
  allow_failure: false
  interruptible: true
  # Infrastructure only. Section 10.1 forbids weakening an outcome, and any
  # condition other than runner_system_failure would retry a failed gate;
  # tests/contracts/test_retry_policy.py fails the build on one.
  retry:
    max: $[[ inputs.max-retries ]]
    when: [runner_system_failure]
  # Insulation from the consumer's `default:` block (section 13.1). A component
  # job runs in the image the component pins and the shell the component ships;
  # a consumer's global image, before_script, after_script, cache, services,
  # artifacts or hooks reaching it is a component running something nobody
  # reviewed. Runner selection and timeouts are the consumer's to set, so those
  # stay inherited. `retry` and `id_tokens` stay too: this component sets both
  # itself, and a consumer-level definition is a deliberate estate choice.
  inherit:
    default: [tags, timeout, interruptible, retry, id_tokens]
