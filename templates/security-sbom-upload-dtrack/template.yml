---
# Upload the authoritative SBOM to Dependency-Track and wait for its analysis.
#
# Section 10.3: "Dependency-Track upload acceptance likewise does not establish
# completed analysis or policy compliance." The predecessor checked for a 2xx,
# printed "SBOM uploaded successfully" and carried allow_failure: true, with two
# optional producers able to supply the same sbom.cdx.json (audit 5.5). Here the
# producer is named, the subject record says which image the SBOM describes, and
# the upload token is polled until Dependency-Track reports it processed.

#### Public interface ####
spec:
  inputs:
    instance:
      type: string
      description: Unique workload instance used in the job name.
      regex: '^[a-z][a-z0-9-]{0,47}$'
    stage:
      type: string
      description: Stage supplied by the owning composition.
      default: scan
    execution-image:
      type: string
      description: Approved Python execution image pinned by digest.
      default: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
      regex: '^.+@sha256:[0-9a-f]{64}$'
    runner-tags:
      type: array
      description: Runner selection from the estate profile.
      default: []
    max-retries:
      type: number
      description: >-
        How many times the runner may retry this job. The condition is
        runner_system_failure only, so this retries infrastructure and never a
        failed gate.
      default: 1
      options: [0, 1, 2]
    run-rules:
      type: array
      description: Job eligibility set by the composition.
      default:
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    sbom-job:
      type: string
      description: >-
        Exact name of the security-sbom-syft job whose sbom.cdx.json and
        subject.json are uploaded. One named producer, not two optional ones.
    gate-jobs:
      type: array
      description: >-
        Additional jobs that must succeed first, as needs entries with
        artifacts false. The SBOM producer above is always included.
      default: []
    api-url:
      type: string
      description: >-
        Dependency-Track base URL. No default: .ci/estate.yml records no
        Dependency-Track endpoint, and a component must not invent an estate fact.
    project-name:
      type: string
      description: Dependency-Track project name.
      default: $CI_PROJECT_NAME
    project-version:
      type: string
      description: Dependency-Track project version.
      default: $CI_COMMIT_SHA
    wait-for-analysis:
      type: string
      description: >-
        true polls the upload token until Dependency-Track finishes processing
        it. false records an accepted upload and says so in the evidence.
      default: 'true'
      options: ['true', 'false']
    analysis-timeout:
      type: number
      description: Seconds to wait for the analysis before failing.
      default: 600
---
"$[[ inputs.instance ]]:security-sbom-upload-dtrack":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.execution-image ]]
    entrypoint: ['']
  tags: $[[ inputs.runner-tags ]]
  variables:
    # Non-root execution images own their build directory: the runner reads the
    # image's uid and gid and chowns it, instead of relying on umask 0000.
    # Without it, a job running as a non-root uid died on .git/objects that a
    # root job had written into the same concurrency slot.
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 'true'
    # The SBOM and its subject record arrive as artifacts from the producer named
    # in sbom-job, and nothing here opens a file from the checkout, so the clone
    # is time spent on nothing.
    GIT_STRATEGY: none
    CI_TPL_RUNTIME_DIR: /tmp/ci-runtime
    CI_TPL_ARTIFACT_DIR: '.ci-artifacts/$[[ inputs.instance ]]/security-sbom-upload-dtrack'
    CI_TPL_SBOM_DIR: '.ci-artifacts/$[[ inputs.instance ]]/security-sbom-syft'
    CI_TPL_API_URL: $[[ inputs.api-url ]]
    CI_TPL_PROJECT_NAME: $[[ inputs.project-name ]]
    CI_TPL_PROJECT_VERSION: $[[ inputs.project-version ]]
    CI_TPL_WAIT_FOR_ANALYSIS: '$[[ inputs.wait-for-analysis ]]'
    CI_TPL_ANALYSIS_TIMEOUT: '$[[ inputs.analysis-timeout ]]'
  needs:
    - job: $[[ inputs.sbom-job ]]
      artifacts: true
    - $[[ inputs.gate-jobs ]]
  before_script:
    - |
      # BEGIN embed dir $CI_TPL_RUNTIME_DIR runtime/httpjson.py runtime/dtrack/dtrack.py
      mkdir -p "$CI_TPL_RUNTIME_DIR" "$CI_TPL_RUNTIME_DIR/dtrack" || exit 1
      cat > "$CI_TPL_RUNTIME_DIR/httpjson.py" <<'CI_TPL_EMBED_EOF' || exit 1
      """Minimal JSON-over-HTTPS client shared by the runtime helpers.

      The predecessor templates parsed API responses with `grep -o '"key":"[^"]*"'`,
      which returns an empty string for a field the server never sent. An absent
      `readiness` field then compared unequal to `"red"` and the release gate passed on
      an empty response (audit 6.2). Everything here uses a real parser and treats a
      response it cannot parse as a failure.

      Only the standard library: runtime/<domain>/install.sh writes these helpers
      into a job's runtime directory, and nothing is installed there.

      Nothing in this module logs a header value or a request body. Credentials reach
      it as arguments and stay there.
      """

      from __future__ import annotations

      import json
      import urllib.error
      import urllib.request
      from typing import Any


      class HttpError(RuntimeError):
          """The request could not be completed, which is never a passing result."""


      class Response:
          def __init__(self, status: int, body: bytes):
              self.status = status
              self.body = body

          @property
          def text(self) -> str:
              return self.body.decode("utf-8", errors="replace")

          def json(self) -> Any:
              """Parsed body, or HttpError.

              A body that is not JSON is a failure and not an empty result: the caller
              asked an API a question and did not get an answer it can read.
              """
              try:
                  return json.loads(self.body)
              except (ValueError, UnicodeDecodeError) as error:
                  raise HttpError(f"response body is not JSON: {error}") from error

          def ok(self) -> bool:
              return 200 <= self.status < 300


      def request(
          method: str,
          url: str,
          *,
          headers: dict[str, str] | None = None,
          body: bytes | None = None,
          timeout: int = 30,
      ) -> Response:
          """Perform one HTTPS request and return its status and body.

          An HTTP error status is returned, not raised: callers decide which codes are
          expected. Only a transport-level failure raises, because that is a question
          that never reached the server.
          """
          if not url.startswith("https://"):
              # TLS is not optional, and neither is a maintained trust bundle
              # (section 10.2). A plaintext endpoint is a configuration error.
              raise HttpError(f"refusing a non-HTTPS request to {url}")

          req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
          try:
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return Response(response.status, response.read())
          except urllib.error.HTTPError as error:
              return Response(error.code, error.read())
          except urllib.error.URLError as error:
              raise HttpError(f"{method} {url} could not be completed: {error.reason}") from error
          except TimeoutError as error:
              raise HttpError(f"{method} {url} timed out after {timeout}s") from error


      def get_json(url: str, **kwargs: Any) -> Any:
          response = request("GET", url, **kwargs)
          if not response.ok():
              raise HttpError(f"GET {url} returned HTTP {response.status}: {response.text[:300]}")
          return response.json()
      CI_TPL_EMBED_EOF
      cat > "$CI_TPL_RUNTIME_DIR/dtrack/dtrack.py" <<'CI_TPL_EMBED_EOF' || exit 1
      """Upload an authoritative SBOM to Dependency-Track and wait for its analysis.

          dtrack.py upload --url U --api-key-variable NAME --sbom F --subject F
                           --project-name N --project-version V --output F

      Section 10.3 names this failure mode directly: "Dependency-Track upload
      acceptance likewise does not establish completed analysis or policy compliance."
      The template this replaces checked only for a 2xx and printed "SBOM uploaded
      successfully", under `allow_failure: true` (audit 5.5). Here the upload token is
      polled until Dependency-Track reports the BOM processed, and a run that is still
      processing when the budget expires fails.

      The API key is read from the environment by NAME. It is never an input, never
      logged and never placed in a URL.

      The SBOM's subject record is read alongside it so the evidence says which image
      was uploaded, rather than trusting whichever artifact landed last.
      """

      from __future__ import annotations

      import argparse
      import base64
      import json
      import os
      import sys
      import time
      from pathlib import Path

      sys.path.insert(0, str(Path(__file__).resolve().parent.parent))

      from httpjson import HttpError, request  # noqa: E402


      class UploadFailure(RuntimeError):
          """The upload or the analysis did not complete."""


      def now() -> str:
          return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())


      def read_subject(path: Path) -> dict:
          if not path.is_file():
              raise UploadFailure(
                  f"subject record not found: {path}. The SBOM producer must emit one "
                  "so this upload can name the image it describes."
              )
          try:
              subject = json.loads(path.read_text())
          except ValueError as error:
              raise UploadFailure(f"{path} is not valid JSON: {error}") from error
          reference = subject.get("image_reference", "")
          if "@sha256:" not in reference:
              raise UploadFailure(f"{path} names no immutable image reference")
          return subject


      def upload_bom(args: argparse.Namespace, api_key: str, sbom: bytes) -> str:
          payload = json.dumps(
              {
                  "projectName": args.project_name,
                  "projectVersion": args.project_version,
                  "autoCreate": True,
                  "bom": base64.b64encode(sbom).decode("ascii"),
              }
          ).encode()

          response = request(
              "PUT",
              f"{args.url.rstrip('/')}/api/v1/bom",
              headers={"Content-Type": "application/json", "X-Api-Key": api_key},
              body=payload,
              timeout=args.request_timeout,
          )
          if not response.ok():
              raise UploadFailure(
                  f"Dependency-Track rejected the SBOM with HTTP {response.status}: "
                  f"{response.text[:300]}"
              )

          body = response.json()
          token = body.get("token") if isinstance(body, dict) else None
          if not token:
              raise UploadFailure(
                  "Dependency-Track accepted the upload but returned no processing "
                  "token, so completion cannot be established"
              )
          return token


      def wait_for_analysis(args: argparse.Namespace, api_key: str, token: str) -> None:
          """Poll the BOM token until Dependency-Track stops processing it."""
          deadline = time.monotonic() + args.analysis_timeout
          while True:
              response = request(
                  "GET",
                  f"{args.url.rstrip('/')}/api/v1/bom/token/{token}",
                  headers={"X-Api-Key": api_key},
                  timeout=args.request_timeout,
              )
              if not response.ok():
                  raise UploadFailure(
                      f"could not read the processing state of token {token}: "
                      f"HTTP {response.status}"
                  )
              body = response.json()
              if not isinstance(body, dict) or "processing" not in body:
                  raise UploadFailure(
                      "Dependency-Track returned no processing state; an unreadable "
                      "answer is not a completed analysis"
                  )
              if not body["processing"]:
                  return
              if time.monotonic() >= deadline:
                  raise UploadFailure(
                      f"Dependency-Track was still processing token {token} after "
                      f"{args.analysis_timeout}s; the upload is not an analysis"
                  )
              time.sleep(args.poll_interval)


      def upload(args: argparse.Namespace) -> int:
          api_key = os.environ.get(args.api_key_variable, "")
          if not api_key:
              raise UploadFailure(
                  f"{args.api_key_variable} is not set. Define it as a masked CI "
                  "variable; this component never takes a secret as an input."
              )

          sbom_path = Path(args.sbom)
          if not sbom_path.is_file() or sbom_path.stat().st_size == 0:
              raise UploadFailure(f"no SBOM to upload at {sbom_path}")

          subject = read_subject(Path(args.subject))
          sbom = sbom_path.read_bytes()

          token = upload_bom(args, api_key, sbom)
          analysed = False
          if args.wait_for_analysis:
              wait_for_analysis(args, api_key, token)
              analysed = True

          output = Path(args.output)
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "status": "analysed" if analysed else "accepted",
                      "subject": subject["image_reference"],
                      "endpoint": args.url,
                      "project_name": args.project_name,
                      "project_version": args.project_version,
                      "bom_token": token,
                      "sbom_sha256": subject.get("sbom_sha256", ""),
                      "analysis_completed": analysed,
                      "created_at": now(),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n"
          )

          state = "analysed" if analysed else "accepted (analysis not awaited)"
          print(f"Dependency-Track {state}: {args.project_name} {args.project_version}")
          return 0


      def build_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(description=__doc__)
          sub = parser.add_subparsers(dest="command", required=True)

          upload_parser = sub.add_parser("upload", help="upload an SBOM and await its analysis")
          upload_parser.add_argument("--url", required=True)
          upload_parser.add_argument("--api-key-variable", required=True)
          upload_parser.add_argument("--sbom", required=True)
          upload_parser.add_argument("--subject", required=True)
          upload_parser.add_argument("--project-name", required=True)
          upload_parser.add_argument("--project-version", required=True)
          upload_parser.add_argument("--output", required=True)
          upload_parser.add_argument("--wait-for-analysis", default="true")
          upload_parser.add_argument("--analysis-timeout", type=int, default=600)
          upload_parser.add_argument("--poll-interval", type=int, default=10)
          upload_parser.add_argument("--request-timeout", type=int, default=60)
          upload_parser.set_defaults(handler=upload)

          return parser


      def main(argv: list[str] | None = None) -> int:
          args = build_parser().parse_args(argv)
          if isinstance(getattr(args, "wait_for_analysis", None), str):
              args.wait_for_analysis = args.wait_for_analysis.lower() == "true"
          try:
              return args.handler(args)
          except (UploadFailure, HttpError) as error:
              print(f"ERROR: {error}", file=sys.stderr)
              return 1


      if __name__ == "__main__":
          raise SystemExit(main())
      CI_TPL_EMBED_EOF
      # END embed
  script:
    - |
      mkdir -p "$CI_TPL_ARTIFACT_DIR" || exit 1
      # The API key is read from the environment by name inside the helper, so
      # it never reaches an input, an argument list or a URL.
      python3 "$CI_TPL_RUNTIME_DIR/dtrack/dtrack.py" upload \
        --url "$CI_TPL_API_URL" \
        --api-key-variable DTRACK_API_KEY \
        --sbom "$CI_TPL_SBOM_DIR/sbom.cdx.json" \
        --subject "$CI_TPL_SBOM_DIR/subject.json" \
        --project-name "$CI_TPL_PROJECT_NAME" \
        --project-version "$CI_TPL_PROJECT_VERSION" \
        --wait-for-analysis "$CI_TPL_WAIT_FOR_ANALYSIS" \
        --analysis-timeout "$CI_TPL_ANALYSIS_TIMEOUT" \
        --output "$CI_TPL_ARTIFACT_DIR/dtrack-upload-result.json" || exit 1
  artifacts:
    name: '$[[ inputs.instance ]]-security-sbom-upload-dtrack-$CI_JOB_ID'
    paths:
      - '.ci-artifacts/$[[ inputs.instance ]]/security-sbom-upload-dtrack/'
    when: always
    # .ci/estate.yml retention.evidence.
    expire_in: 1 week
  rules: $[[ inputs.run-rules ]]
  allow_failure: false
  interruptible: true
  # Infrastructure only. Section 10.1 forbids weakening an outcome, and any
  # condition other than runner_system_failure would retry a failed gate;
  # tests/contracts/test_retry_policy.py fails the build on one.
  retry:
    max: $[[ inputs.max-retries ]]
    when: [runner_system_failure]
  # Insulation from the consumer's `default:` block (section 13.1). A component
  # job runs in the image the component pins and the shell the component ships;
  # a consumer's global image, before_script, after_script, cache, services,
  # artifacts or hooks reaching it is a component running something nobody
  # reviewed. Runner selection and timeouts are the consumer's to set, so those
  # stay inherited. `retry` and `id_tokens` stay too: this component sets both
  # itself, and a consumer-level definition is a deliberate estate choice.
  inherit:
    default: [tags, timeout, interruptible, retry, id_tokens]
