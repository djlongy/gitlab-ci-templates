---
name: security-verify-vigil
kind: component
status: experimental
introduced_in: 1.0.0
minimum_gitlab: '18.9'
# Retry policy: the `max-retries` input (0, 1 or 2, default 1) sets `retry: max`,
# and `retry: when` is `runner_system_failure` and nothing else. A job killed by
# its runner runs again; a failed gate never does.
emitted_jobs:
  - pattern: '{instance}:security-verify-vigil'
    stage: attest
    blocking: true
outputs:
  - path: .ci-artifacts/{instance}/security-verify-vigil/gate-result.json
    producer: '{instance}:security-verify-vigil'
    format: JSON
    schema: >-
      schema_version 1; evaluator, endpoint, subject, readiness,
      required_readiness, deployable, reason, signed, scan_complete, result
      (pass or fail), created_at.
    subject_identity: repository@sha256 digest from the build's image.json.
    retention: 1 week
required_secrets: []
runtime_image:
  reference: 'docker.io/python@sha256:cd7c412d000912f29075a1b8803e43cb2f38bb67f104019df526df5ceaf30569'
  pinning: digest
  tool_versions:
    python: '3.12'
# No checkout: this job reads the named producer's artifacts and the APIs it
# calls, so it runs with GIT_STRATEGY none and never clones the consumer
# repository. tests/contracts/test_git_strategy.py holds both halves together.
trust:
  privileged: false
  network_egress:
    - The Vigil instance named by the vigil-url input
  runner_profile: Any unprivileged Docker executor.
  protected_ref_required: false
validation:
  evidence:
    - source-reviewed
    - yaml-parsed
    - gitlab-linted
    - runtime-tested
  verified_at: 2026/09/15
  environment: gitlab.example.com 18.9.1-ee, project 18
  notes: >-
    This is a release gate and it fails closed. A Vigil that never returns a
    record for the digest within max-wait, a response that is not an object, a
    response with no usable readiness verdict, a response about a different
    digest, and a verdict below require-readiness all fail the job. The
    predecessor exited 0 on the first three. The readiness lookup is by digest
    taken from image.json. The predecessor derived one with sed 's/.*@//', which
    returns a tag unchanged. gitlab-linted through the CI Lint API; no job ran.
    runtime-tested: unit tests cover each failure path and the retry loop
    against a stubbed API. No request has been made to a real Vigil instance.
    Status: experimental, because no consumer pipeline has run this component on
    1.0.0-rc.2. `released` in this repository means a consumer job executed
    green, not that the component looks finished. No consumer enables vigil.
