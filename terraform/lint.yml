# Reusable Terraform lint template
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/terraform/lint.yml'
#       ref: main

.terraform-lint:
  stage: lint
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  script:
    - terraform fmt -check -recursive ${LINT_DIR:-.}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform-lint:
  extends: .terraform-lint
