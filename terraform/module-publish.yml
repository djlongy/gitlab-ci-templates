# Reusable Terraform module publishing template
# Publishes modules to GitLab Terraform Module Registry on version tags
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/terraform/module-publish.yml'
#       ref: main
#
# Consumer defines jobs that extend .module-publish with MODULE_DIR, MODULE_NAME, MODULE_SYSTEM

.module-publish:
  stage: publish
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl tar
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - tar -czf /tmp/${MODULE_NAME}-${MODULE_SYSTEM}-${VERSION}.tgz -C ${MODULE_DIR} .
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN"
       --upload-file /tmp/${MODULE_NAME}-${MODULE_SYSTEM}-${VERSION}.tgz
       "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/terraform/modules/${MODULE_NAME}/${MODULE_SYSTEM}/${VERSION}/file"'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
