# Reusable Terraform plan + apply template with manual gate
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/terraform/plan-apply.yml'
#       ref: main
#
# Consumer must define:
#   - DEPLOY_DIR variable
#   - TF_HTTP_USERNAME, TF_HTTP_PASSWORD (for state backend)

.terraform-init:
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  before_script:
    - export TF_HTTP_USERNAME=${TF_HTTP_USERNAME:-root}
    - cd ${DEPLOY_DIR}
    - terraform init

.terraform-plan:
  extends: .terraform-init
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - ${DEPLOY_DIR}/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ${DEPLOY_DIR}/**/*

.terraform-apply:
  extends: .terraform-init
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ${DEPLOY_DIR}/**/*
      when: manual
  allow_failure: false
