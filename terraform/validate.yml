# Reusable Terraform validate template
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/terraform/validate.yml'
#       ref: main
#
# Consumer must define DEPLOY_DIR variable in their jobs

.terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.11
    entrypoint: [""]
  before_script:
    - cd ${DEPLOY_DIR}
    - terraform init -backend=false
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ${DEPLOY_DIR}/**/*
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - ${DEPLOY_DIR}/**/*
