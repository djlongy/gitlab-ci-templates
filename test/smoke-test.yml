# Reusable smoke test template — runs after build, before scan
# Usage:
#   include:
#     - project: 'platform/ci-templates'
#       file: '/test/smoke-test.yml'
#       ref: main
#
# Requires:
#   - docker-compose.test.yml in the repo root
#   - tests/smoke/ directory with test scripts
#   - Makefile with test-smoke target
#
# Toggle variables:
#   SMOKE_TEST_TARGET: Make target to run (default: test-smoke)
#   API_IMAGE:         Override API image tag
#   FRONTEND_IMAGE:    Override frontend image tag

.smoke-test:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TEST_HOST: "docker"
    SMOKE_TEST_TARGET: "test-smoke"
  before_script:
    - apk add --no-cache curl make bash
    - |
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        REGISTRY=$(echo "${IMAGE_NAME}" | cut -d/ -f1)
        mkdir -p ~/.docker
        AUTH=$(echo -n "${REGISTRY_USER}:${REGISTRY_PASSWORD}" | base64)
        echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"${AUTH}\"}}}" > ~/.docker/config.json
      fi
  script:
    - make "${SMOKE_TEST_TARGET}"
  artifacts:
    when: on_failure
    paths:
      - tests/smoke/*.log
    expire_in: 3 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$/'
  allow_failure: false
